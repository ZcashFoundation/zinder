# Scrape config for deploy-mode observability (Prometheus running inside
# deploy/docker-compose.yml on the same Docker network as `zinder-index` and
# `zinder-serve`, which shares `zinder-index`'s network namespace). The local
# smoke-mode equivalent lives at observability/prometheus/prometheus.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/rules/compose/*.yml

scrape_configs:
  - job_name: "zinder-index"
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    metrics_path: "/metrics"
    static_configs:
      - targets: ["zinder-index:9105"]
        labels:
          stack: "zinder"
          service: "zinder-index"

  - job_name: "zinder-serve"
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    metrics_path: "/metrics"
    static_configs:
      - targets: ["zinder-index:9108"]
        labels:
          stack: "zinder"
          service: "zinder-serve"

  - job_name: "prometheus"
    scrape_interval: 60s
    static_configs:
      - targets: ["localhost:9090"]
