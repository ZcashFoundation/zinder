# Clean RocksDB storage construction against an existing Zebra.
#
# The topology reuses only Zebra's external network and authentication cookie.
# Canonical and wallet state are project-scoped, disposable volumes. Zebra's
# chain volume is neither declared nor mounted.
name: ${ZINDER_STORAGE_LIFECYCLE_PROJECT_NAME:-zinder-storage-lifecycle-test}

services:
  state-init:
    image: ${ZINDER_STORAGE_LIFECYCLE_INIT_IMAGE:-debian:bookworm-slim}
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      - chown
      - -R
      - ${ZINDER_STORAGE_LIFECYCLE_UID:-1000}:${ZINDER_STORAGE_LIFECYCLE_GID:-1000}
      - /var/lib/zinder/canonical-state
      - /var/lib/zinder/wallet-state
    volumes:
      - type: volume
        source: canonical_state
        target: /var/lib/zinder/canonical-state
        volume:
          nocopy: true
      - type: volume
        source: wallet_state
        target: /var/lib/zinder/wallet-state
        volume:
          nocopy: true

  rocksdb-storage-lifecycle:
    image: ${ZINDER_STORAGE_LIFECYCLE_IMAGE:?set ZINDER_STORAGE_LIFECYCLE_IMAGE to an immutable image ID or digest-pinned reference}
    user: "${ZINDER_STORAGE_LIFECYCLE_UID:-1000}:${ZINDER_STORAGE_LIFECYCLE_GID:-1000}"
    init: true
    read_only: true
    restart: "no"
    cgroup: private
    cpus: ${ZINDER_STORAGE_LIFECYCLE_CPU_LIMIT_CORES:?set the measured CPU limit in cores}
    mem_limit: ${ZINDER_STORAGE_LIFECYCLE_MEMORY_LIMIT_BYTES:?set the measured memory limit in bytes}
    depends_on:
      state-init:
        condition: service_completed_successfully
    networks: [source]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ZINDER_BENCH_RESOURCE_EVIDENCE_PATH: /var/lib/zinder-evidence/rocksdb-storage-lifecycle.resources.json
      ZINDER_BENCH_RESOURCE_COMPONENT_ID: rocksdb-storage-lifecycle
      ZINDER_BENCH_RESOURCE_TRIAL_ID: ${ZINDER_STORAGE_LIFECYCLE_TRIAL_ID:?set ZINDER_STORAGE_LIFECYCLE_TRIAL_ID to a unique evidence identifier}
      # Includes canonical and wallet stores plus their sibling SST staging paths.
      ZINDER_BENCH_RESOURCE_STORAGE_PATH: /var/lib/zinder
      ZINDER_BENCH_RESOURCE_SAMPLE_INTERVAL_SECONDS: ${ZINDER_STORAGE_LIFECYCLE_SAMPLE_INTERVAL_SECONDS:-1}
      ZINDER_BENCH_RESOURCE_REQUIRE_EXACT_MEMORY: "true"
      ZINDER_BENCH_RESOURCE_REQUIRE_SAMPLED_STORAGE: "true"
      ZINDER_BENCH_RESOURCE_REQUIRE_PRIVATE_CGROUP_NAMESPACE: "true"
    tmpfs:
      - /tmp:size=${ZINDER_STORAGE_LIFECYCLE_TMPFS_SIZE:-1g},mode=1777
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - type: bind
        source: ${ZINDER_STORAGE_LIFECYCLE_EVIDENCE_PATH:?set ZINDER_STORAGE_LIFECYCLE_EVIDENCE_PATH to an existing writable directory}
        target: /var/lib/zinder-evidence
        bind:
          create_host_path: false
      - type: volume
        source: source_cookie
        target: /var/run/zebra-auth
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: canonical_state
        target: /var/lib/zinder/canonical-state
        volume:
          nocopy: true
      - type: volume
        source: wallet_state
        target: /var/lib/zinder/wallet-state
        volume:
          nocopy: true
    command:
      - rocksdb-storage-lifecycle
      - --network
      - ${ZINDER_NETWORK:-zcash-testnet}
      - --json-rpc-addr
      - ${ZINDER_NODE_JSON_RPC_ADDR:-http://zebra:18232}
      - --node-auth-cookie
      - /var/run/zebra-auth/.cookie
      - --canonical-store
      - /var/lib/zinder/canonical-state/canonical
      - --wallet-store
      - /var/lib/zinder/wallet-state/wallet
      - --tip-height
      - ${ZINDER_STORAGE_LIFECYCLE_TIP_HEIGHT:?set the fixed source tip height}
      - --request-timeout-secs
      - ${ZINDER_NODE_REQUEST_TIMEOUT_SECS:-30}
      - --max-response-bytes
      - ${ZINDER_NODE_MAX_RESPONSE_BYTES:-67108864}
      - --supported-reorg-depth
      - ${ZINDER_SUPPORTED_REORG_DEPTH:-1000}
      - --software-revision
      - ${ZINDER_STORAGE_LIFECYCLE_SOFTWARE_REVISION:?set the exact tested revision}
      - --trial-id
      - ${ZINDER_STORAGE_LIFECYCLE_TRIAL_ID}
      - --runner-id
      - ${ZINDER_STORAGE_LIFECYCLE_RUNNER_ID:?set the stable host and resource profile identity}
      - --cpu-limit-cores
      - ${ZINDER_STORAGE_LIFECYCLE_CPU_LIMIT_CORES}
      - --memory-limit-bytes
      - ${ZINDER_STORAGE_LIFECYCLE_MEMORY_LIMIT_BYTES}
      - --storage-class
      - ${ZINDER_STORAGE_LIFECYCLE_STORAGE_CLASS:?set the measured storage class}
      - --image-reference
      - ${ZINDER_STORAGE_LIFECYCLE_IMAGE}
      - --report
      - /var/lib/zinder-evidence/rocksdb-storage-lifecycle.json

volumes:
  canonical_state:
  wallet_state:
  source_cookie:
    external: true
    name: ${ZINDER_SOURCE_COOKIE_VOLUME_NAME:-z3-testnet-cookie}

networks:
  source:
    external: true
    name: ${ZINDER_SOURCE_NETWORK_NAME:-z3-testnet}
