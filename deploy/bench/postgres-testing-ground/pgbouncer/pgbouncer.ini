[databases]
zinder_testing = host=postgres port=5432 dbname=zinder_testing

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
default_pool_size = 4
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 100
max_db_connections = 8
server_reset_query =
max_prepared_statements = 0

ignore_startup_parameters = extra_float_digits,options

admin_users = zinder_admin
stats_users = zinder_admin,zinder_reader

server_login_retry = 1
client_login_timeout = 10
query_timeout = 15
