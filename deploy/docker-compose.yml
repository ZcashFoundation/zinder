# Single-host Zinder deployment topology using the unified `zinder` image.
#
# `zinder-index` owns write access to the canonical and wallet stores.
# `zinder-serve` runs reader roles in `zinder-index`'s network namespace so
# authenticated control stays loopback-only while sharing the node and
# observability networks.
#
# Select a deployment preset (`wallet`, `light-wallet`, or `explorer`) in your
# `zinder.env` via `ZINDER_DEPLOYMENT__PROFILE` (default: `wallet`).
#
# DEPLOY_VERSION=vX.Y.Z pulls the signed release image of that tag; use the
# Compose file from the same tag. Without it, `up -d --build` builds from
# this checkout and tags `:local`.
#
# The Zcash node is external to this project. Select one of the
# `deploy/profiles/<name>/deploy.env` files for its Docker network, cookie
# volume, host ports, and paired `zinder.env` (`DEPLOY_ZINDER_ENV`).
name: zinder-${DEPLOY_NETWORK:?set DEPLOY_NETWORK to mainnet, testnet, or regtest}

networks:
  node:
    external: true
    name: ${DEPLOY_NODE_NETWORK:?set the node's external Docker network name}
  observability:
    name: ${DEPLOY_OBSERVABILITY_NETWORK:-zinder-${DEPLOY_NETWORK}-observability}

x-zinder-image: &zinder-image
  image: ${DEPLOY_IMAGE:-ghcr.io/zcashfoundation/zinder:${DEPLOY_VERSION:-local}}
  stop_grace_period: 30s
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: zinder
    args:
      ZINDER_PASTA_ASM: ${DEPLOY_PASTA_ASM:-1}
      ZINDER_X86_64_CPU_BASELINE: ${DEPLOY_X86_64_CPU_BASELINE:-x86-64-v3}

services:
  state-init:
    image: debian:bookworm-slim
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/zinder/secondary /var/lib/zinder/checkpoints && chown -R 10001:10001 /var/lib/zinder",
      ]
    volumes:
      - type: volume
        source: data
        target: /var/lib/zinder
        volume:
          nocopy: true
      - type: volume
        source: checkpoint-staging
        target: /var/lib/zinder/checkpoints
        volume:
          nocopy: true

  zinder-index:
    <<: *zinder-image
    mem_limit: ${DEPLOY_INDEX_MEMORY_LIMIT:-20g}
    ulimits:
      nofile:
        soft: ${DEPLOY_NOFILE_SOFT_LIMIT:-65536}
        hard: ${DEPLOY_NOFILE_HARD_LIMIT:-65536}
    restart: on-failure
    depends_on:
      state-init:
        condition: service_completed_successfully
    networks:
      node:
        aliases:
          - zinder-${DEPLOY_NETWORK}-index
          - zinder-${DEPLOY_NETWORK}-ingest
      observability:
    volumes:
      - data:/var/lib/zinder
      - checkpoint-staging:/var/lib/zinder/checkpoints
      - node-cookie:/var/run/auth:ro
      - ${DEPLOY_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/ingest.token:/var/run/zinder-control/ingest.token:ro
      - ${DEPLOY_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/checkpoint.token:/var/run/zinder-checkpoint/checkpoint.token:ro
    command: ["index"]
    env_file:
      - path: ${DEPLOY_ZINDER_ENV:?set DEPLOY_ZINDER_ENV to your Zinder runtime env file}
        required: true
      - path: ${DEPLOY_INDEX_ENV-./profiles/empty-index.env}
        required: true
    environment:
      ZINDER_STORAGE__DATA_DIR: /var/lib/zinder
      ZINDER_INGEST_CONTROL__LISTEN_ADDR: "127.0.0.1:9100"
      ZINDER_INGEST_CONTROL__BEARER_TOKEN_PATH: /var/run/zinder-control/ingest.token
      ZINDER_INGEST_CONTROL__CHECKPOINT_BEARER_TOKEN_PATH: /var/run/zinder-checkpoint/checkpoint.token
      ZINDER_PROJECTOR_CONTROL__LISTEN_ADDR: "127.0.0.1:9101"
      ZINDER_PROJECTOR_CONTROL__BEARER_TOKEN_PATH: /var/run/zinder-checkpoint/checkpoint.token
      # Namespace-wide binds are explicit deployment opt-ins. Host publication
      # below remains loopback-only, while Prometheus reaches ops internally.
      ZINDER_OPS__LISTEN_ADDR: "[::]:9105"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    ports:
      - "127.0.0.1:${DEPLOY_INDEX_OPS_HOST_PORT:-9105}:9105"
      - "127.0.0.1:${DEPLOY_COMPAT_HOST_PORT:-9067}:9067"
      - "127.0.0.1:${DEPLOY_QUERY_HOST_PORT:-9102}:9102"
      - "127.0.0.1:${DEPLOY_EXPLORER_HOST_PORT:-9068}:9068"
      - "127.0.0.1:${DEPLOY_CIPHERSCAN_HOST_PORT:-9070}:9070"
      - "127.0.0.1:${DEPLOY_SERVE_OPS_HOST_PORT:-9108}:9108"
    healthcheck:
      test: ["CMD", "/usr/local/bin/zinder", "healthcheck", "--addr", "127.0.0.1:9105"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  zinder-serve:
    <<: *zinder-image
    # Include headroom for buffered settled-segment reads. See docs/runbooks/deploying.md.
    mem_limit: ${DEPLOY_SERVE_MEMORY_LIMIT:-8g}
    ulimits:
      nofile:
        soft: ${DEPLOY_NOFILE_SOFT_LIMIT:-65536}
        hard: ${DEPLOY_NOFILE_HARD_LIMIT:-65536}
    restart: on-failure
    network_mode: "service:zinder-index"
    depends_on:
      zinder-index:
        condition: service_healthy
    volumes:
      - data:/var/lib/zinder
      - node-cookie:/var/run/auth:ro
      - ${DEPLOY_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/ingest.token:/var/run/zinder-control/ingest.token:ro
    command: ["serve", "--readers-only"]
    env_file:
      - path: ${DEPLOY_ZINDER_ENV:?set DEPLOY_ZINDER_ENV to your Zinder runtime env file}
        required: true
    environment:
      ZINDER_STORAGE__DATA_DIR: /var/lib/zinder
      ZINDER_INGEST_CONTROL__ADDR: http://127.0.0.1:9100
      ZINDER_INGEST_CONTROL__BEARER_TOKEN_PATH: /var/run/zinder-control/ingest.token
      ZINDER_OPS__LISTEN_ADDR: "[::]:9108"
      ZINDER_COMPAT__LISTEN_ADDR: "[::]:9067"
      ZINDER_QUERY__LISTEN_ADDR: "[::]:9102"
      ZINDER_EXPLORER__LISTEN_ADDR: "[::]:9068"
      ZINDER_CIPHERSCAN__LISTEN_ADDR: "[::]:9070"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/zinder", "healthcheck", "--addr", "127.0.0.1:9108"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  zinder-prometheus:
    image: prom/prometheus:v3.16.0
    mem_limit: ${DEPLOY_PROMETHEUS_MEMORY_LIMIT:-1g}
    restart: unless-stopped
    profiles: [observability]
    networks:
      observability:
        aliases:
          - prometheus
    volumes:
      - prometheus:/prometheus
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${DEPLOY_PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${DEPLOY_PROMETHEUS_HOST_PORT:-9095}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  zinder-grafana:
    image: grafana/grafana:13.3.1
    mem_limit: ${DEPLOY_GRAFANA_MEMORY_LIMIT:-512m}
    restart: unless-stopped
    profiles: [observability]
    networks: [observability]
    depends_on:
      zinder-prometheus:
        condition: service_healthy
    volumes:
      - grafana:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${DEPLOY_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/zinder-overview.json
    ports:
      - "127.0.0.1:${DEPLOY_GRAFANA_HOST_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
    name: ${DEPLOY_DATA_VOLUME:-zinder-${DEPLOY_NETWORK}-data}
  checkpoint-staging:
    name: ${DEPLOY_CHECKPOINT_STAGING_VOLUME:-zinder-${DEPLOY_NETWORK}-checkpoints}
  prometheus:
    name: ${DEPLOY_PROMETHEUS_VOLUME:-zinder-${DEPLOY_NETWORK}-prometheus}
  grafana:
    name: ${DEPLOY_GRAFANA_VOLUME:-zinder-${DEPLOY_NETWORK}-grafana}
  node-cookie:
    external: true
    name: ${DEPLOY_NODE_COOKIE_VOLUME:?set the node's external cookie volume name}
