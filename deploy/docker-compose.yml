# Single-host wallet-serving topology.
#
# The four release runtimes share one host filesystem. zinder-ingest is the
# only canonical writer, zinder-projector is the only wallet writer,
# zinder-query serves the native WalletQuery protocol, and
# zinder-compat-lightwalletd serves the compatibility protocol. All readers
# share ingest's network namespace so the authenticated control plane remains
# loopback-only.
#
# The node is external to this project. Select it with one of the env files in
# this directory: each names the node's Docker network, its cookie volume, and
# its JSON-RPC and optional indexer endpoints. No node address has a default.
name: zinder-${ZINDER_DEPLOY_NETWORK:?set ZINDER_DEPLOY_NETWORK to mainnet, testnet, or regtest}

networks:
  node:
    external: true
    name: ${ZINDER_SOURCE_NETWORK_NAME:?set the node's external Docker network name}
  observability:
    name: ${ZINDER_OBSERVABILITY_NETWORK_NAME:-zinder-${ZINDER_DEPLOY_NETWORK}-observability}

services:
  state-init:
    image: debian:bookworm-slim
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/zinder/checkpoints /var/lib/zinder/projector/canonical-secondary /var/lib/zinder/query/canonical-secondary /var/lib/zinder/query/wallet-secondary /var/lib/zinder/compat/canonical-secondary /var/lib/zinder/compat/wallet-secondary /var/lib/zinder/explorer/secondary && chown -R 1000:1000 /var/lib/zinder",
      ]
    volumes:
      - type: volume
        source: data
        target: /var/lib/zinder
        volume:
          nocopy: true
      - type: volume
        source: checkpoint-staging
        target: /var/lib/zinder/checkpoints
        volume:
          nocopy: true

  zinder-ingest:
    image: ${ZINDER_INGEST_IMAGE:-zinder-ingest:local}
    mem_limit: ${ZINDER_INGEST_MEMORY_LIMIT:-14g}
    ulimits:
      nofile:
        soft: ${ZINDER_INGEST_NOFILE_SOFT_LIMIT:-65536}
        hard: ${ZINDER_INGEST_NOFILE_HARD_LIMIT:-65536}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: zinder-ingest
    restart: on-failure
    depends_on:
      state-init:
        condition: service_completed_successfully
    networks:
      node:
        aliases:
          - zinder-${ZINDER_DEPLOY_NETWORK}-ingest
          - zinder-${ZINDER_DEPLOY_NETWORK}-query
          - zinder-${ZINDER_DEPLOY_NETWORK}-explorer
      observability:
    volumes:
      - data:/var/lib/zinder
      - checkpoint-staging:/var/lib/zinder/checkpoints
      - ./config/ingest.toml:/etc/zinder/config.toml:ro
      - node-cookie:/var/run/auth:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/ingest.token:/var/run/zinder-control/ingest.token:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/checkpoint.token:/var/run/zinder-checkpoint/checkpoint.token:ro
    command: ["--config", "/etc/zinder/config.toml"]
    environment:
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK__NAME:?set the Zinder network name}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:?set the node JSON-RPC URL}
      # Empty selects JSON-RPC mempool polling. Env files set the indexer URL
      # only when the node exposes its indexer gRPC listener to this network.
      ZINDER_NODE__INDEXER_GRPC_ADDR: ${ZINDER_NODE__INDEXER_GRPC_ADDR-}
      ZINDER_NODE__AUTH__METHOD: ${ZINDER_NODE__AUTH__METHOD:-cookie}
      # Namespace-wide binds are explicit deployment opt-ins. Host publication
      # below remains loopback-only, while Prometheus reaches ops internally.
      ZINDER_OPS__LISTEN_ADDR: "[::]:9105"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    ports:
      - "127.0.0.1:${ZINDER_INGEST_OPS_HOST_PORT:-9105}:9105"
      - "127.0.0.1:${ZINDER_COMPAT_HOST_PORT:-9067}:9067"
      - "127.0.0.1:${ZINDER_QUERY_HOST_PORT:-9102}:9102"
      - "127.0.0.1:${ZINDER_PROJECTOR_OPS_HOST_PORT:-9110}:9110"
      - "127.0.0.1:${ZINDER_QUERY_OPS_HOST_PORT:-9106}:9106"
      - "127.0.0.1:${ZINDER_COMPAT_OPS_HOST_PORT:-9107}:9107"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9105/readyz"]
      interval: 30s
      timeout: 5s
      # Fresh canonical construction has a three-hour production hard gate.
      # Keep expected bootstrap failures in Docker's starting state until then.
      start_period: 3h
      retries: 3

  zinder-projector:
    image: ${ZINDER_PROJECTOR_IMAGE:-zinder-projector:local}
    mem_limit: ${ZINDER_PROJECTOR_MEMORY_LIMIT:-10g}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: zinder-projector
    restart: on-failure
    network_mode: "service:zinder-ingest"
    depends_on:
      zinder-ingest:
        condition: service_healthy
    volumes:
      - data:/var/lib/zinder
      - checkpoint-staging:/var/lib/zinder/checkpoints
      - ./config/projector.toml:/etc/zinder/config.toml:ro
      - node-cookie:/var/run/auth:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/ingest.token:/var/run/zinder-control/ingest.token:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/checkpoint.token:/var/run/zinder-checkpoint/checkpoint.token:ro
    command: ["--config", "/etc/zinder/config.toml"]
    environment:
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK__NAME:?set the Zinder network name}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:?set the node JSON-RPC URL}
      ZINDER_NODE__AUTH__METHOD: ${ZINDER_NODE__AUTH__METHOD:-cookie}
      ZINDER_PROJECTOR__BUILD_OWNER_HEX: ${ZINDER_PROJECTOR_BUILD_OWNER_HEX:?set a stable 32-character hexadecimal projector owner}
      ZINDER_OPS__LISTEN_ADDR: "[::]:9110"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9110/readyz"]
      interval: 30s
      timeout: 5s
      # Wallet construction has a two-hour production hard gate.
      start_period: 2h
      retries: 3

  zinder-query:
    image: ${ZINDER_QUERY_IMAGE:-zinder-query:local}
    mem_limit: ${ZINDER_QUERY_MEMORY_LIMIT:-4g}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: zinder-query
    restart: on-failure
    network_mode: "service:zinder-ingest"
    depends_on:
      zinder-ingest:
        condition: service_healthy
      zinder-projector:
        condition: service_healthy
    volumes:
      - data:/var/lib/zinder
      - ./config/query.toml:/etc/zinder/config.toml:ro
      - node-cookie:/var/run/auth:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/ingest.token:/var/run/zinder-control/ingest.token:ro
    command: ["--config", "/etc/zinder/config.toml"]
    environment:
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK__NAME:?set the Zinder network name}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:?set the node JSON-RPC URL}
      ZINDER_NODE__AUTH__METHOD: ${ZINDER_NODE__AUTH__METHOD:-cookie}
      ZINDER_QUERY__LISTEN_ADDR: "[::]:9102"
      ZINDER_OPS__LISTEN_ADDR: "[::]:9106"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9106/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3

  zinder-compat-lightwalletd:
    image: ${ZINDER_COMPAT_IMAGE:-zinder-compat-lightwalletd:local}
    mem_limit: ${ZINDER_COMPAT_MEMORY_LIMIT:-4g}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: zinder-compat-lightwalletd
    restart: on-failure
    network_mode: "service:zinder-ingest"
    depends_on:
      zinder-ingest:
        condition: service_healthy
      zinder-projector:
        condition: service_healthy
    volumes:
      - data:/var/lib/zinder
      - ./config/compat-lightwalletd.toml:/etc/zinder/config.toml:ro
      - node-cookie:/var/run/auth:ro
      - ${ZINDER_CONTROL_SECRETS_DIR:?set a directory containing ingest.token and checkpoint.token}/ingest.token:/var/run/zinder-control/ingest.token:ro
    command: ["--config", "/etc/zinder/config.toml"]
    environment:
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK__NAME:?set the Zinder network name}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:?set the node JSON-RPC URL}
      ZINDER_NODE__AUTH__METHOD: ${ZINDER_NODE__AUTH__METHOD:-cookie}
      ZINDER_COMPAT__LISTEN_ADDR: "[::]:9067"
      ZINDER_OPS__LISTEN_ADDR: "[::]:9107"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9107/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3

  zinder-prometheus:
    image: prom/prometheus:v3.2.0
    mem_limit: ${ZINDER_PROMETHEUS_MEMORY_LIMIT:-1g}
    restart: unless-stopped
    networks: [observability]
    volumes:
      - prometheus:/prometheus
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${ZINDER_PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${ZINDER_PROMETHEUS_HOST_PORT:-9095}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  zinder-grafana:
    image: grafana/grafana:11.5.1
    mem_limit: ${ZINDER_GRAFANA_MEMORY_LIMIT:-512m}
    restart: unless-stopped
    profiles: [observability]
    networks: [observability]
    depends_on:
      zinder-prometheus:
        condition: service_healthy
    volumes:
      - grafana:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${ZINDER_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/zinder-overview.json
    ports:
      - "127.0.0.1:${ZINDER_GRAFANA_HOST_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
    name: ${ZINDER_SINGLE_HOST_DATA_VOLUME_NAME:-zinder-${ZINDER_DEPLOY_NETWORK}-data}
  checkpoint-staging:
    name: ${ZINDER_CHECKPOINT_STAGING_VOLUME_NAME:-zinder-${ZINDER_DEPLOY_NETWORK}-checkpoints}
  prometheus:
    name: ${ZINDER_PROMETHEUS_VOLUME_NAME:-zinder-${ZINDER_DEPLOY_NETWORK}-prometheus}
  grafana:
    name: ${ZINDER_GRAFANA_VOLUME_NAME:-zinder-${ZINDER_DEPLOY_NETWORK}-grafana}
  node-cookie:
    external: true
    name: ${ZINDER_SOURCE_COOKIE_VOLUME_NAME:?set the node's external cookie volume name}
