# Real zinder-ingest certification against an existing Zebra.
#
# This topology owns only its disposable Zinder volume. It attaches Zebra's
# external network and read-only auth cookie, and never mounts Zebra chain
# state. `/healthz` is the container liveness contract; the certifier polls
# `/readyz` separately for the exact authenticated canonical fence.
name: ${ZINDER_CANONICAL_RUNTIME_PROJECT_NAME:-zinder-canonical-runtime-test}

services:
  state-init:
    image: ${ZINDER_CANONICAL_RUNTIME_INIT_IMAGE:-debian:bookworm-slim}
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      - chown
      - -R
      - ${ZINDER_CANONICAL_RUNTIME_UID:-1000}:${ZINDER_CANONICAL_RUNTIME_GID:-1000}
      - /var/lib/zinder
    volumes:
      - type: volume
        source: canonical_state
        target: /var/lib/zinder
        volume:
          nocopy: true

  zinder-ingest:
    image: ${ZINDER_CANONICAL_RUNTIME_IMAGE:?set ZINDER_CANONICAL_RUNTIME_IMAGE to an immutable image ID or digest-pinned reference}
    user: "${ZINDER_CANONICAL_RUNTIME_UID:-1000}:${ZINDER_CANONICAL_RUNTIME_GID:-1000}"
    init: true
    read_only: true
    restart: on-failure:5
    cgroup: private
    cpus: ${ZINDER_CANONICAL_RUNTIME_CPU_LIMIT_CORES:-10}
    mem_limit: ${ZINDER_CANONICAL_RUNTIME_MEMORY_LIMIT_BYTES:-10g}
    depends_on:
      state-init:
        condition: service_completed_successfully
    networks: [source]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK:-zcash-testnet}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE_JSON_RPC_ADDR:-http://zebra:18232}
      ZINDER_NODE__AUTH__METHOD: cookie
      ZINDER_NODE__AUTH__PATH: /var/run/zebra-auth/.cookie
      ZINDER_NODE__REQUEST_TIMEOUT_SECS: ${ZINDER_NODE_REQUEST_TIMEOUT_SECS:-30}
      ZINDER_NODE__MAX_RESPONSE_BYTES: ${ZINDER_NODE_MAX_RESPONSE_BYTES:-67108864}
      ZINDER_STORAGE__PATH: /var/lib/zinder/canonical
      ZINDER_INGEST__REORG_WINDOW_BLOCKS: ${ZINDER_SUPPORTED_REORG_DEPTH:-1000}
      ZINDER_INGEST__RUN_OVERRIDES__CHECKPOINT_HEIGHT: ${ZINDER_CANONICAL_RUNTIME_CHECKPOINT_HEIGHT:?set a fixed source-authenticated checkpoint height}
      ZINDER_INGEST__FOLLOW__POLL_INTERVAL_MS: ${ZINDER_CANONICAL_RUNTIME_POLL_INTERVAL_MS:-1000}
      ZINDER_OPS__LISTEN_ADDR: "[::]:9105"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    tmpfs:
      - /tmp:size=${ZINDER_CANONICAL_RUNTIME_TMPFS_SIZE:-1g},mode=1777
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - type: volume
        source: source_cookie
        target: /var/run/zebra-auth
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: canonical_state
        target: /var/lib/zinder
        volume:
          nocopy: true
    ports:
      - "127.0.0.1:${ZINDER_CANONICAL_RUNTIME_OPS_HOST_PORT:-19105}:9105"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9105/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  canonical_state:
  source_cookie:
    external: true
    name: ${ZINDER_SOURCE_COOKIE_VOLUME_NAME:-z3-testnet-cookie}

networks:
  source:
    external: true
    name: ${ZINDER_SOURCE_NETWORK_NAME:-z3-testnet}
