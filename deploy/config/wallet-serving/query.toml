# Native WalletQuery configuration for the Railway wallet-serving container.
# The query surface is the only process in this container that binds beyond
# loopback: Railway's private network is IPv6-only and both the WalletQuery
# protocol and the Railway healthcheck reach this process from outside.

[node]
request_timeout_secs = 30
broadcast_timeout_secs = 7

[storage]
path = "/var/lib/zinder/canonical"
secondary_path = "/var/lib/zinder/query/canonical-secondary"

# The canonical-reader cache defaults to a fraction of the detected cgroup
# limit. All three processes share one cgroup here, so each budget is pinned
# instead: the container limit describes the topology, not any one process.
[storage.canonical.rocksdb]
block_cache_bytes = 268435456
max_open_files = 256

[wallet]
path = "/var/lib/zinder/wallet"
secondary_path = "/var/lib/zinder/query/wallet-secondary"

[ingest_control]
addr = "http://127.0.0.1:9100"
bearer_token_path = "/var/run/zinder-control/ingest.token"

[query]
listen_addr = "[::]:9102"
reorg_window_blocks = 1000
pair_convergence_attempts = 12

[ops]
listen_addr = "[::]:9106"

[security]
allow_public_bind = true
