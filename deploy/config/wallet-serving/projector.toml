# Wallet projector configuration for the Railway wallet-serving container.
# Set ZINDER_PROJECTOR__BUILD_OWNER_HEX on the Railway service; network, node
# endpoint, and node authentication come from ZINDER_* variables too.

[node]
request_timeout_secs = 30
max_response_bytes = 67108864

[storage]
canonical_path = "/var/lib/zinder/canonical"
canonical_secondary_path = "/var/lib/zinder/projector/canonical-secondary"

# The canonical-reader cache defaults to a fraction of the detected cgroup
# limit. All three processes share one cgroup here, so each budget is pinned
# instead: the container limit describes the topology, not any one process.
[storage.canonical.rocksdb]
block_cache_bytes = 134217728
max_open_files = 128

[wallet]
path = "/var/lib/zinder/wallet"

[projector]
reorg_window_blocks = 1000
lease_duration_seconds = 14400

# Fresh wallet construction sorts in memory until these ceilings, then spills
# to the staging directory beside the wallet store. The defaults assume the
# projector owns its container.
[projector.build]
max_outpoint_sort_memory_bytes = 1073741824
max_secondary_sort_memory_bytes_per_sorter = 268435456

[ingest_control]
addr = "http://127.0.0.1:9100"
bearer_token_path = "/var/run/zinder-control/ingest.token"

[projector_control]
listen_addr = "127.0.0.1:9101"
bearer_token_path = "/var/run/zinder-checkpoint/checkpoint.token"
checkpoint_staging_root = "/var/lib/zinder/checkpoints"

[ops]
listen_addr = "127.0.0.1:9110"
