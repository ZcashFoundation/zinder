# lightwalletd-compatible CompactTxStreamer configuration for the Railway
# wallet-serving container. Like the query surface, it binds beyond loopback:
# Railway's private network is IPv6-only and lightwalletd clients reach this
# process from outside. Its operational endpoint stays on loopback.

[node]
request_timeout_secs = 30
broadcast_timeout_secs = 7

[storage]
path = "/var/lib/zinder/canonical"
secondary_path = "/var/lib/zinder/compat/canonical-secondary"

# The canonical-reader cache defaults to a fraction of the detected cgroup
# limit. Every process shares one cgroup here, so each budget is pinned
# instead: the container limit describes the topology, not any one process.
[storage.canonical.rocksdb]
block_cache_bytes = 268435456
max_open_files = 256

[wallet]
path = "/var/lib/zinder/wallet"
secondary_path = "/var/lib/zinder/compat/wallet-secondary"

[ingest_control]
addr = "http://127.0.0.1:9100"
bearer_token_path = "/var/run/zinder-control/ingest.token"

[compat]
listen_addr = "[::]:9067"
reorg_window_blocks = 1000
pair_convergence_attempts = 12
serving = "wallet"

[ops]
listen_addr = "[::]:9107"

[security]
allow_public_bind = true
