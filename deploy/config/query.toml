# Production-shaped native WalletQuery configuration for the single-host
# Compose topology.

[network]
name = "zcash-mainnet"

[node]
json_rpc_addr = "http://zebra:8232"
request_timeout_secs = 30
broadcast_timeout_secs = 7

[node.auth]
method = "cookie"
path = "/var/run/auth/.cookie"

[storage]
path = "/var/lib/zinder/canonical"
secondary_path = "/var/lib/zinder/query/canonical-secondary"
# This reader admission expectation must match ingest's persisted store identity.
raw_blob_policy = "transactions"

[wallet]
path = "/var/lib/zinder/wallet"
secondary_path = "/var/lib/zinder/query/wallet-secondary"

[ingest_control]
addr = "http://127.0.0.1:9100"
bearer_token_path = "/var/run/zinder-control/ingest.token"

[query]
listen_addr = "127.0.0.1:9102"
reorg_window_blocks = 1000
pair_convergence_attempts = 12

[ops]
listen_addr = "127.0.0.1:9106"

[security]
allow_public_bind = false
