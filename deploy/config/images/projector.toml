# Default configuration of the zinder-projector release image, installed at
# /etc/zinder/config.toml and passed with --config by the image CMD.
#
# It holds only the container listener defaults, so `docker run -p` reaches
# the service. Mounting your own file at /etc/zinder/config.toml replaces
# this one as a whole: set the listeners and allow_public_bind there if you
# still want them. [network], [projector] (such as build_owner_hex),
# [ingest_control], and storage settings have no image default; supply them in
# a mounted file or with ZINDER_* variables.

[ops]
listen_addr = "[::]:9110"

[security]
allow_public_bind = true
