# Production-shaped lightwalletd compatibility configuration for the
# single-host Compose topology.

[network]
name = "zcash-mainnet"

[node]
# The node JSON-RPC endpoint comes from ZINDER_NODE__JSON_RPC_ADDR, which the
# selected deploy env file sets.
request_timeout_secs = 30
broadcast_timeout_secs = 7

[node.auth]
method = "cookie"
path = "/var/run/auth/.cookie"

[storage]
path = "/var/lib/zinder/canonical"
secondary_path = "/var/lib/zinder/compat/canonical-secondary"

[wallet]
path = "/var/lib/zinder/wallet"
secondary_path = "/var/lib/zinder/compat/wallet-secondary"

[ingest_control]
addr = "http://127.0.0.1:9100"
bearer_token_path = "/var/run/zinder-control/ingest.token"

[compat]
listen_addr = "0.0.0.0:9067"
reorg_window_blocks = 1000
pair_convergence_attempts = 12
# Maximum concurrent GetBlockRange and GetBlockRangeNullifiers streams the
# compatibility server serves; a valid request past it waits up to 10 seconds
# for a slot, then fails with UNAVAILABLE. Size it to the container memory as
# docs/reference/lightwalletd-compatibility.md describes.
max_concurrent_block_range_streams = 100
# Answer the lightwalletd Ping load-testing RPC, as lightwalletd
# --ping-very-insecure does. Leave it off outside a load test.
ping_very_insecure = false

[ops]
listen_addr = "127.0.0.1:9107"

[security]
allow_public_bind = true
