# Optional ExplorerQuery runtime for Zexplorer and other explorer consumers.
#
# Merge this overlay with the supported wallet-serving Compose topology:
#
#   docker compose \
#     --env-file deploy/.env.testnet \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.explorer.yml \
#     up -d
#
# zinder-ingest already builds the Explorer view store. This
# runtime opens the materialized-view secondary and federates the native
# WalletQuery service over the shared loopback namespace.

services:
  zinder-ingest:
    environment:
      ZINDER_INGEST__EXPLORER_VIEWS: "true"
    ports:
      - "127.0.0.1:${ZINDER_EXPLORER_HOST_PORT:-9068}:9068"
      - "127.0.0.1:${ZINDER_EXPLORER_OPS_HOST_PORT:-9069}:9069"

  zinder-explorer:
    image: ${ZINDER_EXPLORER_IMAGE:-zinder-explorer:local}
    mem_limit: ${ZINDER_EXPLORER_MEMORY_LIMIT:-4g}
    ulimits:
      nofile:
        soft: ${ZINDER_EXPLORER_NOFILE_SOFT_LIMIT:-65536}
        hard: ${ZINDER_EXPLORER_NOFILE_HARD_LIMIT:-65536}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: zinder-explorer
    restart: on-failure
    network_mode: "service:zinder-ingest"
    depends_on:
      zinder-ingest:
        condition: service_healthy
      zinder-query:
        condition: service_healthy
    volumes:
      - data:/var/lib/zinder
      - ./config/explorer.toml:/etc/zinder/config.toml:ro
      - node-cookie:/var/run/auth:ro
    command: ["--config", "/etc/zinder/config.toml"]
    environment:
      ZINDER_NETWORK__NAME: ${ZINDER_NETWORK__NAME:?set the Zinder network name}
      ZINDER_NODE__JSON_RPC_ADDR: ${ZINDER_NODE__JSON_RPC_ADDR:?set the node JSON-RPC URL}
      ZINDER_NODE__AUTH__METHOD: ${ZINDER_NODE__AUTH__METHOD:-cookie}
      ZINDER_EXPLORER__LISTEN_ADDR: "[::]:9068"
      ZINDER_OPS__LISTEN_ADDR: "[::]:9069"
      ZINDER_SECURITY__ALLOW_PUBLIC_BIND: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9069/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
