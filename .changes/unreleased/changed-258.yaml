kind: changed
body: "`zinder-query`, `zinder-compat-lightwalletd`, and `zinder-projector` now start while the node is down. They no longer probe the node or read its activation table at startup, and only `zinder-ingest` still reports the `connect_node` startup phase. Every reader opens storage on the network-upgrade schedule the canonical writer admitted, and when it opens a store that ingest has not opened yet it waits for ingest's first admission until `storage.initial_catchup_timeout_ms` passes (for the projector, `projector.fence_convergence_timeout_seconds`), however many convergence attempts that takes. `[node]` is now optional for query and wallet-mode compatibility: without it they serve storage only and advertise no broadcast. Any node setting, from TOML, `ZINDER_NODE__*`, or the command line, still requires `node.json_rpc_addr`, so a misspelled address variable fails startup instead of silently disabling broadcast. With it they advertise `wallet.broadcast.transaction_v1` at once and check the node the first time they reach it, requiring `sendrawtransaction` in `rpc.discover`, an activation table that matches the store's schedule, and a best chain that holds the store's tip block (read with `getblockhash`). Until that check passes, broadcasts fail with `UNAVAILABLE` and `NODE_UNAVAILABLE` and no transaction is sent, `/readyz` lists `node_source` under `degraded`, and `ServerInfo.node` is empty. Query and wallet-mode compatibility also start when the node's cookie file is missing, empty, or unreadable, and verify the node once the file holds credentials, while `zinder-ingest` still exits at startup without a readable cookie file for the node it starts on. `zinder-projector` and compact-blocks compatibility now refuse to start with `[node]`, `--node-json-rpc-addr`, or any `ZINDER_NODE__*` variable, so remove those settings from their configuration files, environment, and service units; the bundled projector configuration, Compose file, and single-host entrypoint already do. Explorer now reads the network-upgrade table from its wallet query and refreshes it every minute, instead of serving an empty table when its node was down at startup. For Rust users of `zinder-query`, `WalletServingQuery::from_serving_pair_slot` and `from_admitted_native_serving_pair` no longer take a broadcaster or activation table, `with_node_broadcast` replaces `from_probed_node_source` and `from_admitted_native_sources`, `WalletServingPairConfig` drops `network_upgrade_activations`, and `spawn_wallet_node_readiness_probe` takes an optional `NodeBroadcast` and the serving-pair slot."
