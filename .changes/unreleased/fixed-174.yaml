kind: fixed
body: "The `zinder-canonical-runtime` and `zinder-wallet-serving` images now carry `/usr/local/lib/zinder` as a traversable directory. In 0.11.0 the image build gave that directory mode 0644, which stopped the release from publishing images, binary archives, and a GitHub Release for that version. Zinder 0.11.0 exists only as the `zinder-core`, `zinder-proto`, and `zinder-client` crates; deploy 0.11.1 instead, which contains every 0.11.0 change."
