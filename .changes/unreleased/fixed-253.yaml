kind: fixed
body: lightwalletd `GetBlockRange` and `GetBlockRangeNullifiers` now read at most 2 MiB of compact blocks per chunk as well as at most 1,000 blocks, so the memory one stream holds no longer grows with block size. A range of large blocks is read in several chunks even when it spans fewer than 1,000 heights, so near the tip it can end early with `ABORTED` or `OUT_OF_RANGE`, as wider ranges already could. The new `compat.max_concurrent_block_range_streams` setting (`ZINDER_COMPAT__MAX_CONCURRENT_BLOCK_RANGE_STREAMS`, default 100) refuses further block-range streams with `RESOURCE_EXHAUSTED`. `zinder_compat_block_range_streams_open` and `zinder_compat_block_range_stream_refusals_total` show how close the server runs to it. Size `ZINDER_COMPAT_MEMORY_LIMIT` for the limit as the lightwalletd compatibility reference describes. The compatibility server also limits each HTTP/2 connection to 200 concurrent streams and closes connections that stop answering keepalive pings.
