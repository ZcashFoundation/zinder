kind: added
body: "The single-volume `zinder-wallet-serving` image now also serves the lightwalletd `CompactTxStreamer` protocol on port 9067, so one image, one container, and one volume give wallets both the native `WalletQuery` service on 9102 and lightwalletd compatibility. `zinder-wallet-serving-explorer` serves it too. The entrypoint starts `zinder-compat-lightwalletd` with `zinder-query` once the wallet projection is ready and supervises it the same way; its operational endpoint stays on container loopback at `127.0.0.1:9107`, and the image healthcheck now requires both readers. Compatibility is on by default, so publish 9067 behind a TLS proxy to serve lightwalletd clients, and set `ZINDER_WALLET_SERVING__LIGHTWALLETD=false` to keep it stopped on a host without memory for a second reader; its memory has not been measured in this image, and the wallet-serving runbook says what to measure before relying on 8 GB. `ZINDER_COMPAT__*` variables, such as `ZINDER_COMPAT__MAX_CONCURRENT_BLOCK_RANGE_STREAMS`, reach the compatibility process alone. `ZINDER_STORAGE__SECONDARY_PATH` or `ZINDER_WALLET__SECONDARY_PATH` now stop the container at startup while compatibility runs, because both readers would share one secondary root. `zinder-compat-lightwalletd` now abandons gRPC calls still open 10 seconds after shutdown starts, as `zinder-query` does, so a slow block-range client no longer delays its exit."
