kind: added
body: 'When ingest parks because a reorg exceeds its window, native query now refuses new wallet requests with `REORG_WINDOW_EXCEEDED`, carrying `replacement_depth_blocks` and `reorg_window_blocks` metadata, and ends open `ChainEvents` and `MempoolEvents` streams with the same status instead of leaving them idle on a chain that stopped advancing. Ingest also stops following the node mempool at the park, so it records no mempool events against the frozen fence. `zinder-compat-lightwalletd` refuses requests with the same status in both wallet and compact-block serving instead of reporting ready on the frozen tip; upgrade it together with ingest, because an earlier compatibility release keeps reporting ready against a parked writer. `zinder-client` reports it as `IndexerError::ReorgWindowExceeded` with retry policy `OperatorActionRequired`. The parked writer keeps serving its frozen fence to the projector and query, and the single-host wallet-serving image now keeps running in this state instead of restarting into the same park, so wallets keep receiving the typed refusal. PLACEHOLDER: the pull request number below is 0; replace it, and rename this file to match, once the pull request exists.'
