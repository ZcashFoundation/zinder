kind: fixed
body: RemoteChainIndex::mempool_events now fails the stream with MalformedResponse, before yielding the event, when a mempool event repeats or decreases event_sequence, reuses a cursor, or carries an empty cursor. Cursor retention is bounded to 65,536 cursors and 8 MiB per stream, matching chain events.
