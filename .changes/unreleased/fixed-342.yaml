kind: fixed
body: "Zinder-to-Zinder gRPC dials and their automatic reconnects now give up after 5 seconds, covering name lookup, TCP, TLS, and the peer's whole initial HTTP/2 SETTINGS frame, so an unresponsive or stalled ingest, query, or explorer peer no longer holds a client for minutes. A peer that does not speak HTTP/2 fails the dial at once. `zinder-projector` and `zinder-compat-cipherscan` keep retrying a timed-out startup dial until the peer answers; a refused connection still exits. Dials no longer send an unauthenticated health request, so a proxy that drops unauthenticated streams no longer blocks startup. A peer that does not open with an HTTP/2 `SETTINGS` frame now fails the dial at once. Endpoint URLs in dial logs are redacted."
time: 2026-11-20T06:00:00.000000000Z
