kind: fixed
body: "A `zinder-projector` that crashes or is killed during wallet construction now resumes as soon as it restarts with the same `projector.build_owner_hex`. Previously its leftover construction leases refused the restart for up to `projector.lease_duration_seconds`. A projector with a different owner value is still refused until the lease expires, and the error now names the owner that holds the build; the initial-sync runbook describes how to recover."
