kind: changed
body: "`TreeStateAtHeight` and the lightwalletd-compatible `GetTreeState` now serve the tree state at every indexed height from Zinder's own store, and no longer call `z_gettreestate` on the node. A height between stored checkpoints is rebuilt from the nearest checkpoint and the stored compact blocks, and returns the same `finalState` bytes as before. Existing stores need no rebuild, and `wallet.read.tree_state_at_height_v2` is now always advertised. Each wallet-serving process rebuilds at most one tree state per CPU at once. A request that needs a rebuild while every slot is busy fails at once with `RESOURCE_EXHAUSTED` and the new `TREE_STATE_REPLAY_LIMIT_REACHED` reason; clients should retry with backoff. Heights with a stored checkpoint, which include every block followed live, are never refused this way. Two new metrics track the work: `zinder_query_tree_state_replayed_blocks` samples the blocks each rebuild replays, and `zinder_query_tree_state_replay_refusals_total` counts refusals. `zinder-client` reports the refusal as `ErrorReason::TreeStateReplayLimitReached` with `RetryPolicy::RetryWithBackoff`. Dashboards that attributed tree-state latency to node calls should read these instead. A `zinder-query` or `zinder-compat-lightwalletd` process whose node supports tree state but not transaction broadcast no longer runs the node readiness probe, so it reports ready and keeps serving tree-state reads without a reachable node. Damaged history between checkpoints, such as a missing compact block or a broken parent link, now fails tree-state requests with `STORAGE_UNAVAILABLE` instead of being masked by the node's answer."
