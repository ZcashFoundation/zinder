kind: changed
body: "The `zinder-ingest`, `zinder-projector`, `zinder-query`, `zinder-compat-lightwalletd`, and `zinder-explorer` images now run on a digest-pinned distroless base and are less than half their previous size. Each image checks its own health with the new `healthcheck` subcommand, for example `zinder-query healthcheck`, which requests `/readyz` and passes only on HTTP 200; add `--path /healthz` for liveness. These images no longer contain a shell, `curl`, or a package manager, so replace any custom healthcheck or script that runs `curl` or `sh` inside them with the subcommand, and inspect a running container with `docker exec <container> zinder-<runtime> --config /etc/zinder/config.toml --print-config`. The images now set their operational and serving listeners to `[::]` and `ZINDER_SECURITY__ALLOW_PUBLIC_BIND=true`, so `docker run -p` works with no listener settings. Other containers on the same Docker network can reach these listeners without a published port, and host networking binds the host's interfaces, so run the containers on a dedicated network and avoid host networking, or set a listener variable to `127.0.0.1`. Because environment variables outrank the config file, these defaults replace any `listen_addr` or `allow_public_bind` set in a mounted config file; set the environment variable to change one. Ingest's control listener stays on `127.0.0.1:9100`. In Compose, `ZINDER_VERSION=vX.Y.Z` now pulls the signed release images of that tag; run `pull` and then `up -d --no-build` with the Compose file from the same tag, or leave `ZINDER_VERSION` unset and use `up -d --build` to build from source. The single-volume images keep `sh` and `curl`. Release images also carry OCI title, description, URL, documentation, vendor, and creation-time labels."
