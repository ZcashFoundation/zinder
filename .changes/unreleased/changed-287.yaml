kind: changed
body: "The `zinder-ingest`, `zinder-projector`, `zinder-query`, `zinder-compat-lightwalletd`, and `zinder-explorer` images now run on a digest-pinned distroless base and are less than half their previous size. Each image checks its own health with the new `healthcheck` subcommand, for example `zinder-query healthcheck`, which requests `/readyz` and passes only on HTTP 200; add `--path /healthz` for liveness. The probe takes its address from `--addr`, then `ZINDER_OPS__LISTEN_ADDR`, then `[ops] listen_addr` in the `--config` file. These images no longer contain a shell, `curl`, or a package manager, so replace any custom healthcheck or script that runs `curl` or `sh` inside them with the subcommand, and inspect a running container with `docker exec <container> zinder-<runtime> --config /etc/zinder/config.toml --print-config`. All Zinder images now run as UID and GID 10001 instead of 1000, the UID the Zebra and Zakura images use, so they read the node's mode-0600 RPC cookie directly; `deploy/node-cookie-permissions.yml` is removed, and a running copy of that project should be stopped. Compose deployments and the single-volume images hand their volumes to UID 10001 on start. Give host files mounted into the containers, such as `/etc/zinder/control-secrets` and indexer TLS files, group 10001 before upgrading, and in other orchestrators chown volumes to 10001 or set `fsGroup: 10001`. Each per-service image ships a default `/etc/zinder/config.toml` that binds its operational and serving listeners to `[::]` and sets `allow_public_bind = true`, and its `CMD` passes that file, so `docker run -p` works with no listener settings. A file you mount at `/etc/zinder/config.toml` replaces the default as a whole, and arguments after the image name replace the `CMD`, so pass `--config /etc/zinder/config.toml` again to keep using the file. Other containers on the same Docker network can reach the default listeners without a published port, and host networking binds the host's interfaces, so run the containers on a dedicated network and avoid host networking, or set a listener to `127.0.0.1`. Ingest's control listener stays on `127.0.0.1:9100`. In Compose, `ZINDER_VERSION=vX.Y.Z` now pulls the signed release images of that tag; run `pull` and then `up -d --no-build` with the Compose file from the same tag, or leave `ZINDER_VERSION` unset and use `up -d --build` to build from source. The single-volume images keep `sh` and `curl`. Release images also carry OCI title, description, URL, documentation, vendor, and creation-time labels."
