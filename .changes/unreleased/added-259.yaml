kind: added
body: "`zinder-ingest` can now fail over between node endpoints. Configure fallback endpoints as `[node_fallbacks.1]`, `[node_fallbacks.2]`, and so on, or as `ZINDER_NODE_FALLBACKS__1__JSON_RPC_ADDR` and the other `[node]` fields under a position. `[node]` stays position 0, and a single-endpoint deployment behaves and prints its configuration as before, except that `--print-config` and the `canonical_writer_started`, `upstream_health_probe_started`, and `upstream_health_endpoint_unreachable` log events now show every node URL with its user information, query, and fragment replaced by `[REDACTED]`. With fallbacks configured, ingest checks every endpoint at startup, including its genesis block, and starts on the first one that passes, without waiting for higher positions once a lower one passes. An endpoint is excluded until restart only when it reports pruned storage, lacks a required capability, answers for another network, or advertises another network-upgrade table. An endpoint that times out, or that was still being checked when ingest started, is checked again while ingest runs. While following the chain, ingest switches between blocks after three consecutive recoveries of one transport class, `node_unreachable` or `stream_disconnected`, or after the active node has reported not ready for five minutes. It prefers an endpoint that holds its visible tip. It switches to an endpoint on another branch only when that branch shares the settled tip, so the switch replaces blocks within the reorg window, and never to an endpoint whose chain differs at or below the settled tip. Ingest does not switch back on its own; a restart starts at `[node]` again. `/readyz` and the ops `ReadinessReport` report `active_node.position` when fallbacks are configured. New metrics: `zinder_ingest_node_endpoint_active{position}`, `zinder_ingest_node_endpoint_state{position,state}`, and `zinder_ingest_node_endpoint_switches_total{from_position,to_position,failure_class}`. New log events: `node_endpoint_admitted`, `node_endpoint_unreachable`, `node_endpoint_excluded`, `node_endpoint_deferred`, `node_endpoint_state_changed`, `node_endpoint_skipped`, `node_endpoint_switched`, and `node_endpoint_switch_unavailable`. `zinder-query`, wallet-mode `zinder-compat-lightwalletd`, and `zinder-explorer` accept and validate the same list, and still read only `[node]`; a fallback list without `[node]` is refused. `zinder-projector` and compact-blocks compatibility read no node and reject the list as they reject `[node]`. The single-volume images route `ZINDER_NODE_FALLBACKS__*` to ingest, query, and the Explorer, never to the projector, accept `ZINDER_NODE_FALLBACKS__<N>__INDEXER_TLS__*_PEM`, and require each fallback's `INDEXER_GRPC_ADDR` in the wallet-serving image. A new Compose overlay, `deploy/docker-compose.node-fallback.yml`, attaches a second node. Every endpoint must advertise exactly the network-upgrade table the store admitted. When upgrading nodes, upgrade the one ingest is not reading from, then the other, then restart ingest."
