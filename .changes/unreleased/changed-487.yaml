kind: changed
body: 'Fresh wallet-serving stores with Explorer views off now store a tree-state checkpoint at every height before READY, so wallets read historical tree states from stored checkpoints as soon as the store is published. When construction stores these extra checkpoints, `ingest.construction.tree_hashing_workers` defaults to the CPU count, at most 16. On Mainnet this first sync reaches READY within three hours on 8 CPUs; smaller hosts take longer, and ingest logs `every_block_construction_below_qualified_cpus` when it starts one. On such a host, set `ingest.tree_state_densification.selection = "commitment-budget"` or `during_construction = false` before the first sync for an earlier READY. Existing stores reopen without a rebuild, and a sparse store keeps being densified by the background pass.'
