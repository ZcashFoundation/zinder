kind: fixed
body: Raised Mainnet `ZINDER_QUERY_MEMORY_LIMIT` and `ZINDER_COMPAT_MEMORY_LIMIT` defaults from `4g` to `32g` (and decoupled `ZINDER_HISTORY_PUBLISHER_MEMORY_LIMIT` at `8g`) so cgroup v2 containers keep the `ZSHRNG01` shielded history catalog in page cache instead of re-reading from disk under concurrent stream load.
