kind: fixed
body: "`ExplorerQuery.TransparentAddressActivity` no longer fails with `FAILED_PRECONDITION` while the transparent-address ranking is ahead of the requested chain epoch, which happened for most of every block interval. Address summaries, ranking coverage, and activity rows now describe the epoch's visible tip. A read still fails with `FAILED_PRECONDITION` when the ranking holds a different block than the epoch, including while it trails the epoch on a replaced branch, or when it would need to rewind more than 1,000 blocks. The Cipherscan adapter no longer marks `/api/address/:address` degraded only because the Explorer views lead the pinned epoch; it does so when ranking coverage stops short of the epoch's tip."
time: 2026-11-14T20:00:00Z
