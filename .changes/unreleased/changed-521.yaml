kind: changed
body: A `GetBlockRange` response now sends its first frame once it holds 8 KiB of blocks, so behind a gateway that forwards whole HTTP/2 frames a wallet receives the first block in the first round trip of a connection that has been idle. Response bytes and later frames are unchanged.
