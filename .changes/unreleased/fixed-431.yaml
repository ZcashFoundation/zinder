kind: fixed
body: On shutdown, zinder-compat-lightwalletd interrupts pending writer-status reads and catch-up retries in compact-blocks mode, keeping the published reader and skipping refresh-failure reporting. In-flight RocksDB work and closing secondaries can extend shutdown beyond the wallet-serving entrypoint's 20-second grace window.
