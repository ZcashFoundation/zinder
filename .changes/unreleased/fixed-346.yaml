kind: fixed
body: "In compact-blocks serving, `GetBlock` by hash now answers a best-chain block whose compact block is missing with `NOT_FOUND` and `ARTIFACT_UNAVAILABLE`, as wallet serving does, instead of `BLOCK_NOT_IN_BEST_CHAIN`. In both modes, a `GetBlockRange` chunk holding a block that a lightwalletd message cannot carry now fails whole with `DATA_LOSS`: before the stream opens when it is the first chunk, and before any of its blocks are sent otherwise."
