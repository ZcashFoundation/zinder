kind: changed
body: Following a block no longer derives the same note-commitment-tree roots repeatedly, so `zinder-ingest` uses far less CPU per block while catching up after downtime or replaying a deep reorg. On a 20,122-block Testnet replay, canonical preparation of a block with no transparent activity fell from about 9 ms to under 2.5 ms.
