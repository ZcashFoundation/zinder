kind: security
body: "Public listeners now bound the denial-of-service paths lightwalletd fixed in GHSA-5xg7-x58j-m5vr, GHSA-4wjx-vhhv-vc8c, GHSA-xrx5-jc6q-9h8r, GHSA-p4pq-3cf7-45rv, GHSA-8vh8-6jg3-8f5v, and GHSA-w24w-x7vw-f2w8. On `zinder-compat-lightwalletd`, `zinder-query`, and `zinder-explorer`, a gRPC request larger than 2 MiB now fails with `OUT_OF_RANGE` (it was 4 MiB), and each process receives at most 32 requests at once per pool, shared fairly across connections; a request over the limit fails with `UNAVAILABLE`, and one that has not arrived within 20 seconds fails with `DEADLINE_EXCEEDED`. Client-streaming calls, such as `GetTaddressBalanceStream` and gRPC reflection, draw on a separate pool and fail with `DEADLINE_EXCEEDED` after 20 seconds without a message. A response whose client stops reading for 60 seconds ends with `DEADLINE_EXCEEDED`. Requests whose list fields hold far more elements than any handler accepts fail with `INVALID_ARGUMENT` before they are decoded. Broadcasts share a 16 MiB transaction budget per process; a broadcast over it fails with `UNAVAILABLE` and the new `BROADCAST_BUDGET_EXHAUSTED` reason, which `zinder-client` retries. The ops endpoint and the Cipherscan REST adapter now enforce header, body, and write-stall deadlines and a connection cap. Keep the ops endpoint on loopback or a private network, and limit concurrent connections per client at your proxy, because many connections can still fill a pool. New metrics: `zinder_grpc_request_receive_refusals_total`, `zinder_grpc_request_receive_timeouts_total`, `zinder_grpc_request_receive_evictions_total`, `zinder_grpc_response_send_stalls_total`, and `zinder_query_broadcast_budget_refusals_total`."
