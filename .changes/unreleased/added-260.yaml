kind: added
body: "`zinder-query` and wallet-mode `zinder-compat-lightwalletd` now broadcast transactions through the ordered node list: `[node]` first, then each `[node_fallbacks.N]` endpoint. Each endpoint is verified on first contact before any transaction reaches it, as `[node]` already was. A broadcast moves to the next verified endpoint when one is unreachable, including when its `broadcast_timeout_secs` expires, or rejects the transaction for its consensus branch. Any other answer is returned. After such a move, the endpoint that answered is tried first from then on, with no timed failback; skipping an endpoint that is not verified yet moves nothing. The node probe also moves past a verified endpoint that stops answering, so an idle reader stays ready and its next broadcast pays no timeout. When every verified endpoint is unreachable, the broadcast fails with `NODE_UNAVAILABLE` and readiness is unchanged. With fallbacks, set `broadcast_timeout_secs` on every endpoint well below wallet request deadlines: a fallback does not inherit the value of `[node]` and otherwise waits for its own `request_timeout_secs`. The node-fallback Compose overlay sets 7 seconds for fallback 1. Readers verify every endpoint on the `[node]` health poll interval and ignore a fallback's. An endpoint that timed out may have accepted the transaction. When an earlier endpoint in the same broadcast was unreachable, a later duplicate or queued answer is reported as accepted with the transaction id computed from the submitted bytes, so lightwalletd wallets receive `errorCode` 0 instead of -27 or -25. For the same reason, a broadcast that no endpoint answered fails with the retryable `NODE_UNAVAILABLE` whenever an endpoint was unreachable, even if another endpoint rejected it for its consensus branch. Verification checks a node's activation table through the height after the served tip, the block a broadcast targets, and is repeated as soon as the writer admits a new network-upgrade schedule revision or that height crosses an activation. When the repeat is inconclusive, for example because the node has not received the latest block yet, the endpoint keeps its earlier verification for up to one minute while the reader retries every two seconds. An endpoint that lacks `sendrawtransaction` or advertises a disagreeing activation table is excluded and verified again after a backoff of 30 seconds that doubles up to 5 minutes, instead of being retried every probe round. `ServerInfo.node` reports the first verified endpoint in broadcast preference order. New metrics: `zinder_wallet_broadcast_endpoint_attempts_total{position,outcome}`, `zinder_wallet_broadcast_endpoint_state{position,state}`, and `zinder_wallet_broadcast_endpoint_switches_total{from_position,to_position,cause}`. New log events: `wallet_node_excluded`, `broadcast_endpoint_switched`, and `broadcast_reported_accepted_after_unreachable_endpoint`, and `wallet_node_reverification_inconclusive`; `wallet_node_verified` and `wallet_node_verification_failed` now carry the endpoint `position`. `zinder-explorer` still reads only `[node]`."
