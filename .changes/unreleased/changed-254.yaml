kind: changed
body: Wallet-serving `zinder-query` and `zinder-compat-lightwalletd` now read every serving generation through one canonical and one wallet block cache, so `storage.canonical.rocksdb.block_cache_bytes` and `wallet.rocksdb.block_cache_bytes` cap the whole process instead of each of up to four generations, and compact-blocks `zinder-compat-lightwalletd` reads both of its generations through one canonical cache. No setting or default changes, and the block-cache ceiling falls by up to three quarters in wallet serving and by half in compact-blocks serving. An existing override now sets the process total, so keep it or lower the container memory limit to reclaim the difference; in the wallet-serving container, the wallet setting also still sizes the projector's writer cache. Each store's `default` column family now reads through the configured cache instead of a separate 32 MiB cache in every RocksDB instance. Wallet serving exports the block-cache gauges as `store_role="canonical_secondary"` and `store_role="wallet_secondary"` plus `zinder_wallet_serving_pair_publisher_open_generations`, compact-blocks serving exports them as `store_role="canonical_secondary"`, and both export memtable memory and the new `zinder_store_table_reader_memory_bytes` summed over open generations, sampled at most every 15 seconds.
