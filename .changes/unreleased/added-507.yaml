kind: added
body: Set `deployment.profile = "light-wallet"` in the standard ingest and compatibility binaries to serve wallets with complete compact history and without raw blobs or a wallet projection. Configure one node with transparent address indexes. Existing schema 7 stores can serve readers whose minimum requirements they meet. A canonical layout change requires a fresh store. A seven-day build-beside rollback period is optional. Keep the previous binaries and their matching store if you need a fallback.
