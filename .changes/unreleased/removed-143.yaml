kind: removed
body: 'Native `WalletQuery` now serves only the transparent reads its consumers need: `TransparentAddressUnspentOutputs`, ascending `TransparentAddressTxIdsInRange`, and `TransparentOutpointSpendStatus`. Removed, together with their capabilities and `zinder-client` methods: `TransparentAddressBalance`, `TransparentOutputsByOutpoint`, `TransparentSpendsByOutpoint` and `TransparentUnspentOutputsByOutpoint` (replaced by `TransparentOutpointSpendStatus`), the three transparent mempool lookups and their `IngestControl` methods, `TransparentUtxoSetSummary`, `ExplorerQuery.UtxoSetSummary`, and the `descending` history flag. The lightwalletd-compatible `GetTaddressBalance` is unchanged. Wallet and ingest `ServerInfo` and readiness no longer report `materialized_view_preset`; Explorer view identities are reported by `ExplorerServerInfo`. The `zinder_materialized_view_workload_info` metric is removed and `zinder_materialized_view_identity_info` loses its `preset` label. Upgrade notes: the native contract revision is now 7. `zinder-query` admits `zinder-ingest` only at the same contract revision, so upgrade both together. Explorer view stores built by earlier releases are refused at startup and must be rebuilt on a fresh materialized-view path (see the deploying-on-a-VM runbook). A revision-6 client that sends `descending = true` now receives ascending results. Zallet''s Zinder backend uses one removed item, the `descending` history flag: delete `descending: false` in `backends/zinder/src/chain.rs` and the test assertion on it. Its other `zinder-client` and `zinder-core` imports still exist. That was checked against the API surface, not by compiling Zallet, and upgrading it from `=0.6.0` also crosses every other breaking change since that release.'
