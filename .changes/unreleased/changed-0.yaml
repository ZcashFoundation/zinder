kind: changed
body: 'Existing canonical and wallet stores now start against a node that announces a future network upgrade, such as Zebra 7.0.0 adding NU7, without a rebuild. A node table that changes an upgrade the store has already passed is refused, and the store is left unchanged. Running query and lightwalletd-compatible services follow the newly admitted table without a restart, and `GetLightdInfo` reports NU7 once the chain reaches its activation height. The first start of this release writes schedule revision 1 to the canonical store even when the node''s table is unchanged, so earlier Zinder releases can no longer open that store; upgrade all Zinder services together and restart ingest before the readers. Rust callers of `LightwalletdGrpcAdapter::new`, `with_response_limits`, and `from_admitted_compatibility_query` no longer pass an activation table. PLACEHOLDER: the pull request number below is 0; replace it, and rename this file to match, once the pull request exists.'
