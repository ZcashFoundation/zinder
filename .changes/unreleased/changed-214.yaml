body: The wallet projection digest and the UTXO-set commitment now cost about 64% less CPU per transparent output row, which shortens wallet work on blocks with many transparent outputs and lowers the CPU cost of wallet builds. Digest values and stored bytes are unchanged, so existing wallet stores and bundles stay valid.
