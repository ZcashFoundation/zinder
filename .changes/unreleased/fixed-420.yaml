kind: fixed
body: Wallet supervision now applies the one-hour tolerance and recurrence budgets when ingest stalls preparing a block. If a mempool node outage continues through brief canonical lags, its 24-hour clock pauses and resumes with the time already spent waiting. Rust callers constructing syncing details must account for the new optional wait_reason field.
