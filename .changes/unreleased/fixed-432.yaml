kind: fixed
body: Ingest and Explorer now default to the projector's canonical store directory, `/var/lib/zinder/canonical`. If your store is at the old default, set `ZINDER_STORAGE__PATH=/var/lib/zinder/store` for ingest and Explorer before upgrading. Set `ZINDER_STORAGE__CANONICAL_PATH=/var/lib/zinder/store` for a projector that reads that store.
