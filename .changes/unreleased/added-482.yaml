kind: added
body: Fresh canonical construction can hash note-commitment trees on several threads with `ingest.construction.tree_hashing_workers` (default 1, which keeps the single-threaded loader). With more workers, construction with `during_construction = true` reaches READY sooner and stores the same rows. Construction checkpoints now also reject an encoding of any tree other than the one appended.
