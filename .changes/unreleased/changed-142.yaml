kind: changed
body: 'Native `WalletQuery.CompactBlocksInRange` now sends the chain view once, as the first stream message, followed by bare compact blocks, instead of repeating the full chain view on every block. `CompactBlocksInRangeChunk` is now a `oneof body` with `header` and `item`. `zinder-client` keeps the same `compact_blocks_in_range` API and rejects a stream whose header is missing, repeated, or out of order with `MalformedResponse`. Upgrade notes: the native contract revision is now 7. Native query and ingest must run the same revision, so upgrade `zinder-ingest` and `zinder-query` together: `zinder-query` admits only an ingest at its own revision and fails at startup against a revision 6 `zinder-ingest`. No upgrade order is safe for native clients: a client built before this release fails on the first `CompactBlocksInRange` message from a new server, and this `zinder-client` refuses servers below revision 7. Release consumers such as Zally-based wallets on this `zinder-client`, then cut the Zinder services and those consumers over together. Raw gRPC consumers must read the leading header and take blocks from `body.item`.'
