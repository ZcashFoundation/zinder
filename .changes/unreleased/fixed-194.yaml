kind: fixed
body: "Explorer view replay that resumes partway through history, as after a restart or upgrade, now warms its prevout cache from canonical history before it continues, instead of resolving most transparent spends through one canonical read at a time, and the canonical reads that remain run on up to 16 threads; the transparent-address ranking build does the same, and both log `materialized_view_prevout_cache_warmed`. On a store whose Explorer views were built without the transparent-address ranking, ingest now builds the ranking beside the view replay and joins it at the height the other views have reached, so `explorer.transparent_address.activity_v2` and `explorer.transparent_address.ranking_v1` are advertised long before replay reaches the tip; ingest logs `transparent_address_ranking_joined_replay`, and `zinder_materialized_view_transparent_address_ranking_build_height` and `zinder_materialized_view_transparent_address_ranking_build_target_height` report the build's progress. `zinder_materialized_view_prevout_cache_outputs{cache}` and `zinder_materialized_view_prevout_cache_evicted_outputs_total{cache}` report prevout cache use. Explorer view files now compress with ZSTD, which used about a third less disk than the previous Snappy default on a transparent-dense fixture; existing view stores open in place and shrink as compaction rewrites their files."
