kind: changed
body: 'The default reorg window for ingest, projector, native query, and lightwalletd compatibility is now 1000 blocks, the depth past which Zebra 7 and Zakura finalize blocks, so ingest no longer parks on a reorg the node itself can produce. The settled tip, and every finality status derived from it, now trails the visible tip by up to 1000 blocks. Upgrade warning: deployments that rely on the default, on the shipped `deploy/config` files, or on the wallet-serving image move to 1000 on their first start, and that raise is irreversible: earlier Zinder releases cannot open the raised stores, and the window cannot be lowered in place. To keep a rollback path, capture a state bundle before starting this release. Deployments that set `reorg_window_blocks` explicitly keep their value. Starting ingest with a larger window raises an existing canonical store in place, and the projector raises the wallet store when it resumes, so restart ingest first, then the projector, native query, and compatibility with the same value. Replaceable depth grows to the new window as blocks arrive. A smaller window is refused and still requires a rebuild. A replacement now prepares at most `ingest.follow.max_replacement_bytes` (2 GiB by default) before its atomic commit and fails with `ReplacementBytesExceeded` beyond it. Live commits and reader catch-ups now authenticate only the replay rows a transition changed, so their cost no longer grows with the window. Cipherscan `finality_status` now reports `Finalized` only for blocks at or below the settled tip instead of after 100 confirmations. PLACEHOLDER: the pull request number below is 0; replace it, and rename this file to match, once the pull request exists.'
