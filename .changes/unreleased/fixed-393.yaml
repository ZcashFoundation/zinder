kind: fixed
body: Wallets can recover from an expired mempool event or snapshot page cursor. The Rust SDK reports `RefreshMempoolSnapshot`. Discard partial pages, take a fresh snapshot, and subscribe from its events resume cursor. The native protocol reserves the retired `BROADCAST_DISABLED` reason. Match `ENDPOINT_CAPABILITY_UNAVAILABLE` when broadcast is unavailable.
