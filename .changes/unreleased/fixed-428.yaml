kind: fixed
body: Explorer advertises ValuePoolSummary only when the connected wallet endpoint supports it. It omits MempoolEventCounts and ValuePoolBalanceHistory from discovery. An empty event-count window is reported as unavailable in OverviewSnapshot and returns ARTIFACT_UNAVAILABLE on a direct call. For native contract revision 13, upgrade zinder-ingest, zinder-query, and wallet-mode zinder-compat-lightwalletd together. Both readers require a matching writer revision.
