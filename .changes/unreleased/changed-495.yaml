kind: changed
body: The lightwalletd listener sends signed-history `GetBlockRange` blocks of 32 KiB or more from the stored segment without copying them into the gRPC encode buffer. Responses are unchanged. In `zinder-proto`, `EncodedBlockRangeStream` now yields `EncodedBlock`, a gRPC length-prefixed `CompactBlock` message, so custom `EncodedBlockRange` implementations must wrap their payloads with `EncodedBlock::encode` or `EncodedBlock::from_length_prefixed`.
