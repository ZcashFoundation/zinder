kind: fixed
body: A public gRPC listener that trusts the x-zinder-client-address header now accepts a bare IP address, such as the {client_ip_address} value a GCP Global External Application Load Balancer sends, and counts every connection from that address as one client in the receive limit. An ip:port header still keys each connection apart, so wallets behind a shared Tor exit stay separate. The listener raises each stream's HTTP/2 send buffer from hyper's ~400 KiB default to 1 MiB, and the native client raises its receive windows from hyper's 2 MiB stream, 5 MiB connection, and 16 KiB frame defaults to 4 MiB stream, 16 MiB connection, and a 64 KiB max frame.
