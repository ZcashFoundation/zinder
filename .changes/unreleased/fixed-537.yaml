kind: fixed
body: A public gRPC listener that trusts the x-zinder-client-address header now accepts a bare IP address, such as the {client_ip_address} value a GCP Global External Application Load Balancer sends, and counts every connection from that address as one client in the receive limit. An ip:port header still keys each connection apart, so wallets behind a shared Tor exit stay separate. The listener also holds up to 1 MiB of send buffer per stream, and the native client advertises fixed 4 MiB stream and 16 MiB connection receive windows with a 64 KiB frame size, so a 90 ms WAN round trip is no longer capped near the 65,535-byte window default.
