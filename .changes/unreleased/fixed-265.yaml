kind: fixed
body: "`zinder-compat-lightwalletd` now parses each `GetTaddressBalanceStream` address as it arrives and rejects the stream with `INVALID_ARGUMENT` as soon as an address is invalid or the 257th distinct address arrives, instead of buffering every streamed address until the client finishes sending. `GetTaddressBalance` and `GetTaddressBalanceStream` count a repeated address once, so a request that repeats one address more than 256 times is now served. Every transparent-address lookup in `zinder-query`, `zinder-compat-lightwalletd`, and `zinder-explorer`, including `GetTaddressTxids`, `GetTaddressTransactions`, `GetAddressUtxos`, and `GetAddressUtxosStream`, now refuses address text longer than 64 bytes before parsing it, so an oversized address no longer ties up a request in Base58 decoding."
time: 2026-11-18T13:29:00.000000000Z
custom:
