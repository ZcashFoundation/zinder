kind: fixed
body: "`zinder-compat-lightwalletd` now rejects `GetTaddressBalanceStream` with `INVALID_ARGUMENT` as soon as the 257th distinct address arrives, instead of buffering every streamed address until the client finishes sending. `GetTaddressBalance` and `GetTaddressBalanceStream` count a repeated address once, so a request that repeats one address more than 256 times is now served."
