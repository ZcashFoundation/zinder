kind: changed
body: "`zinder-query` and `zinder-compat-lightwalletd` now stay ready while their Zebra node is unavailable or still syncing, and native query also stays ready while ingest control is unavailable, until `storage.serving_pair_staleness_ceiling_ms` passes. Stored reads, compact-block sync, `GetLightdInfo`, and the trusted-TLS compatibility route keep answering. Only the requests that need the dependency fail: broadcast returns `UNAVAILABLE` with `NODE_UNAVAILABLE`, and native query's mempool methods and unmined `Transaction` lookups return `UNAVAILABLE` with `UPSTREAM_UNREACHABLE` while ingest control is down. When ingest is reachable but its canonical writer stops or misses its reply timeout, `IngestControl` requests and the native query methods that use them return `UNAVAILABLE` with `STORAGE_UNAVAILABLE` instead of `DEADLINE_EXCEEDED` or an `UNAVAILABLE` without a reason. While the writer's live mempool hydrates or rebuilds from its node, `MempoolSnapshot` returns `UNAVAILABLE` with `NODE_UNAVAILABLE`, and a `MempoolEvents` subscription replays its retained events and then ends with the same status instead of staying open and silent. Resubscribe from the last delivered cursor with backoff. That ending raises the native contract revision to 9, so a consumer that relies on it requires revision 9, and `zinder-query` admits only a revision 9 `zinder-ingest`: upgrade ingest and the readers together. An open lightwalletd-compatible `GetMempoolStream` also ends with `UNAVAILABLE` in that case. Compact-blocks compatibility no longer probes the node at all. A canonical writer parked by `reorg_window_exceeded` still refuses every request. `/readyz` lists each unhealthy dependency in a new `degraded` array of `{\"input\", \"dependency_cause\"}` entries after the top-level `cause`, and wallet-serving readers add `served_epoch_age_seconds`, the time since the writer committed the chain view they serve; the `zinder.v1.ops.ReadinessReport` message gains the matching `degraded` and `served_epoch_age_seconds` fields. The wire change is additive, but Rust code that builds `zinder_proto::v1::ops::ReadinessReport` with an exhaustive struct literal must add the two fields or end the literal with `..Default::default()`. Native query no longer reports `node_unavailable`, `upstream_not_ready`, `node_capability_missing`, or `ingest_control_unavailable` as its own cause, and a writer that reports `upstream_not_ready` now appears as that cause under `degraded` instead of `ingest_control_unavailable`. Alert on the new `zinder_readiness_dependency_state{input, cause}` and `zinder_readiness_served_epoch_age_seconds` metrics instead of reader 503s; the bundled Prometheus rules add `ZinderDependencyDegraded` and `ZinderServedChainStale`, and the bundled Grafana overview adds `Degraded Dependencies` and `Served Chain Age` panels. The dependency gauge also reports a writer's `reorg_window_exceeded` halt read through ingest control, which the reader already reports as its own cause, so exclude that cause when alerting on degraded dependencies. While the writer's live mempool hydrates or rebuilds from its node, native query reports `ingest_control` with `node_unavailable` and the `stream_disconnected` failure class, even when its own node probe passes, so `ZinderDependencyDegraded` fires when that lasts longer than two minutes. Compact-blocks compatibility ignores every `node.health` setting. The single-host wallet-serving container no longer restarts while ingest reports `upstream_not_ready`. It also stays up while ingest reports `syncing` and query's `/readyz` relays the writer's `upstream_not_ready` under `ingest_control`, as happens while Zebra resyncs, or the writer mempool's `node_unavailable`, as happens when only the node's mempool feed fails. It restarts on `node_unavailable`, whether ingest reports it or query relays it, only after 24 hours. The reference Compose topology starts query and compatibility once the ingest container has started rather than once it is healthy."
