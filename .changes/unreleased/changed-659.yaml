kind: changed
body: Enabled `--features pasta_curves/asm` by default (`ZINDER_PASTA_ASM=1`) across `deploy/Dockerfile`, release binary archives, container images, and Compose definitions so x86-64 builds select the `BMI2 + ADX` assembly backend (with startup verification and `ZINDER_PASTA_ASM=0` fallback for pre-Broadwell/Haswell hosts) and AArch64 builds select ARMv8-A assembly.
