kind: changed
body: "Every Zinder service binary (`zinder-ingest`, `zinder-projector`, `zinder-query`, `zinder-compat-lightwalletd`, `zinder-explorer`, and `zinder-compat-cipherscan`) now refuses to start when `RUST_LOG` is set to a value that is not a valid log filter, such as `zinder=verbose`, instead of silently logging at `info`. The binary exits non-zero before it reads configuration or opens storage and prints the variable, its value, and the parse error to stderr. A `RUST_LOG` that is not valid Unicode fails the same way. An unset, empty, or whitespace-only `RUST_LOG` still selects `info`. A bare word such as `zinder` remains valid and enables every level for that target. Check `RUST_LOG` in your deployments before upgrading. For library users, `zinder_runtime::install_tracing_subscriber` now returns `Result<(), TracingSubscriberError>` and reports a second install as an error instead of panicking."
time: 2026-11-18T13:40:00.000000000Z
