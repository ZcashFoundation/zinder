kind: changed
body: The public gRPC listeners of zinder-query, zinder-compat-lightwalletd, and zinder-explorer now reset a stalled response stream at the 60 s send-stall timeout while the connection and its other streams stay open. HTTP/2 discards the stream's queued response data and frees its stream slot the next time it writes to the connection, and a connection that cannot write is closed by its write-stall bound. Before, a client that answered keepalive pings but stopped granting flow-control window kept them until it disconnected. A stalled client now sees a stream reset (CANCELLED in grpc-go, grpc-java, and tonic; UNAVAILABLE in gRPC Swift) instead of DEADLINE_EXCEEDED. A connection that, once a write blocks, neither writes 16 KiB nor finishes writing everything it had buffered within the timeout is closed. The native contract revision is now 15, so upgrade zinder-ingest together with zinder-query and wallet-mode zinder-compat-lightwalletd. Stalled GetBlockRange responses on the lightwalletd listener, which hand HTTP/2 slices of their stored blocks, are reset the same way, so those blocks are released with the stream's queued data instead of being kept until the client disconnects. A stream whose data the connection cannot write out within the timeout, because the socket is slow or shared with busy streams, is reset the same way.
