kind: fixed
body: 'Native `WalletQuery.Transaction` and `zinder-client` now report a transaction as not found only when the absence is proven, so a wallet can safely treat `TxStatus::NotFound` as "never mined at this epoch". A proven absence is gRPC `NOT_FOUND` with the new reason `TRANSACTION_NOT_FOUND`, whose metadata names the epoch it covers, the covered heights, and whether the live mempool was searched. A pinned lookup (`at_epoch_id`, or a `ChainSnapshot`) covers that epoch''s canonical chain only; an unpinned lookup also covers the writer''s mempool at the same epoch. Storage faults, a missing or unserved epoch, and a block outside the best chain are now errors rather than `NotFound`. A store whose history starts after a checkpoint answers a miss with the new `CANONICAL_HISTORY_UNAVAILABLE` reason (`IndexerError::CanonicalHistoryUnavailable` with the first retained height). An unpinned lookup on a deployment without a live mempool view fails with `DEPENDENCY_NOT_CONFIGURED`. Upgrade notes: the native contract revision is now 6, and native query and ingest must run the same revision. The new client reports a `NOT_FOUND` from an older server as `IndexerError::TransactionAbsenceUnverified` instead of `NotFound`, so upgrade servers before relying on absences; an older client keeps reading every `NOT_FOUND` as `NotFound`. PLACEHOLDER: the pull request number below is 0; replace it, and rename this file to match, once the pull request exists.'
