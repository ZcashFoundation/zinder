kind: changed
body: lightwalletd block reads that name a height one or two blocks past the reader's visible tip now wait up to 3 seconds for that block instead of failing at once, so a wallet that learned a new tip from another reader behind the same load balancer gets the block. This covers `GetBlock` and `GetBlockNullifiers` by height, the block-range and encoded block-range methods, and `GetTreeState` by height. When the wait expires, the method returns the status it returned before. Set the wait with `compat.tip_wait_ms` (`ZINDER_COMPAT__TIP_WAIT_MS`, 3000 by default, 0 restores the immediate answer), the window with `compat.tip_wait_max_blocks` (2 by default), and the concurrent waiters with `compat.tip_wait_max_waiters` (256 by default); the defaults are provisional until cross-region skew is measured. A non-zero wait shorter than twice `storage.secondary_catchup_interval_ms` now fails startup, so a reader with a catch-up interval above 1,500 ms must lower the interval, raise the wait, or set it to 0. New metrics `zinder_compat_tip_wait_total`, `zinder_compat_tip_wait_duration_seconds`, and `zinder_compat_tip_waiters` report the waits. Every public gRPC listener now answers a request whose `grpc-timeout` expires before its response starts with `DEADLINE_EXCEEDED` instead of `CANCELLED`, so `zinder_wallet_rpc_requests_total{grpc_code}` counts those requests as `deadline_exceeded`.
