[package]
name = "zinder"
version.workspace = true
description = "Unified Zinder CLI, runtime supervisor, and operational control binary"
edition.workspace = true
readme = "../../README.md"
keywords = ["zcash", "indexer", "wallet"]
categories = ["command-line-utilities"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
clap = { workspace = true, features = ["derive"] }
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body-util.workspace = true
http.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
metrics.workspace = true
parking_lot.workspace = true
prost.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tonic-web.workspace = true
tonic.workspace = true
tonic-reflection.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tower.workspace = true
tracing.workspace = true
zebra-chain.workspace = true
zinder-compat-cipherscan.workspace = true
zinder-compat-lightwalletd.workspace = true
zinder-core.workspace = true
zinder-explorer.workspace = true
zinder-ingest.workspace = true
zinder-projector.workspace = true
zinder-proto.workspace = true
zinder-query.workspace = true
zinder-runtime.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[[bin]]
name = "zinder"
path = "src/main.rs"

[dev-dependencies]
tokio-stream.workspace = true
base64.workspace = true
eyre.workspace = true
flate2.workspace = true
reqwest = { workspace = true, features = ["http2"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tonic-types.workspace = true
zinder-materialized-views.workspace = true
zinder-store.workspace = true
zinder-testkit.workspace = true
zinder-wallet-rocksdb.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
