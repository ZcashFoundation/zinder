name: ci-pr

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.19.4"
  CARGO_LLVM_COV_VERSION: "0.8.5"
  CARGO_MACHETE_VERSION: "0.9.2"
  CARGO_MUTANTS_VERSION: "27.0.0"
  CARGO_NEXTEST_VERSION: "0.9.116"
  PROTOC: /does/not/exist
  PROTOC_VERSION: "29.3"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: zinder_bench
          POSTGRES_USER: zinder_bench
          POSTGRES_PASSWORD: zinder_bench_ci_only
          POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username zinder_bench --dbname zinder_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version "${CARGO_NEXTEST_VERSION}"

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Check hermetic protobuf consumer build
        env:
          PROTOC: /does/not/exist
        run: cargo check --locked -p zinder-proto

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (unit + integration)
        run: cargo nextest run --profile=ci

      - name: Test (PostgreSQL driver)
        env:
          ZINDER_TEST_POSTGRES_DATABASE_URL: postgresql://zinder_bench:zinder_bench_ci_only@127.0.0.1:5432/zinder_bench
        run: cargo nextest run -p zinder-bench --profile=ci-postgres --run-ignored=all

      - name: Test (consumer parity)
        run: cargo nextest run --profile=ci-parity

      - name: Test (perf)
        run: cargo nextest run --profile=ci-perf

      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

      - name: Diff hygiene
        run: git diff --check

  dependencies:
    name: dependency hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify workflow action pins
        run: scripts/test-workflow-action-pins.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Install Changie
        uses: miniscruff/changie-action@11bcad388e7973948cbcecb10863baf024d5f607 # v3.0.0
        with:
          version: v1.25.1

      - name: Test changelog policy
        run: scripts/test-changelog.sh

      - name: Require release note fragment or waiver
        if: github.event_name == 'pull_request'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pr_body_file="${RUNNER_TEMP}/pr-body.md"
          printf '%s\n' "$PR_BODY" > "$pr_body_file"
          scripts/validate-changelog.sh \
            pr \
            "$BASE_COMMIT" \
            "$HEAD_COMMIT" \
            "$pr_body_file"

      - name: Verify pending changelog fragments
        if: github.event_name != 'pull_request'
        run: scripts/validate-changelog.sh fragments

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Verify PostgreSQL protocol patch
        run: scripts/check-postgres-protocol-patch.sh

      - name: Verify Zcash upstream alignment
        run: scripts/check-zcash-upstream-alignment.sh

      - name: Verify release identity policy
        run: scripts/test-release-tag.sh

      - name: Test GitHub release discovery
        run: scripts/test-github-release-lookup.sh

      - name: Test release binary archive policy
        run: scripts/test-release-binary-archive.sh

      - name: Test release SBOM and image evidence policy
        run: scripts/test-release-sbom.sh

      - name: Test deployment admission
        run: scripts/test-deployment-admission.sh

      - name: Test wallet-serving entrypoint
        run: scripts/test-wallet-serving-entrypoint.sh

      - name: Test release image publication
        run: scripts/test-release-image-publication.sh

      - name: Test storage benchmark contracts
        run: |
          scripts/test-container-resource-evidence.sh
          scripts/test-storage-benchmark-campaign-validator.sh
          scripts/test-observability-smoke-safety.sh
          env \
            ZINDER_BENCH_IMAGE=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            ZINDER_BENCH_SOFTWARE_REVISION=ci \
            ZINDER_BENCH_RUNNER_ID=ci-storage-runner \
            ZINDER_BENCH_STORAGE_CLASS=ci-local-storage \
            ZINDER_BENCH_TRIAL_ID=ci-trial \
            ZINDER_BENCH_FIXTURE_CACHE_POLICY=warm \
            docker compose \
              --env-file deploy/.env.storage-benchmark.example \
              -f deploy/docker-compose.storage-benchmark.yml \
              --profile comparison \
              --profile oracle \
              --profile postgres \
              --profile rocksdb \
              config >/dev/null

      - name: Test deployment Compose contract
        env:
          ZINDER_INGEST_IMAGE: zinder-ingest:ci-proof
          ZINDER_PROJECTOR_IMAGE: zinder-projector:ci-proof
          ZINDER_QUERY_IMAGE: zinder-query:ci-proof
          ZINDER_COMPAT_IMAGE: zinder-compat-lightwalletd:ci-proof
          ZINDER_SINGLE_HOST_DATA_VOLUME_NAME: zinder-ci-proof-data
          ZINDER_PROMETHEUS_VOLUME_NAME: zinder-ci-proof-prometheus
          ZINDER_GRAFANA_VOLUME_NAME: zinder-ci-proof-grafana
          ZINDER_OBSERVABILITY_NETWORK_NAME: zinder-ci-proof-observability
        run: |
          docker compose \
            --env-file deploy/.env.testnet \
            -f deploy/docker-compose.yml \
            --profile observability \
            config --format json \
          | jq -e '
              .services["zinder-ingest"].command == ["--config", "/etc/zinder/config.toml"]
              and .services["zinder-projector"].command == ["--config", "/etc/zinder/config.toml"]
              and .services["zinder-query"].command == ["--config", "/etc/zinder/config.toml"]
              and .services["zinder-compat-lightwalletd"].command == ["--config", "/etc/zinder/config.toml"]
              and .services["zinder-ingest"].image == "zinder-ingest:ci-proof"
              and .services["zinder-projector"].image == "zinder-projector:ci-proof"
              and .services["zinder-query"].image == "zinder-query:ci-proof"
              and .services["zinder-compat-lightwalletd"].image == "zinder-compat-lightwalletd:ci-proof"
              and .services["zinder-projector"].network_mode == "service:zinder-ingest"
              and .services["zinder-query"].network_mode == "service:zinder-ingest"
              and .services["zinder-compat-lightwalletd"].network_mode == "service:zinder-ingest"
              and .volumes.data.name == "zinder-ci-proof-data"
              and .volumes.prometheus.name == "zinder-ci-proof-prometheus"
              and .volumes.grafana.name == "zinder-ci-proof-grafana"
              and .networks.observability.name == "zinder-ci-proof-observability"
            '

      - name: Test PostgreSQL resource observer chain
        env:
          ZINDER_BENCH_IMAGE: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ZINDER_BENCH_SOFTWARE_REVISION: ci-compose
          ZINDER_BENCH_RUNNER_ID: ci-storage-runner
          ZINDER_BENCH_STORAGE_CLASS: ci-local-storage
          ZINDER_BENCH_TRIAL_ID: ci-compose
          ZINDER_BENCH_FIXTURE_CACHE_POLICY: warm
          ZINDER_BENCH_PROJECT_NAME: zinder-storage-observer-ci
          ZINDER_BENCH_RESULTS_PATH: ../benchmark-results
          ZINDER_BENCH_POSTGRES_DATABASE_CPUS: "2.0"
        run: |
          set -euo pipefail
          evidence_path="benchmark-results/postgres-canonical-replay-storage-database-ci-compose-ci-compose.resources.json"
          mkdir -p benchmark-results
          cleanup() {
            docker compose \
              --env-file deploy/.env.storage-benchmark.example \
              -f deploy/docker-compose.storage-benchmark.yml \
              --profile postgres \
              down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose \
            --env-file deploy/.env.storage-benchmark.example \
            -f deploy/docker-compose.storage-benchmark.yml \
            --profile postgres \
            up -d --wait postgres-database
          docker compose \
            --env-file deploy/.env.storage-benchmark.example \
            -f deploy/docker-compose.storage-benchmark.yml \
            exec -T postgres-database \
            pg_isready --username zinder_bench --dbname zinder_bench
          published_postgres_endpoint="$(
            docker compose \
              --env-file deploy/.env.storage-benchmark.example \
              -f deploy/docker-compose.storage-benchmark.yml \
              port postgres-database 5432
          )"
          test "${published_postgres_endpoint}" = "127.0.0.1:55432"
          python3 -c 'import socket; connection = socket.create_connection(("127.0.0.1", 55432), timeout=5); connection.close()'
          docker compose \
            --env-file deploy/.env.storage-benchmark.example \
            -f deploy/docker-compose.storage-benchmark.yml \
            --profile postgres \
            stop postgres-database

          jq -e '
            .evidence_format_version == 1
            and .component_id == "postgres-canonical-replay-storage-database"
            and .trial_id == "ci-compose"
            and .child_exit_status == 0
            and .sources.cgroup_namespace.support == "verified-private"
            and .sources.memory_peak.support == "exact"
            and .sources.memory_current.support == "exact"
            and .sources.storage.support == "sampled"
          ' "$evidence_path" >/dev/null

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "${CARGO_DENY_VERSION}"

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version "${CARGO_MACHETE_VERSION}"

      - name: Deny
        run: cargo deny check

      - name: Machete
        run: cargo machete

  sdk-packages:
    name: public SDK packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Verify registry packages and extracted consumer
        env:
          PROTOC: /does/not/exist
        run: scripts/verify-sdk-packages.sh

  vendored-proto:
    name: vendored proto drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify lightwalletd protocol pin
        run: |
          set -euo pipefail
          upstream_commit="$(cat crates/zinder-proto/proto/compat/lightwalletd/COMMIT)"
          upstream_base="https://raw.githubusercontent.com/zcash/lightwallet-protocol/${upstream_commit}/walletrpc"
          tempdir="$(mktemp -d)"
          trap 'rm -rf "${tempdir}"' EXIT

          for proto in compact_formats.proto service.proto; do
            perl -pe 's/[ \t]+$//' \
              "crates/zinder-proto/proto/compat/lightwalletd/${proto}" \
              > "${tempdir}/${proto}.local"
            curl -fsSL "${upstream_base}/${proto}" \
              | perl -pe 's/[ \t]+$//' \
              > "${tempdir}/${proto}.upstream"
            diff -u "${tempdir}/${proto}.local" "${tempdir}/${proto}.upstream"
          done

      - name: Verify Zebra indexer protocol pin
        run: |
          set -euo pipefail
          upstream_commit="$(cat crates/zinder-proto/proto/external/zebra/COMMIT)"
          upstream_url="https://raw.githubusercontent.com/ZcashFoundation/zebra/${upstream_commit}/zebra-rpc/proto/indexer.proto"
          tempdir="$(mktemp -d)"
          trap 'rm -rf "${tempdir}"' EXIT

          perl -pe 's/[ \t]+$//' \
            crates/zinder-proto/proto/external/zebra/indexer.proto \
            > "${tempdir}/indexer.proto.local"
          curl -fsSL "$upstream_url" \
            | perl -pe 's/[ \t]+$//' \
            > "${tempdir}/indexer.proto.upstream"
          diff -u \
            "${tempdir}/indexer.proto.local" \
            "${tempdir}/indexer.proto.upstream"

  coverage:
    name: coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "${CARGO_LLVM_COV_VERSION}"

      - name: Coverage
        run: cargo llvm-cov --workspace --all-features --no-report

  mutation:
    name: mutation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version "${CARGO_MUTANTS_VERSION}"

      - name: Mutate critical contracts
        run: |
          cargo mutants \
            --workspace \
            --all-features \
            --jobs 3 \
            --timeout 180 \
            --file crates/zinder-store/src/chain_store.rs \
            --file crates/zinder-store/src/chain_store/validation.rs \
            --file crates/zinder-store/src/format/stream_cursor.rs \
            --file crates/zinder-store/src/canonical_store/rocksdb.rs \
            --file crates/zinder-store/src/canonical_store/activation_schedule.rs \
            --file crates/zinder-store/src/canonical_store/control.rs \
            --file crates/zinder-core/src/network_upgrade_activations.rs \
            --file crates/zinder-source/src/source_block.rs \
            --file services/zinder-ingest/src/artifact_builder.rs \
            --re 'chain_event_history|finalized_only_commit_without_artifacts|validate_reorg_window_change|verify_auth_tag|from_raw_block_bytes|compact_sapling_outputs|compact_orchard_actions|compact_note_ciphertext_prefix|matching_fingerprint_prefix_len|preserves_through|next_activation_schedule|validate_activation_expectation|read_bound|validate_open_store_control|raise_reorg_policy|decode_reorg_policy_trailer'
