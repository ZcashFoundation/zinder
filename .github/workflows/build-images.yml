name: build-images

# Build every runtime image on PRs that could affect Rust binaries, Docker
# contexts, or the image workflow. Tagged releases push through release.yml.
# Pushes to main save the build-base layer cache that pull requests read. The
# Cargo cache these builds restore is saved by binary-archives.yml.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "crates/**"
      - "services/**"
      - "tools/**"
      - "deploy/Dockerfile"
      - ".github/actions/buildkit-cargo-cache/**"
      - "deploy/docker-compose.yml"
      - "deploy/personal/**"
      - "deploy/zebra/regtest.toml"
      - "scripts/test-personal-compose.sh"
      - "deploy/release-images.json"
      - "deploy/kubernetes/**"
      - "scripts/validate-deployment-admission.sh"
      - "scripts/test-deployment-admission.sh"
      - "scripts/render-personal-compose.sh"
      - "buf.yaml"
      - ".github/workflows/build-images.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "crates/**"
      - "services/**"
      - "tools/**"
      - "deploy/Dockerfile"
      - ".github/actions/buildkit-cargo-cache/**"
      - "deploy/docker-compose.yml"
      - "deploy/personal/**"
      - "deploy/zebra/regtest.toml"
      - "scripts/test-personal-compose.sh"
      - "deploy/release-images.json"
      - "deploy/kubernetes/**"
      - "scripts/validate-deployment-admission.sh"
      - "scripts/test-deployment-admission.sh"
      - "scripts/render-personal-compose.sh"
      - "buf.yaml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests cancel their superseded run. Other runs queue per branch, so
  # two main runs never race to save the same cache key.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify deployment admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_images: ${{ steps.images.outputs.release_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify deployment admission
        run: bash scripts/test-deployment-admission.sh

      - name: Resolve release images
        id: images
        run: printf 'release_images=%s\n' "$(jq -c '.' deploy/release-images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build runtime images (${{ matrix.platform.name }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      PR_TAG: pr-${{ github.event.pull_request.number || 'manual' }}-${{ matrix.platform.name }}
      CACHE_SCOPE: zinder-build-base-${{ matrix.platform.name }}
      PLATFORM_REF: ${{ matrix.platform.ref }}
      RELEASE_IMAGES_JSON: ${{ needs.verify.outputs.release_images }}
      SMOKE_BUILD_GIT_COMMIT: 0123456789abcdef0123456789abcdef01234567
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `docker buildx build --cache-from/--cache-to type=gha` and the cache
      # action read the Actions cache service from ACTIONS_* variables, which
      # run steps do not see unless an action exports them.
      - name: Expose the Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore the BuildKit Cargo cache
        uses: ./.github/actions/buildkit-cargo-cache
        with:
          mode: restore
          arch: ${{ matrix.platform.name }}

      - name: Build and smoke test images
        run: |
          set -euo pipefail

          # The release verifies each image by exporting its filesystem to a
          # local directory, which fails on directories the runner user
          # cannot traverse, so the smoke build performs the same export.
          export_image_root() {
            local image_root="${RUNNER_TEMP}/image-root"
            rm -rf "$image_root"
            docker buildx build \
              --file deploy/Dockerfile \
              --target "$1" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${SMOKE_BUILD_GIT_COMMIT}" \
              --output "type=local,dest=${image_root}" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              .
            rm -rf "$image_root"
          }

          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"
          while IFS= read -r image_name; do

            docker buildx build \
              --file deploy/Dockerfile \
              --target "$image_name" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${SMOKE_BUILD_GIT_COMMIT}" \
              --load \
              --tag "${image_name}:${PR_TAG}" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              .

            docker image inspect "${image_name}:${PR_TAG}" \
              --format 'image={{.Id}} size_bytes={{.Size}}'
            docker run --rm "${image_name}:${PR_TAG}" --help >/dev/null
            docker run --rm "${image_name}:${PR_TAG}" config validate --help >/dev/null
            image_user="$(docker image inspect "${image_name}:${PR_TAG}" --format '{{.Config.User}}')"
            if [ "$image_user" != "10001:10001" ]; then
              echo "::error::${image_name} runs as ${image_user}, not 10001:10001"
              exit 1
            fi
            # The healthcheck must fail against a closed port (exit 1) rather
            # than returning a CLI usage error.
            if docker run --rm "${image_name}:${PR_TAG}" healthcheck --addr 127.0.0.1:1; then
              echo "::error::${image_name} healthcheck passed against a closed port"
              exit 1
            fi
            docker run --rm "${image_name}:${PR_TAG}" healthcheck --help >/dev/null
            export_image_root "$image_name"
          done <<< "$image_names"

      - name: Start and verify the personal-node bundle
        run: scripts/test-personal-compose.sh "zinder:${PR_TAG}"

      # One export of the build-base stage, from main only. Later stages copy
      # the workspace and change on every commit, so their layers are not
      # worth caching.
      - name: Save the build-base layer cache
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx build \
            --file deploy/Dockerfile \
            --target zinder-build-base \
            --platform "$PLATFORM_REF" \
            --cache-from "type=gha,scope=${CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
            .
