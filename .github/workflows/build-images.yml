name: build-images

# Build every deploy/Dockerfile runtime image on PRs that could affect Rust
# binaries, Docker contexts, or the image workflow. The wallet-serving and
# Railway Dockerfiles are not built here: each needs its own Rust compile, so
# scripts/check-docker-build-context.sh in ci-pr.yml covers only their build
# context. Tagged releases push through release.yml.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "crates/**"
      - "services/**"
      - "deploy/Dockerfile"
      - "deploy/Dockerfile.railway-nocache"
      - "deploy/Dockerfile.wallet-serving"
      - "deploy/docker-compose.yml"
      - "deploy/release-images.json"
      - "railway.toml"
      - "scripts/validate-deployment-admission.sh"
      - "scripts/test-deployment-admission.sh"
      - "buf.yaml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify deployment admission
    runs-on: ubuntu-latest
    outputs:
      release_images: ${{ steps.images.outputs.release_images }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify deployment admission
        run: bash scripts/test-deployment-admission.sh

      - name: Resolve release images
        id: images
        run: printf 'release_images=%s\n' "$(jq -c '.' deploy/release-images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build runtime images (${{ matrix.platform.name }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      PR_TAG: pr-${{ github.event.pull_request.number || 'manual' }}-${{ matrix.platform.name }}
      CACHE_SCOPE: zinder-rust-pr-${{ matrix.platform.name }}
      PLATFORM_REF: ${{ matrix.platform.ref }}
      RELEASE_IMAGES_JSON: ${{ needs.verify.outputs.release_images }}
      SMOKE_BUILD_GIT_COMMIT: 0123456789abcdef0123456789abcdef01234567
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and smoke test images
        run: |
          set -euo pipefail

          image_names="$(
            jq -r '.[]' <<< "$RELEASE_IMAGES_JSON"
            printf '%s\n' zinder-explorer
          )"
          while IFS= read -r image_name; do

            docker buildx build \
              --file deploy/Dockerfile \
              --target "$image_name" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${SMOKE_BUILD_GIT_COMMIT}" \
              --load \
              --tag "${image_name}:${PR_TAG}" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
              .

            docker image inspect "${image_name}:${PR_TAG}" \
              --format 'image={{.Id}} size_bytes={{.Size}}'
            docker run --rm --entrypoint="$image_name" "${image_name}:${PR_TAG}" --help
          done <<< "$image_names"
