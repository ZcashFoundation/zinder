name: build-images

# Build every runtime image on PRs that could affect Rust binaries, Docker
# contexts, or the image workflow. Tagged releases push through release.yml.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "crates/**"
      - "services/**"
      - "tools/**"
      - "deploy/Dockerfile"
      - "deploy/docker-compose.yml"
      - "deploy/release-images.json"
      - "deploy/release-single-volume-images.json"
      - "deploy/canonical-runtime-entrypoint"
      - "deploy/materialize-indexer-tls"
      - "deploy/wallet-serving-runtime-entrypoint"
      - "deploy/wallet-serving-explorer-runtime-entrypoint"
      - "deploy/wallet-serving-healthcheck"
      - "deploy/config/wallet-serving/**"
      - "scripts/validate-deployment-admission.sh"
      - "scripts/test-deployment-admission.sh"
      - "buf.yaml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify deployment admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_images: ${{ steps.images.outputs.release_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify deployment admission
        run: bash scripts/test-deployment-admission.sh

      - name: Resolve release images
        id: images
        run: printf 'release_images=%s\n' "$(jq -c '.' deploy/release-images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build runtime images (${{ matrix.platform.name }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            ref: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            ref: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      PR_TAG: pr-${{ github.event.pull_request.number || 'manual' }}-${{ matrix.platform.name }}
      CACHE_SCOPE: zinder-rust-pr-${{ matrix.platform.name }}
      PLATFORM_REF: ${{ matrix.platform.ref }}
      RELEASE_IMAGES_JSON: ${{ needs.verify.outputs.release_images }}
      SMOKE_BUILD_GIT_COMMIT: 0123456789abcdef0123456789abcdef01234567
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and smoke test images
        run: |
          set -euo pipefail

          # The release verifies each image by exporting its filesystem to a
          # local directory, which fails on directories the runner user
          # cannot traverse, so the smoke build performs the same export.
          export_image_root() {
            local image_root="${RUNNER_TEMP}/image-root"
            rm -rf "$image_root"
            docker buildx build \
              --file deploy/Dockerfile \
              --target "$1" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${SMOKE_BUILD_GIT_COMMIT}" \
              --output "type=local,dest=${image_root}" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              .
            rm -rf "$image_root"
          }

          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"
          while IFS= read -r image_name; do

            docker buildx build \
              --file deploy/Dockerfile \
              --target "$image_name" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${SMOKE_BUILD_GIT_COMMIT}" \
              --load \
              --tag "${image_name}:${PR_TAG}" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
              .

            docker image inspect "${image_name}:${PR_TAG}" \
              --format 'image={{.Id}} size_bytes={{.Size}}'
            docker run --rm --entrypoint="$image_name" "${image_name}:${PR_TAG}" --help
            image_user="$(docker image inspect "${image_name}:${PR_TAG}" --format '{{.Config.User}}')"
            if [ "$image_user" != "10001:10001" ]; then
              echo "::error::${image_name} runs as ${image_user}, not 10001:10001"
              exit 1
            fi
            # The healthcheck must fail against a closed port and must read the
            # baked default config the image's CMD names.
            if docker run --rm --entrypoint="$image_name" "${image_name}:${PR_TAG}" \
              --config /etc/zinder/config.toml healthcheck --addr 127.0.0.1:1; then
              echo "::error::${image_name} healthcheck passed against a closed port"
              exit 1
            fi
            docker run --rm --entrypoint="$image_name" "${image_name}:${PR_TAG}" \
              --config /etc/zinder/config.toml healthcheck --help >/dev/null
            export_image_root "$image_name"
          done <<< "$image_names"

          # Single-volume host images wrap the runtime binaries in an
          # entrypoint script, so the smoke runs the ingest binary they carry
          # and confirms the configured entrypoint is installed.
          single_volume_image_names="$(jq -r '.[]' deploy/release-single-volume-images.json)"
          while IFS= read -r image_name; do
            docker buildx build \
              --file deploy/Dockerfile \
              --target "$image_name" \
              --platform "$PLATFORM_REF" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${SMOKE_BUILD_GIT_COMMIT}" \
              --load \
              --tag "${image_name}:${PR_TAG}" \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              .

            docker image inspect "${image_name}:${PR_TAG}" \
              --format 'image={{.Id}} size_bytes={{.Size}}'
            docker run --rm --entrypoint=zinder-ingest "${image_name}:${PR_TAG}" --help
            image_entrypoint="$(docker image inspect "${image_name}:${PR_TAG}" --format '{{index .Config.Entrypoint 0}}')"
            docker run --rm --entrypoint=sh "${image_name}:${PR_TAG}" -c 'test -x "$(command -v "$1")"' sh "$image_entrypoint"
            docker run --rm --entrypoint=sh "${image_name}:${PR_TAG}" \
              -c 'test "$(id -u zinder):$(id -g zinder)" = "10001:10001"'
            export_image_root "$image_name"
          done <<< "$single_volume_image_names"
