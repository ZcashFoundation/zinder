name: binary-archives

on:
  pull_request:
    paths:
      - ".github/workflows/binary-archives.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "README.md"
      - "crates/**"
      - "deploy/Dockerfile"
      - ".github/actions/build-macos-release-binary/**"
      - ".github/actions/setup-rust/**"
      - ".github/actions/buildkit-cargo-cache/**"
      - "deploy/release-images.json"
      - "rust-toolchain.toml"
      - "scripts/release-binary-platform.sh"
      - "scripts/build-release-binary-archive.sh"
      - "scripts/check-release-binary-archive.sh"
      - "scripts/check-release-sbom.sh"
      - "scripts/generate-release-sbom.sh"
      - "scripts/test-release-binary-archive.sh"
      - "scripts/test-release-sbom.sh"
      - "services/**"
      - "tools/**"
  # Pushes to main build the same archives to save the BuildKit Cargo cache
  # that pull requests restore. This workflow alone saves it.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/binary-archives.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "README.md"
      - "crates/**"
      - "deploy/Dockerfile"
      - ".github/actions/build-macos-release-binary/**"
      - ".github/actions/setup-rust/**"
      - ".github/actions/buildkit-cargo-cache/**"
      - "deploy/release-images.json"
      - "rust-toolchain.toml"
      - "scripts/release-binary-platform.sh"
      - "scripts/build-release-binary-archive.sh"
      - "scripts/check-release-binary-archive.sh"
      - "scripts/check-release-sbom.sh"
      - "scripts/generate-release-sbom.sh"
      - "scripts/test-release-binary-archive.sh"
      - "scripts/test-release-sbom.sh"
      - "services/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests cancel their superseded run. Other runs queue per branch, so
  # two main runs never race to save the same cache key.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive:
    name: binary archive (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64-v3-unknown-linux-gnu
            arch: amd64
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            jemalloc_page_size: 4096
          - name: x86_64-unknown-linux-gnu
            arch: amd64
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            jemalloc_page_size: 4096
            cpu_baseline: x86-64
            pasta_asm: '0'
          - name: aarch64-unknown-linux-gnu
            arch: arm64
            docker: linux/arm64
            rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            jemalloc_page_size: 65536
          - name: aarch64-apple-darwin
            rust: aarch64-apple-darwin
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build native Apple Silicon binary
        if: runner.os == 'macOS'
        uses: ./.github/actions/build-macos-release-binary
        with:
          commit: ${{ github.sha }}

      # `docker buildx build --cache-from/--cache-to type=gha` and the cache
      # action read the Actions cache service from ACTIONS_* variables, which
      # run steps do not see unless an action exports them.
      - name: Expose the Actions cache runtime
        if: runner.os == 'Linux'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore the BuildKit Cargo cache
        if: runner.os == 'Linux'
        uses: ./.github/actions/buildkit-cargo-cache
        with:
          mode: restore
          arch: ${{ matrix.platform.arch }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Build and verify binary archive
        env:
          BUILD_BASE_CACHE: zinder-build-base-${{ matrix.platform.arch }}
          CPU_BASELINE: ${{ matrix.platform.cpu_baseline }}
          PASTA_ASM: ${{ matrix.platform.pasta_asm || '1' }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          JEMALLOC_PAGE_SIZE: ${{ matrix.platform.jemalloc_page_size }}
          RUST_TARGET: ${{ matrix.platform.rust }}
          TARGET_PLATFORM: ${{ matrix.platform.docker }}
        run: |
          set -euo pipefail

          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "zinder-core") | .version')"
          release_tag="v${version}"
          commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker buildx build \
              --platform "$TARGET_PLATFORM" \
              --target release-binaries \
              --build-arg "RELEASE_CACHE_SCOPE=${CPU_BASELINE:-shared}" \
              --build-arg "ZINDER_X86_64_CPU_BASELINE=${CPU_BASELINE:-x86-64-v3}" \
              --build-arg "ZINDER_PASTA_ASM=${PASTA_ASM}" \
              --cache-from "type=gha,scope=${BUILD_BASE_CACHE}" \
              --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${commit}" \
              --output "type=local,dest=${RUNNER_TEMP}/binary-export" \
              --file deploy/Dockerfile \
              .
          fi
          scripts/build-release-binary-archive.sh \
            --binaries "${RUNNER_TEMP}/binary-export/bin" \
            --output dist \
            --version "$version" \
            --tag "$release_tag" \
            --commit "$commit" \
            --target "$RUST_TARGET" \
            --cpu-baseline "$CPU_BASELINE" \
            --pasta-asm "$PASTA_ASM" \
            --source-date-epoch "$source_date_epoch"
          archive_path="$(find dist -maxdepth 1 -type f -name '*.tar.gz')"
          scripts/check-release-binary-archive.sh "$archive_path" \
            --version "$version" \
            --tag "$release_tag" \
            --commit "$commit" \
            --target "$RUST_TARGET" \
            --cpu-baseline "$CPU_BASELINE" \
            --pasta-asm "$PASTA_ASM" \
            --source-date-epoch "$source_date_epoch"
          [[ "$(basename -- "$archive_path")" == "zinder-${version}-${PLATFORM_NAME}.tar.gz" ]]
          sbom_path="dist/zinder-${version}-${PLATFORM_NAME}.spdx.json"
          scripts/generate-release-sbom.sh \
            --archive "$archive_path" \
            --output "$sbom_path" \
            --version "$version" \
            --platform "$PLATFORM_NAME" \
            --commit "$commit"
          scripts/check-release-sbom.sh "$sbom_path" \
            --archive "$archive_path" \
            --version "$version" \
            --platform "$PLATFORM_NAME" \
            --commit "$commit"
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker run --rm \
              --platform "$TARGET_PLATFORM" \
              --env JEMALLOC_PAGE_SIZE \
              --volume "${RUNNER_TEMP}/binary-export/bin:/opt/zinder/bin:ro" \
              debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
              sh -ec '
                apt-get update >/dev/null
                apt-get install -y --no-install-recommends ca-certificates libstdc++6 >/dev/null
                for binary in /opt/zinder/bin/*; do
                  "$binary" --version
                  "$binary" --help >/dev/null
                  MALLOC_CONF=stats_print:true "$binary" --version 2>&1 >/dev/null \
                    | grep -Fqx "Page size: ${JEMALLOC_PAGE_SIZE}" \
                    || { echo "$binary: jemalloc page size is not ${JEMALLOC_PAGE_SIZE}" >&2; exit 1; }
                done
              '
          fi

      - name: Check baseline x86-64 without AVX2 or ADX
        if: matrix.platform.cpu_baseline == 'x86-64'
        env:
          ZINDER_NETWORK__NAME: zcash-regtest
          ZINDER_NODE__JSON_RPC_ADDR: http://127.0.0.1:8232
          ZINDER_NODE__AUTH__METHOD: none
        run: |
          # The runner may ship an amd64v3 loader that uses AVX before Zinder starts.
          docker run --rm --platform linux/amd64 \
            --env ZINDER_NETWORK__NAME \
            --env ZINDER_NODE__JSON_RPC_ADDR \
            --env ZINDER_NODE__AUTH__METHOD \
            --volume "${RUNNER_TEMP}/binary-export/bin:/opt/zinder/bin:ro" \
            debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
            sh -ec '
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends libstdc++6 qemu-user >/dev/null
              ulimit -c 0
              qemu-x86_64 -cpu qemu64 /opt/zinder/bin/zinder run ingest --print-config >/dev/null
            '

      - name: Save the BuildKit Cargo cache
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux' && matrix.platform.cpu_baseline == ''
        uses: ./.github/actions/buildkit-cargo-cache
        with:
          mode: save
          arch: ${{ matrix.platform.arch }}

      - name: Upload binary archive and SBOM
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform.name }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error
          retention-days: 3
