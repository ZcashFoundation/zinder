name: binary-archives

on:
  pull_request:
    paths:
      - ".github/workflows/binary-archives.yml"
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "README.md"
      - "crates/**"
      - "deploy/Dockerfile"
      - "deploy/release-images.json"
      - "rust-toolchain.toml"
      - "scripts/build-release-binary-archive.sh"
      - "scripts/check-release-binary-archive.sh"
      - "scripts/check-release-sbom.sh"
      - "scripts/generate-release-sbom.sh"
      - "scripts/test-release-binary-archive.sh"
      - "scripts/test-release-sbom.sh"
      - "services/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-archives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: binary archive (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64-v3-unknown-linux-gnu
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            jemalloc_page_size: 4096
          - name: aarch64-unknown-linux-gnu
            docker: linux/arm64
            rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            jemalloc_page_size: 65536
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Build and verify binary archive
        env:
          JEMALLOC_PAGE_SIZE: ${{ matrix.platform.jemalloc_page_size }}
          RUST_TARGET: ${{ matrix.platform.rust }}
          TARGET_PLATFORM: ${{ matrix.platform.docker }}
        run: |
          set -euo pipefail

          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "zinder-core") | .version')"
          release_tag="v${version}"
          commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          docker buildx build \
            --platform "$TARGET_PLATFORM" \
            --target release-binaries \
            --build-arg "RELEASE_CACHE_SCOPE=pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUST_TARGET}" \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --build-arg "ZINDER_BUILD_GIT_COMMIT=${commit}" \
            --output "type=local,dest=${RUNNER_TEMP}/binary-export" \
            --file deploy/Dockerfile \
            .
          scripts/build-release-binary-archive.sh \
            --binaries "${RUNNER_TEMP}/binary-export/bin" \
            --output dist \
            --version "$version" \
            --tag "$release_tag" \
            --commit "$commit" \
            --target "$RUST_TARGET" \
            --source-date-epoch "$source_date_epoch"
          archive_path="$(find dist -maxdepth 1 -type f -name '*.tar.gz')"
          scripts/check-release-binary-archive.sh "$archive_path" \
            --version "$version" \
            --tag "$release_tag" \
            --commit "$commit" \
            --target "$RUST_TARGET" \
            --source-date-epoch "$source_date_epoch"
          platform="$(jq -r '.release_platform' < <(tar -xOzf "$archive_path" --wildcards '*/BUILD-INFO.json'))"
          sbom_path="dist/zinder-${version}-${platform}.spdx.json"
          scripts/generate-release-sbom.sh \
            --archive "$archive_path" \
            --output "$sbom_path" \
            --version "$version" \
            --platform "$platform" \
            --commit "$commit"
          scripts/check-release-sbom.sh "$sbom_path" \
            --archive "$archive_path" \
            --version "$version" \
            --platform "$platform" \
            --commit "$commit"
          docker run --rm \
            --platform "$TARGET_PLATFORM" \
            --env JEMALLOC_PAGE_SIZE \
            --volume "${RUNNER_TEMP}/binary-export/bin:/opt/zinder/bin:ro" \
            debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
            sh -ec '
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends ca-certificates libstdc++6 >/dev/null
              for binary in /opt/zinder/bin/*; do
                "$binary" --version
                "$binary" --help >/dev/null
                MALLOC_CONF=stats_print:true "$binary" --version 2>&1 >/dev/null \
                  | grep -Fqx "Page size: ${JEMALLOC_PAGE_SIZE}" \
                  || { echo "$binary: jemalloc page size is not ${JEMALLOC_PAGE_SIZE}" >&2; exit 1; }
              done
            '

      - name: Upload binary archive and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform.name }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error
          retention-days: 3
