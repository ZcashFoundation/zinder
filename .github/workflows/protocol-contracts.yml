name: protocol-contracts

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "buf.gen.yaml"
      - "buf.yaml"
      - "scripts/generate-api-artifacts.sh"
      - "scripts/check-api-artifact.sh"
      - "scripts/check-native-proto-closure.sh"
      - "scripts/check-published-proto-compatibility.sh"
      - "scripts/regenerate-zinder-proto.sh"
      - "crates/zinder-client/src/**"
      - "crates/zinder-client/tests/integration/capability_coverage.rs"
      - "crates/zinder-proto/generated/**"
      - "crates/zinder-proto/buf.release*.yaml"
      - "crates/zinder-proto/proto/**"
      - "crates/zinder-proto/src/capabilities.rs"
      - "tools/zinder-proto-codegen/**"
      - ".github/workflows/protocol-contracts.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-rust/**"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "buf.gen.yaml"
      - "buf.yaml"
      - "scripts/generate-api-artifacts.sh"
      - "scripts/check-api-artifact.sh"
      - "scripts/check-native-proto-closure.sh"
      - "scripts/check-published-proto-compatibility.sh"
      - "scripts/regenerate-zinder-proto.sh"
      - "crates/zinder-client/src/**"
      - "crates/zinder-client/tests/integration/capability_coverage.rs"
      - "crates/zinder-proto/generated/**"
      - "crates/zinder-proto/buf.release*.yaml"
      - "crates/zinder-proto/proto/**"
      - "crates/zinder-proto/src/capabilities.rs"
      - "tools/zinder-proto-codegen/**"
      - ".github/workflows/protocol-contracts.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-rust/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Swatinem/rust-cache hashes every CARGO_* and RUST* variable into its key.
# Capability coverage reads ci-pr.yml's test cache, so keep the CARGO_*
# variables identical to that workflow's.
env:
  BUF_VERSION: "1.75.0"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  PROTOC_VERSION: "36.2"

jobs:
  generated-proto:
    name: checked-in generated proto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: proto-codegen
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify checked-in Rust and descriptors
        run: PROTOC="$(command -v protoc)" scripts/regenerate-zinder-proto.sh --check

  proto-breaking:
    name: proto breaking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and verify the API release archive
        id: archive
        run: |
          set -euo pipefail
          scripts/generate-api-artifacts.sh v0.0.0-ci
          scripts/check-api-artifact.sh dist/zinder-api-docs-v0.0.0-ci.tar.gz

      - name: Check protobuf compatibility against the pull request base
        if: >-
          ${{
          !cancelled() && steps.archive.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'allow-proto-breaking')
          }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/base"
          git archive "$BASE_SHA" -- crates/zinder-proto/proto \
            | tar -xf - --strip-components=2 -C "$scratch/base"
          cp crates/zinder-proto/buf.release.yaml "$scratch/base/buf.yaml"
          buf build "$scratch/base" --as-file-descriptor-set \
            --output "$scratch/base.contract.descriptor.bin"
          buf breaking dist/zinder.contract.descriptor.bin \
            --against "$scratch/base.contract.descriptor.bin" \
            --config crates/zinder-proto/buf.release.yaml

      - name: Check protobuf compatibility against the published release
        if: >-
          ${{
          !cancelled() && steps.archive.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'allow-proto-breaking')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-published-proto-compatibility.sh "$GITHUB_REPOSITORY" dist/zinder.contract.descriptor.bin

  capability-coverage:
    name: capability coverage
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'allow-capability-drift')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads ci-pr.yml's test cache and never saves, so this job keeps no
      # cache of its own.
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: test

      - name: Check ChainIndex capability coverage
        env:
          PROTOC: /does/not/exist
        run: cargo test --locked -p zinder-client --test acceptance typed_chain_index_covers_every_advertised_wallet_capability
