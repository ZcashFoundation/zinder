name: release

# A release tag names the product version already present in Cargo metadata.
# One review of the release environment gates crate publication, the first
# credentialed job; every later job depends on it. Exact image tags and
# API assets are prepared before the GitHub Release is published, and stable
# `latest` image tags move only after every required artifact succeeds.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  BUF_VERSION: "1.68.2"
  RELEASE_IMAGES_FILE: deploy/release-images.json
  RELEASE_SINGLE_VOLUME_IMAGES_FILE: deploy/release-single-volume-images.json

jobs:
  validate:
    name: validate release identity
    runs-on: ubuntu-latest
    outputs:
      base_commit: ${{ steps.identity.outputs.base_commit }}
      commit: ${{ steps.identity.outputs.commit }}
      release_images: ${{ steps.images.outputs.release_images }}
      stable: ${{ steps.identity.outputs.stable }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Changie
        uses: miniscruff/changie-action@11bcad388e7973948cbcecb10863baf024d5f607 # v3.0.0
        with:
          version: v1.25.1

      - name: Verify tag, version, and main ancestry
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/validate-release-tag.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          release_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "release tag target is not reachable from main" >&2
            exit 1
          }
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          previous_tag="$(
            git describe \
              --first-parent \
              --tags \
              --abbrev=0 \
              --match 'v[0-9]*' \
              "${release_commit}^"
          )"
          previous_version="${previous_tag#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          [[ "$previous_tag" == v* && "$previous_version" =~ $semver_pattern ]] || {
            echo "preceding product tag is not complete SemVer: ${previous_tag}" >&2
            exit 1
          }
          prerelease="${BASH_REMATCH[5]:-}"
          IFS=. read -r -a prerelease_identifiers <<< "$prerelease"
          for identifier in "${prerelease_identifiers[@]}"; do
            [[ ! "$identifier" =~ ^0[0-9]+$ ]] || {
              echo "preceding product tag has a numeric prerelease identifier with a leading zero" >&2
              exit 1
            }
          done
          previous_commit="$(git rev-parse "${previous_tag}^{commit}")"
          printf 'base_commit=%s\n' "$previous_commit" >> "$GITHUB_OUTPUT"

      - name: Require an unpublished tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json="$(scripts/find-github-release.sh "$RELEASE_TAG")"
          if [[ -n "$release_json" ]]; then
            jq -e '.draft == true' <<< "$release_json" >/dev/null || {
              echo "published GitHub Release ${RELEASE_TAG} already exists" >&2
              exit 1
            }
          fi

      - name: Verify and extract release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          bash scripts/validate-changelog.sh release "$RELEASE_TAG"
          bash scripts/extract-release-notes.sh "$RELEASE_TAG" \
            > dist/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Verify release topology
        run: bash scripts/test-deployment-admission.sh

      - name: Resolve release images
        id: images
        run: printf 'release_images=%s\n' "$(jq -c -s 'add' "$RELEASE_IMAGES_FILE" "$RELEASE_SINGLE_VOLUME_IMAGES_FILE")" >> "$GITHUB_OUTPUT"

  api-docs:
    name: build API release artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Generate and verify API artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/generate-api-artifacts.sh

          mkdir -p dist/release
          cp -R dist/openapi dist/release/openapi
          cp -R dist/proto dist/release/proto
          cp dist/zinder.v1.descriptor.bin dist/release/zinder.v1.descriptor.bin
          bash scripts/check-native-proto-closure.sh dist/release
          tar \
            -C dist/release \
            -czf "dist/zinder-api-docs-${RELEASE_TAG}.tar.gz" \
            openapi \
            proto \
            zinder.v1.descriptor.bin

      - name: Upload API artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-api-docs
          path: |
            dist/zinder.v1.descriptor.bin
            dist/zinder-api-docs-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sdk-packages:
    name: verify public SDK packages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Verify public SDK packages
        id: package-readiness
        continue-on-error: true
        env:
          PROTOC: /does/not/exist
        run: scripts/verify-sdk-packages.sh

      - name: Check desired SDK release state
        id: cargo-release
        continue-on-error: true
        uses: ZcashFoundation/cargo-release@34a37595755444456ce0e2d2b1258d9a29c14fac
        with:
          phase: check
          base-sha: ${{ needs.validate.outputs.base_commit }}
          target-sha: ${{ needs.validate.outputs.commit }}
          github-token: ${{ github.token }}
        env:
          CARGO_INCREMENTAL: "0"
          PROTOC: /does/not/exist

      - name: Summarize SDK release readiness
        if: always()
        env:
          CARGO_RELEASE_RESULT: ${{ steps.cargo-release.outcome }}
          PACKAGE_RESULT: ${{ steps.package-readiness.outcome }}
          PLAN: ${{ steps.cargo-release.outputs.plan }}
          REPORT: ${{ steps.cargo-release.outputs.report }}
        run: |
          {
            echo "## SDK release readiness"
            echo "| Validation | Result |"
            echo "| --- | --- |"
            echo "| Hermetic packages | \`${PACKAGE_RESULT}\` |"
            echo "| Cargo Release | \`${CARGO_RELEASE_RESULT}\` |"
            if [[ -n "${PLAN}" ]]; then
              echo "### Plan"
              echo '```json'
              jq . <<< "${PLAN}"
              echo '```'
            fi
            if [[ -n "${REPORT}" ]]; then
              echo "### Observed state"
              echo '```json'
              jq . <<< "${REPORT}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful SDK release readiness
        if: always()
        env:
          CARGO_RELEASE_RESULT: ${{ steps.cargo-release.outcome }}
          PACKAGE_RESULT: ${{ steps.package-readiness.outcome }}
        run: |
          if [[ "$PACKAGE_RESULT" != success || "$CARGO_RELEASE_RESULT" != success ]]; then
            echo "::error::Review each failed SDK readiness step and the job summary."
            exit 1
          fi

  publish-sdk-crates:
    name: publish public SDK crates
    needs:
      - validate
      - api-docs
      - sdk-packages
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish and verify missing SDK crates
        uses: ZcashFoundation/cargo-release@34a37595755444456ce0e2d2b1258d9a29c14fac
        with:
          phase: publish
          base-sha: ${{ needs.validate.outputs.base_commit }}
          target-sha: ${{ needs.validate.outputs.commit }}
          github-token: ${{ github.token }}
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          PROTOC: /does/not/exist

      - name: Verify the published SDK from crates.io
        timeout-minutes: 30
        env:
          SDK_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/verify-published-sdk.sh "$SDK_VERSION"

  build:
    name: build release binaries and image digests (${{ matrix.platform.name }})
    needs:
      - validate
      - publish-sdk-crates
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64-v3-unknown-linux-gnu
            arch: amd64
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: aarch64-unknown-linux-gnu
            arch: arm64
            docker: linux/arm64
            rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      RELEASE_CACHE_SCOPE: release-${{ needs.validate.outputs.commit }}-${{ matrix.platform.rust }}-1
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.platform.rust }}
      TARGET_PLATFORM: ${{ matrix.platform.docker }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Build and verify the binary archive
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          export_root="${RUNNER_TEMP}/binary-export"
          archive_root="${RUNNER_TEMP}/binary-archive"
          docker buildx build \
            --no-cache \
            --platform "$TARGET_PLATFORM" \
            --target release-binaries \
            --build-arg "RELEASE_CACHE_SCOPE=${RELEASE_CACHE_SCOPE}" \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --build-arg "ZINDER_BUILD_GIT_COMMIT=${RELEASE_COMMIT}" \
            --output "type=local,dest=${export_root}" \
            --file deploy/Dockerfile \
            .
          scripts/build-release-binary-archive.sh \
            --binaries "${export_root}/bin" \
            --output "$archive_root" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "$RUST_TARGET" \
            --source-date-epoch "$source_date_epoch"
          archive_path="$(find "$archive_root" -maxdepth 1 -type f -name '*.tar.gz')"
          scripts/check-release-binary-archive.sh "$archive_path" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "$RUST_TARGET" \
            --source-date-epoch "$source_date_epoch"

          docker run --rm \
            --platform "$TARGET_PLATFORM" \
            --volume "${export_root}/bin:/opt/zinder/bin:ro" \
            debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
            sh -ec '
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends ca-certificates libstdc++6 >/dev/null
              for binary in /opt/zinder/bin/*; do
                "$binary" --version
                "$binary" --help >/dev/null
              done
            '

          # The candidate stays outside the checkout: a file added to the build
          # context would invalidate the binary stage the image targets reuse.
          candidate_root="${RUNNER_TEMP}/release-candidate"
          mkdir -p "$candidate_root"
          cp "$archive_path" "$candidate_root/"
          (cd "${export_root}/bin" && sha256sum -- * | sort -k2) \
            > "${candidate_root}/binaries.sha256"

          sbom_path="${candidate_root}/zinder-${RELEASE_VERSION}-${{ matrix.platform.name }}.spdx.json"
          scripts/generate-release-sbom.sh \
            --archive "${candidate_root}/$(basename -- "$archive_path")" \
            --output "$sbom_path" \
            --version "$RELEASE_VERSION" \
            --platform "${{ matrix.platform.name }}" \
            --commit "$RELEASE_COMMIT"
          scripts/check-release-sbom.sh "$sbom_path" \
            --archive "${candidate_root}/$(basename -- "$archive_path")" \
            --version "$RELEASE_VERSION" \
            --platform "${{ matrix.platform.name }}" \
            --commit "$RELEASE_COMMIT"

      - name: Upload binary archive candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 7

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image targets reuse the binary stage built above: identical build
      # arguments keep one compilation per platform, and each image is checked
      # against the archived binaries before its digest is recorded.
      - name: Build and push image digests
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          PLATFORM_ARCH: ${{ matrix.platform.arch }}
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          binary_root="${RUNNER_TEMP}/binary-export/bin"
          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          mkdir -p /tmp/digests
          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"
          while IFS= read -r image_name; do
            image_ref="ghcr.io/${owner_lc}/${image_name}"
            metadata_file="/tmp/metadata-${image_name}.json"
            image_root="${RUNNER_TEMP}/image-root"
            image_build_args=(
              --file deploy/Dockerfile
              --target "$image_name"
              --platform "$TARGET_PLATFORM"
              --build-arg "RELEASE_CACHE_SCOPE=${RELEASE_CACHE_SCOPE}"
              --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}"
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${RELEASE_COMMIT}"
            )

            docker buildx build \
              "${image_build_args[@]}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${RELEASE_COMMIT}" \
              --label "org.opencontainers.image.version=${RELEASE_TAG}" \
              --label "org.opencontainers.image.licenses=MIT" \
              --provenance=mode=max \
              --sbom=true \
              --output "type=image,name=${image_ref},push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$metadata_file" \
              .

            digest="$(jq -r '."containerimage.digest"' "$metadata_file")"
            if [[ -z "$digest" || "$digest" == null ]]; then
              echo "missing digest for ${image_name}" >&2
              exit 1
            fi

            rm -rf "$image_root"
            docker buildx build \
              "${image_build_args[@]}" \
              --provenance=false \
              --sbom=false \
              --output "type=local,dest=${image_root}" \
              .
            matched_binaries=0
            while IFS= read -r binary_name; do
              image_binary="${image_root}/usr/local/bin/${binary_name}"
              [[ -f "$image_binary" ]] || continue
              cmp -- "${binary_root}/${binary_name}" "$image_binary" || {
                echo "${image_name} carries a ${binary_name} that differs from the binary archive" >&2
                exit 1
              }
              matched_binaries=$((matched_binaries + 1))
            done < <(find "$binary_root" -maxdepth 1 -type f -printf '%f\n' | sort)
            (( matched_binaries > 0 )) || {
              echo "${image_name} carries no binary from the binary archive" >&2
              exit 1
            }
            rm -rf "$image_root"

            mkdir -p "/tmp/digests/${image_name}"
            touch "/tmp/digests/${image_name}/${PLATFORM_ARCH}-${digest#sha256:}"
          done <<< "$image_names"

      - name: Upload image digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.platform.arch }}
          path: /tmp/digests/**
          if-no-files-found: error
          retention-days: 1

  reproduce:
    name: reproduce release binaries (${{ matrix.platform.name }})
    needs:
      - validate
      - publish-sdk-crates
    permissions:
      contents: read
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64-v3-unknown-linux-gnu
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: aarch64-unknown-linux-gnu
            docker: linux/arm64
            rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the independent reproduction archive
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RUST_TARGET: ${{ matrix.platform.rust }}
          TARGET_PLATFORM: ${{ matrix.platform.docker }}
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          export_root="${RUNNER_TEMP}/binary-export"
          docker buildx build \
            --no-cache \
            --platform "$TARGET_PLATFORM" \
            --target release-binaries \
            --build-arg "RELEASE_CACHE_SCOPE=release-${RELEASE_COMMIT}-${RUST_TARGET}-2" \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --build-arg "ZINDER_BUILD_GIT_COMMIT=${RELEASE_COMMIT}" \
            --output "type=local,dest=${export_root}" \
            --file deploy/Dockerfile \
            .
          scripts/build-release-binary-archive.sh \
            --binaries "${export_root}/bin" \
            --output dist/reproduction \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "$RUST_TARGET" \
            --source-date-epoch "$source_date_epoch"
          archive_path="$(find dist/reproduction -maxdepth 1 -type f -name '*.tar.gz')"
          scripts/check-release-binary-archive.sh "$archive_path" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "$RUST_TARGET" \
            --source-date-epoch "$source_date_epoch"
          (cd "${export_root}/bin" && sha256sum -- * | sort -k2) \
            > dist/reproduction/binaries.sha256

      - name: Upload reproduction archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-reproduction-${{ matrix.platform.name }}
          path: dist/reproduction
          if-no-files-found: error
          retention-days: 1

  binary-archives:
    name: verify and attest binary archive (${{ matrix.platform }})
    needs:
      - validate
      - build
      - reproduce
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-v3-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Download binary archive candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build-${{ matrix.platform }}
          path: dist/build

      - name: Download reproduction archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-reproduction-${{ matrix.platform }}
          path: dist/reproduction

      - name: Require identical independent builds
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          archive_name="zinder-${RELEASE_VERSION}-${{ matrix.platform }}.tar.gz"
          [[ -s dist/build/binaries.sha256 ]]
          diff -u dist/build/binaries.sha256 dist/reproduction/binaries.sha256
          cmp -- "dist/build/${archive_name}" "dist/reproduction/${archive_name}"

          mkdir -p dist/binary-archive
          cp "dist/build/${archive_name}" \
            "dist/build/zinder-${RELEASE_VERSION}-${{ matrix.platform }}.spdx.json" \
            dist/binary-archive/

      - name: Attest binary provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/binary-archive/*.tar.gz
          create-storage-record: false

      - name: Attest binary SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/binary-archive/*.tar.gz
          sbom-path: dist/binary-archive/zinder-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.spdx.json
          create-storage-record: false

      - name: Upload binary archive and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binary-${{ matrix.platform }}
          path: |
            dist/binary-archive/*.tar.gz
            dist/binary-archive/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  collect-binary-assets:
    name: collect binary release assets
    needs:
      - validate
      - binary-archives
    runs-on: ubuntu-latest
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/binaries
          pattern: release-binary-*
          merge-multiple: true

      - name: Verify binary asset catalog
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          expected="$({
            printf '%s\n' \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.tar.gz"
          })"
          actual="$(find dist/binaries -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual" == "$expected" ]]

      - name: Upload binary release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binary-assets
          path: dist/binaries
          if-no-files-found: error
          retention-days: 7

  merge:
    name: attest and publish exact ${{ matrix.image }} manifest
    needs:
      - validate
      - build
      - binary-archives
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.validate.outputs.release_images) }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install exact release verification tools
        run: |
          scripts/install-release-gh.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and inspect exact image tags
        id: evidence
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ matrix.image }}
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/${IMAGE_NAME}"
          digest_directory="/tmp/digests/${IMAGE_NAME}"
          amd64_build_digest="sha256:$(basename "${digest_directory}"/amd64-* | sed 's/^amd64-//')"
          arm64_build_digest="sha256:$(basename "${digest_directory}"/arm64-* | sed 's/^arm64-//')"
          [[ "$amd64_build_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_build_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          existing_manifest="$(
            docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --raw 2>/dev/null \
              || true
          )"
          if [[ -n "$existing_manifest" ]]; then
            release_json="$(scripts/find-github-release.sh "$RELEASE_TAG")"
            if [[ -n "$release_json" ]]; then
              jq -e '.draft == true' <<< "$release_json" >/dev/null || {
                echo "an exact image tag may only be replaced before release publication" >&2
                exit 1
              }
            fi
          fi

          docker buildx imagetools create \
            -t "${image}:${RELEASE_TAG}" \
            -t "${image}:sha-${BUILD_GIT_COMMIT}" \
            "${image}@${amd64_build_digest}" \
            "${image}@${arm64_build_digest}"

          mkdir -p dist/image-evidence
          manifest_path="dist/image-evidence/${IMAGE_NAME}.manifest.json"
          scripts/resolve-release-image-manifest.sh \
            --image "$image" \
            --tag "$RELEASE_TAG" \
            --commit "$BUILD_GIT_COMMIT" \
            --amd64-build-digest "$amd64_build_digest" \
            --arm64-build-digest "$arm64_build_digest" \
            --output "$manifest_path"
          root_digest="$(jq -r '.digest' "$manifest_path")"
          amd64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "$manifest_path")"
          arm64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "$manifest_path")"

          amd64_sbom="dist/image-evidence/${IMAGE_NAME}-linux-amd64.spdx.json"
          arm64_sbom="dist/image-evidence/${IMAGE_NAME}-linux-arm64.spdx.json"
          scripts/generate-release-sbom.sh \
            --image "$image" --tag "$RELEASE_TAG" --commit "$BUILD_GIT_COMMIT" \
            --architecture amd64 --digest "$amd64_digest" --output "$amd64_sbom"
          scripts/generate-release-sbom.sh \
            --image "$image" --tag "$RELEASE_TAG" --commit "$BUILD_GIT_COMMIT" \
            --architecture arm64 --digest "$arm64_digest" --output "$arm64_sbom"
          scripts/check-release-image-evidence.sh "$manifest_path" \
            --image "$image" --tag "$RELEASE_TAG" --commit "$BUILD_GIT_COMMIT" \
            --root-digest "$root_digest" \
            --amd64-digest "$amd64_digest" --arm64-digest "$arm64_digest" \
            --amd64-sbom "$amd64_sbom" --arm64-sbom "$arm64_sbom"

          {
            printf 'image=%s\n' "$image"
            printf 'root_digest=%s\n' "$root_digest"
            printf 'amd64_digest=%s\n' "$amd64_digest"
            printf 'arm64_digest=%s\n' "$arm64_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Attest amd64 image SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.evidence.outputs.image }}
          subject-digest: ${{ steps.evidence.outputs.amd64_digest }}
          sbom-path: dist/image-evidence/${{ matrix.image }}-linux-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 image SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.evidence.outputs.image }}
          subject-digest: ${{ steps.evidence.outputs.arm64_digest }}
          sbom-path: dist/image-evidence/${{ matrix.image }}-linux-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest multi-platform image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.evidence.outputs.image }}
          subject-digest: ${{ steps.evidence.outputs.root_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the multi-platform image
        env:
          IMAGE: ${{ steps.evidence.outputs.image }}
          ROOT_DIGEST: ${{ steps.evidence.outputs.root_digest }}
        run: cosign sign --yes "${IMAGE}@${ROOT_DIGEST}"

      - name: Verify image signature and attestations
        env:
          AMD64_DIGEST: ${{ steps.evidence.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.evidence.outputs.arm64_digest }}
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.evidence.outputs.image }}
          RELEASE_TAG: ${{ github.ref_name }}
          ROOT_DIGEST: ${{ steps.evidence.outputs.root_digest }}
        run: |
          set -euo pipefail

          scripts/verify-release-image-attestations.sh \
            --image "$IMAGE" \
            --root-digest "$ROOT_DIGEST" \
            --amd64-digest "$AMD64_DIGEST" \
            --arm64-digest "$ARM64_DIGEST" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --tag "$RELEASE_TAG" \
            --commit "$BUILD_GIT_COMMIT"

  assemble-and-sign:
    name: assemble and sign release assets
    needs:
      - validate
      - api-docs
      - collect-binary-assets
      - merge
    permissions:
      attestations: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download API artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-api-docs
          path: dist/release-assets

      - name: Download binary release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binary-assets
          path: dist/release-assets

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install exact release verification tools
        run: |
          scripts/install-release-gh.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Verify attestations and assemble the exact catalog
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          expected="$({
            printf '%s\n' \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.tar.gz" \
              "zinder-api-docs-${RELEASE_TAG}.tar.gz" \
              "zinder.v1.descriptor.bin"
          })"
          actual="$(find dist/release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "release asset candidates differ from the exact catalog" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }

          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          common_attestation_args=(
            --repo "$GITHUB_REPOSITORY"
            --cert-identity "$certificate_identity"
            --deny-self-hosted-runners
            --signer-digest "$BUILD_GIT_COMMIT"
            --source-ref "refs/tags/${RELEASE_TAG}"
            --source-digest "$BUILD_GIT_COMMIT"
          )
          for platform in aarch64-unknown-linux-gnu x86_64-v3-unknown-linux-gnu; do
            archive="dist/release-assets/zinder-${RELEASE_VERSION}-${platform}.tar.gz"
            sbom="dist/release-assets/zinder-${RELEASE_VERSION}-${platform}.spdx.json"
            scripts/check-release-sbom.sh "$sbom" \
              --archive "$archive" \
              --version "$RELEASE_VERSION" \
              --platform "$platform" \
              --commit "$BUILD_GIT_COMMIT"
            gh attestation verify "$archive" "${common_attestation_args[@]}"
            gh attestation verify "$archive" \
              "${common_attestation_args[@]}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

          (
            cd dist/release-assets
            sha256sum \
              zinder-*.tar.gz \
              zinder-*.spdx.json \
              zinder.v1.descriptor.bin \
              | sort -k2 > SHA256SUMS
          )
          cosign sign-blob --yes \
            --bundle dist/release-assets/SHA256SUMS.sigstore.json \
            dist/release-assets/SHA256SUMS
          cosign verify-blob \
            --bundle dist/release-assets/SHA256SUMS.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-assets/SHA256SUMS

      - name: Upload final release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-final
          path: dist/release-assets
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: prepare draft GitHub Release
    needs:
      - validate
      - assemble-and-sign
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Download final release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-final
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: release-notes

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json="$(scripts/find-github-release.sh "$RELEASE_TAG")"
          if [[ -n "$release_json" ]]; then
            jq -e '.draft == true' <<< "$release_json" >/dev/null || {
              echo "published GitHub Release ${RELEASE_TAG} already exists" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" \
              --notes-file release-notes/release-notes.md
            expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
            while IFS= read -r existing_asset; do
              if ! grep -Fxq "$existing_asset" <<< "$expected_assets"; then
                gh release delete-asset "$RELEASE_TAG" "$existing_asset" --yes
              fi
            done < <(jq -r '.assets[].name' <<< "$release_json")
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_args=(
              release create "$RELEASE_TAG" dist/*
              --verify-tag
              --draft
              --notes-file release-notes/release-notes.md
              --latest=false
            )
            if [[ "$RELEASE_STABLE" != true ]]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

  publish-release:
    name: publish GitHub Release
    needs:
      - validate
      - prepare-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          publish_args=(release edit "$RELEASE_TAG" --draft=false)
          if [[ "$RELEASE_STABLE" == true ]]; then
            publish_args+=(--latest)
          else
            publish_args+=(--prerelease --latest=false)
          fi
          gh "${publish_args[@]}"

  verify-release:
    name: verify immutable GitHub Release
    needs:
      - validate
      - assemble-and-sign
      - publish-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download final release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-final
          path: dist

      - name: Install exact release verification tools
        run: |
          scripts/install-release-gh.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Verify immutable release and every asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json=""
          for attempt in $(seq 1 12); do
            release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isImmutable,assets)"
            if jq -e '.isDraft == false and .isImmutable == true' <<< "$release_json" >/dev/null \
              && gh release verify "$RELEASE_TAG"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "immutable release verification did not converge" >&2
              exit 1
            fi
            sleep 10
          done
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson expected_count "$(find dist -maxdepth 1 -type f | wc -l)" '
              .tagName == $tag
              and .isDraft == false
              and .isImmutable == true
              and (.assets | length) == $expected_count
            ' <<< "$release_json" >/dev/null
          expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual_assets="$(jq -r '.assets[].name' <<< "$release_json" | sort)"
          [[ "$actual_assets" == "$expected_assets" ]]

          while IFS= read -r asset; do
            gh release verify-asset "$RELEASE_TAG" "$asset"
          done < <(find dist -maxdepth 1 -type f | sort)

  promote-latest:
    name: promote stable image tags
    if: needs.validate.outputs.stable == 'true'
    needs:
      - validate
      - verify-release
    permissions:
      attestations: read
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install exact release verification tools
        run: |
          scripts/install-release-gh.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact manifests and promote latest
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"

          while IFS= read -r image_name; do
            image="ghcr.io/${owner_lc}/${image_name}"
            exact_digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
            commit_digest="$(docker buildx imagetools inspect "${image}:sha-${BUILD_GIT_COMMIT}" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "$exact_digest" =~ ^sha256:[0-9a-f]{64}$ && "$exact_digest" == "$commit_digest" ]]
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image}@${exact_digest}"
            gh attestation verify "oci://${image}@${exact_digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$certificate_identity" \
              --deny-self-hosted-runners \
              --signer-digest "$BUILD_GIT_COMMIT" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "$BUILD_GIT_COMMIT"
          done <<< "$image_names"
          while IFS= read -r image_name; do
            image="ghcr.io/${owner_lc}/${image_name}"
            exact_digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}@${exact_digest}"
            latest_digest="$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "$latest_digest" == "$exact_digest" ]]
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image}@${latest_digest}"
          done <<< "$image_names"
