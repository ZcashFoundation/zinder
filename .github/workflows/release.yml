name: release

# A release tag names the product version already present in Cargo metadata.
# Credential-free jobs start as soon as the tag validates: API artifacts, SDK
# readiness, and two independent uncached binary builds per platform. The
# reproduction also packages every release image from its archive without
# pushing. The protected release environment is requested only after both
# builds of every platform match byte for byte. Its one review gates crate
# publication, the first credentialed job, and every job that receives an OIDC
# token or writes to a registry depends on it. Images package the proven
# archive binaries without compiling again. Exact image tags and API assets are
# prepared before the GitHub Release is published, and stable `latest` image
# tags move only after every required artifact succeeds.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  BUF_VERSION: "1.75.0"
  PROTOC_VERSION: "36.2"
  RELEASE_IMAGES_FILE: deploy/release-images.json

jobs:
  validate:
    name: validate release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_commit: ${{ steps.identity.outputs.base_commit }}
      commit: ${{ steps.identity.outputs.commit }}
      release_images: ${{ steps.images.outputs.release_images }}
      stable: ${{ steps.identity.outputs.stable }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Changie
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: v1.26.0

      - name: Verify tag, version, and main ancestry
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bash scripts/validate-release-tag.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          release_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "release tag target is not reachable from main" >&2
            exit 1
          }
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          previous_tag="$(
            git describe \
              --first-parent \
              --tags \
              --abbrev=0 \
              --match 'v[0-9]*' \
              "${release_commit}^"
          )"
          previous_version="${previous_tag#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          [[ "$previous_tag" == v* && "$previous_version" =~ $semver_pattern ]] || {
            echo "preceding product tag is not complete SemVer: ${previous_tag}" >&2
            exit 1
          }
          prerelease="${BASH_REMATCH[5]:-}"
          IFS=. read -r -a prerelease_identifiers <<< "$prerelease"
          for identifier in "${prerelease_identifiers[@]}"; do
            [[ ! "$identifier" =~ ^0[0-9]+$ ]] || {
              echo "preceding product tag has a numeric prerelease identifier with a leading zero" >&2
              exit 1
            }
          done
          previous_commit="$(git rev-parse "${previous_tag}^{commit}")"
          printf 'base_commit=%s\n' "$previous_commit" >> "$GITHUB_OUTPUT"

      - name: Require an unpublished tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json="$(scripts/find-github-release.sh "$RELEASE_TAG")"
          if [[ -n "$release_json" ]]; then
            jq -e '.draft == true' <<< "$release_json" >/dev/null || {
              echo "published GitHub Release ${RELEASE_TAG} already exists" >&2
              exit 1
            }
          fi

      - name: Verify and extract release changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          bash scripts/validate-changelog.sh release "$RELEASE_TAG"
          bash scripts/extract-release-notes.sh "$RELEASE_TAG" \
            > dist/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Verify release topology
        run: bash scripts/test-deployment-admission.sh

      - name: Resolve release images
        id: images
        run: printf 'release_images=%s\n' "$(jq -c '.' "$RELEASE_IMAGES_FILE")" >> "$GITHUB_OUTPUT"

  api-docs:
    name: build API release artifacts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Generate and verify API artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          scripts/generate-api-artifacts.sh "$RELEASE_TAG"
          scripts/check-api-artifact.sh "dist/zinder-api-docs-${RELEASE_TAG}.tar.gz"

      - name: Upload API artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-api-docs
          path: |
            dist/zinder.v1.descriptor.bin
            dist/zinder-api-docs-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sdk-packages:
    name: verify public SDK packages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust 1.100
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0

      - name: Verify public SDK packages
        id: package-readiness
        continue-on-error: true
        env:
          PROTOC: /does/not/exist
        run: scripts/verify-sdk-packages.sh

      - name: Check desired SDK release state
        id: cargo-release
        continue-on-error: true
        uses: ZcashFoundation/cargo-release@f212e2569995d569baeb6cdeb7ed99b7602303a4 # v0.1.1
        with:
          phase: check
          base-sha: ${{ needs.validate.outputs.base_commit }}
          target-sha: ${{ needs.validate.outputs.commit }}
          github-token: ${{ github.token }}
        env:
          CARGO_INCREMENTAL: "0"
          PROTOC: /does/not/exist

      - name: Summarize SDK release readiness
        if: always()
        env:
          CARGO_RELEASE_RESULT: ${{ steps.cargo-release.outcome }}
          PACKAGE_RESULT: ${{ steps.package-readiness.outcome }}
          PLAN: ${{ steps.cargo-release.outputs.plan }}
          REPORT: ${{ steps.cargo-release.outputs.report }}
        run: |
          {
            echo "## SDK release readiness"
            echo "| Validation | Result |"
            echo "| --- | --- |"
            echo "| Hermetic packages | \`${PACKAGE_RESULT}\` |"
            echo "| Cargo Release | \`${CARGO_RELEASE_RESULT}\` |"
            if [[ -n "${PLAN}" ]]; then
              echo "### Plan"
              echo '```json'
              jq . <<< "${PLAN}"
              echo '```'
            fi
            if [[ -n "${REPORT}" ]]; then
              echo "### Observed state"
              echo '```json'
              jq . <<< "${REPORT}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful SDK release readiness
        if: always()
        env:
          CARGO_RELEASE_RESULT: ${{ steps.cargo-release.outcome }}
          PACKAGE_RESULT: ${{ steps.package-readiness.outcome }}
        run: |
          if [[ "$PACKAGE_RESULT" != success || "$CARGO_RELEASE_RESULT" != success ]]; then
            echo "::error::Review each failed SDK readiness step and the job summary."
            exit 1
          fi

  compile:
    name: compile release binaries (${{ matrix.platform.name }})
    needs: validate
    permissions:
      contents: read
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64-v3-unknown-linux-gnu
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            jemalloc_page_size: 4096
          - name: x86_64-unknown-linux-gnu
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            jemalloc_page_size: 4096
            cpu_baseline: x86-64
            pasta_asm: '0'
          - name: aarch64-unknown-linux-gnu
            docker: linux/arm64
            rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            jemalloc_page_size: 65536
          - name: aarch64-apple-darwin
            rust: aarch64-apple-darwin
            runner: macos-15
    env:
      PLATFORM_NAME: ${{ matrix.platform.name }}
      CPU_BASELINE: ${{ matrix.platform.cpu_baseline }}
      PASTA_ASM: ${{ matrix.platform.pasta_asm || '1' }}
      JEMALLOC_PAGE_SIZE: ${{ matrix.platform.jemalloc_page_size }}
      RELEASE_CACHE_SCOPE: release-${{ needs.validate.outputs.commit }}-${{ matrix.platform.name }}-1
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.platform.rust }}
      TARGET_PLATFORM: ${{ matrix.platform.docker }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Build native Apple Silicon binary
        if: runner.os == 'macOS'
        uses: ./.github/actions/build-macos-release-binary
        with:
          commit: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Build and verify the binary archive
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          export_root="${RUNNER_TEMP}/binary-export"
          archive_root="${RUNNER_TEMP}/binary-archive"
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker buildx build \
              --no-cache \
              --platform "$TARGET_PLATFORM" \
              --target release-binaries \
              --build-arg "ZINDER_X86_64_CPU_BASELINE=${CPU_BASELINE:-x86-64-v3}" \
              --build-arg "ZINDER_PASTA_ASM=${PASTA_ASM}" \
              --build-arg "RELEASE_CACHE_SCOPE=${RELEASE_CACHE_SCOPE}" \
              --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${RELEASE_COMMIT}" \
              --output "type=local,dest=${export_root}" \
              --file deploy/Dockerfile \
              .
          fi
          scripts/build-release-binary-archive.sh \
            --binaries "${export_root}/bin" \
            --output "$archive_root" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "$RUST_TARGET" \
            --cpu-baseline "$CPU_BASELINE" \
            --pasta-asm "$PASTA_ASM" \
            --source-date-epoch "$source_date_epoch"
          archive_path="$(find "$archive_root" -maxdepth 1 -type f -name '*.tar.gz')"
          scripts/check-release-binary-archive.sh "$archive_path" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "$RUST_TARGET" \
            --cpu-baseline "$CPU_BASELINE" \
            --pasta-asm "$PASTA_ASM" \
            --source-date-epoch "$source_date_epoch"

          if [[ "$RUNNER_OS" == Linux ]]; then
            docker run --rm \
              --platform "$TARGET_PLATFORM" \
              --env JEMALLOC_PAGE_SIZE \
              --volume "${export_root}/bin:/opt/zinder/bin:ro" \
              debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818 \
              sh -ec '
                apt-get update >/dev/null
                apt-get install -y --no-install-recommends ca-certificates libstdc++6 >/dev/null
                for binary in /opt/zinder/bin/*; do
                  "$binary" --version
                  "$binary" --help >/dev/null
                  MALLOC_CONF=stats_print:true "$binary" --version 2>&1 >/dev/null \
                    | grep -Fqx "Page size: ${JEMALLOC_PAGE_SIZE}" \
                    || { echo "$binary: jemalloc page size is not ${JEMALLOC_PAGE_SIZE}" >&2; exit 1; }
                done
              '
          fi

          candidate_root="${RUNNER_TEMP}/release-candidate"
          mkdir -p "$candidate_root"
          cp "$archive_path" "$candidate_root/"
          (cd "${export_root}/bin" && sha256sum -- * | sort -k2) \
            > "${candidate_root}/binaries.sha256"

          sbom_path="${candidate_root}/zinder-${RELEASE_VERSION}-${{ matrix.platform.name }}.spdx.json"
          scripts/generate-release-sbom.sh \
            --archive "${candidate_root}/$(basename -- "$archive_path")" \
            --output "$sbom_path" \
            --version "$RELEASE_VERSION" \
            --platform "${{ matrix.platform.name }}" \
            --commit "$RELEASE_COMMIT"
          scripts/check-release-sbom.sh "$sbom_path" \
            --archive "${candidate_root}/$(basename -- "$archive_path")" \
            --version "$RELEASE_VERSION" \
            --platform "${{ matrix.platform.name }}" \
            --commit "$RELEASE_COMMIT"

      - name: Upload binary archive candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 7

  reproduce:
    name: reproduce release binaries (${{ matrix.platform.name }})
    needs: validate
    permissions:
      contents: read
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64-v3-unknown-linux-gnu
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: x86_64-unknown-linux-gnu
            docker: linux/amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            jemalloc_page_size: 4096
            cpu_baseline: x86-64
            pasta_asm: '0'
          - name: aarch64-unknown-linux-gnu
            docker: linux/arm64
            rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - name: aarch64-apple-darwin
            rust: aarch64-apple-darwin
            runner: macos-15
    env:
      CPU_BASELINE: ${{ matrix.platform.cpu_baseline }}
      PASTA_ASM: ${{ matrix.platform.pasta_asm || '1' }}
      PLATFORM_NAME: ${{ matrix.platform.name }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.platform.rust }}
      TARGET_PLATFORM: ${{ matrix.platform.docker }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Build native Apple Silicon binary
        if: runner.os == 'macOS'
        uses: ./.github/actions/build-macos-release-binary
        with:
          commit: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the independent reproduction archive
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          export_root="${RUNNER_TEMP}/binary-export"
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker buildx build \
              --no-cache \
              --platform "$TARGET_PLATFORM" \
              --target release-binaries \
              --build-arg "ZINDER_X86_64_CPU_BASELINE=${CPU_BASELINE:-x86-64-v3}" \
              --build-arg "ZINDER_PASTA_ASM=${PASTA_ASM}" \
              --build-arg "RELEASE_CACHE_SCOPE=release-${RELEASE_COMMIT}-${PLATFORM_NAME}-2" \
              --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
              --build-arg "ZINDER_BUILD_GIT_COMMIT=${RELEASE_COMMIT}" \
              --output "type=local,dest=${export_root}" \
              --file deploy/Dockerfile \
              .
          fi
          scripts/build-release-binary-archive.sh \
            --binaries "${export_root}/bin" \
            --output dist/reproduction \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "$RUST_TARGET" \
            --cpu-baseline "$CPU_BASELINE" \
            --pasta-asm "$PASTA_ASM" \
            --source-date-epoch "$source_date_epoch"
          archive_path="$(find dist/reproduction -maxdepth 1 -type f -name '*.tar.gz')"
          scripts/check-release-binary-archive.sh "$archive_path" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "$RUST_TARGET" \
            --cpu-baseline "$CPU_BASELINE" \
            --pasta-asm "$PASTA_ASM" \
            --source-date-epoch "$source_date_epoch"
          (cd "${export_root}/bin" && sha256sum -- * | sort -k2) \
            > dist/reproduction/binaries.sha256

      # compare-binaries proves this archive identical to the one the images
      # job packages after approval, so this no-push run of the same packaging
      # catches an image defect before approval and before any crate publishes.
      - name: Package every release image without pushing
        if: matrix.platform.name == 'x86_64-v3-unknown-linux-gnu' || matrix.platform.name == 'aarch64-unknown-linux-gnu'
        env:
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          scripts/package-release-images.sh check \
            --archive "dist/reproduction/zinder-${RELEASE_VERSION}-${PLATFORM_NAME}.tar.gz" \
            --binary-hashes dist/reproduction/binaries.sha256 \
            --images-json "$RELEASE_IMAGES_JSON" \
            --platform "$TARGET_PLATFORM" \
            --source-date-epoch "$source_date_epoch" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"

      - name: Upload reproduction archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reproduction-${{ matrix.platform.name }}
          path: dist/reproduction
          if-no-files-found: error
          retention-days: 1

  compare-binaries:
    name: compare independent release builds (${{ matrix.platform }})
    needs:
      - validate
      - compile
      - reproduce
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-v3-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
    steps:
      - name: Download binary archive candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-${{ matrix.platform }}
          path: dist/build

      - name: Download reproduction archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-reproduction-${{ matrix.platform }}
          path: dist/reproduction

      - name: Require identical independent builds
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          archive_name="zinder-${RELEASE_VERSION}-${{ matrix.platform }}.tar.gz"
          [[ -s dist/build/binaries.sha256 ]]
          diff -u dist/build/binaries.sha256 dist/reproduction/binaries.sha256
          cmp -- "dist/build/${archive_name}" "dist/reproduction/${archive_name}"

          {
            echo "### Identical ${{ matrix.platform }} builds"
            echo
            echo "\`${archive_name}\`: \`$(sha256sum -- "dist/build/${archive_name}" | awk '{print $1}')\`"
            echo
            echo '| Binary | SHA-256 |'
            echo '| --- | --- |'
            awk '{ printf "| `%s` | `%s` |\n", $2, $1 }' dist/build/binaries.sha256
          } >> "$GITHUB_STEP_SUMMARY"

  # Enable the wallet gate here after provisioning the pinned client bundle.
  # See scripts/release-wallet-roundtrip.md for the publication prerequisite.
  publish-sdk-crates:
    name: publish public SDK crates
    needs:
      - validate
      - api-docs
      - sdk-packages
      - compare-binaries
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust 1.100
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish and verify missing SDK crates
        uses: ZcashFoundation/cargo-release@f212e2569995d569baeb6cdeb7ed99b7602303a4 # v0.1.1
        with:
          phase: publish
          base-sha: ${{ needs.validate.outputs.base_commit }}
          target-sha: ${{ needs.validate.outputs.commit }}
          github-token: ${{ github.token }}
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          PROTOC: /does/not/exist

      - name: Verify the published SDK from crates.io
        timeout-minutes: 30
        env:
          SDK_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/verify-published-sdk.sh "$SDK_VERSION"

  images:
    name: package and push release images (${{ matrix.platform.name }})
    needs:
      - validate
      - compare-binaries
      - publish-sdk-crates
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64-v3-unknown-linux-gnu
            arch: amd64
            docker: linux/amd64
            runner: ubuntu-latest
          - name: aarch64-unknown-linux-gnu
            arch: arm64
            docker: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      PLATFORM_NAME: ${{ matrix.platform.name }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform.docker }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download proven binary archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/release-candidate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image target takes its binaries from the archive that
      # compare-binaries proved identical to the reproduction, so no image build
      # compiles, and each image is checked against those binaries before it is
      # pushed and its digest is recorded.
      - name: Build and push image digests
        env:
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          candidate_root="${RUNNER_TEMP}/release-candidate"
          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          scripts/package-release-images.sh push \
            --archive "${candidate_root}/zinder-${RELEASE_VERSION}-${PLATFORM_NAME}.tar.gz" \
            --binary-hashes "${candidate_root}/binaries.sha256" \
            --images-json "$RELEASE_IMAGES_JSON" \
            --platform "$TARGET_PLATFORM" \
            --source-date-epoch "$source_date_epoch" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --registry "ghcr.io/${owner_lc}" \
            --digests /tmp/digests

      - name: Upload image digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform.arch }}
          path: /tmp/digests/**
          if-no-files-found: error
          retention-days: 1

  binary-archives:
    name: attest binary archive (${{ matrix.platform }})
    needs:
      - validate
      - compare-binaries
      - publish-sdk-crates
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-v3-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
    steps:
      - name: Download binary archive candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-${{ matrix.platform }}
          path: dist/build

      - name: Select the proven archive and SBOM
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist/binary-archive
          cp "dist/build/zinder-${RELEASE_VERSION}-${{ matrix.platform }}.tar.gz" \
            "dist/build/zinder-${RELEASE_VERSION}-${{ matrix.platform }}.spdx.json" \
            dist/binary-archive/

      - name: Attest binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/binary-archive/*.tar.gz
          create-storage-record: false

      - name: Attest binary SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/binary-archive/*.tar.gz
          sbom-path: dist/binary-archive/zinder-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.spdx.json
          create-storage-record: false

      - name: Upload binary archive and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-${{ matrix.platform }}
          path: |
            dist/binary-archive/*.tar.gz
            dist/binary-archive/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  collect-binary-assets:
    name: collect binary release assets
    needs:
      - validate
      - binary-archives
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/binaries
          pattern: release-binary-*
          merge-multiple: true

      - name: Verify binary asset catalog
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          expected="$({
            printf '%s\n' \
              "zinder-${RELEASE_VERSION}-aarch64-apple-darwin.spdx.json" \
              "zinder-${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz" \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
              "zinder-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.tar.gz"
          })"
          actual="$(find dist/binaries -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]]

      - name: Upload binary release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-assets
          path: dist/binaries
          if-no-files-found: error
          retention-days: 7

  merge:
    name: attest and publish exact ${{ matrix.image }} manifest
    needs:
      - validate
      - images
      - binary-archives
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verified_zinder_image_digest: ${{ steps.verified-image.outputs.zinder_image_digest }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.validate.outputs.release_images) }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install exact release verification tools
        run: |
          scripts/install-release-gh.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and inspect exact image tags
        id: evidence
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ matrix.image }}
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/${IMAGE_NAME}"
          digest_directory="/tmp/digests/${IMAGE_NAME}"
          amd64_build_digest="sha256:$(basename "${digest_directory}"/amd64-* | sed 's/^amd64-//')"
          arm64_build_digest="sha256:$(basename "${digest_directory}"/arm64-* | sed 's/^arm64-//')"
          [[ "$amd64_build_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_build_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          existing_manifest="$(
            docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --raw 2>/dev/null \
              || true
          )"
          if [[ -n "$existing_manifest" ]]; then
            release_json="$(scripts/find-github-release.sh "$RELEASE_TAG")"
            if [[ -n "$release_json" ]]; then
              jq -e '.draft == true' <<< "$release_json" >/dev/null || {
                echo "an exact image tag may only be replaced before release publication" >&2
                exit 1
              }
            fi
          fi

          docker buildx imagetools create \
            -t "${image}:${RELEASE_TAG}" \
            -t "${image}:sha-${BUILD_GIT_COMMIT}" \
            "${image}@${amd64_build_digest}" \
            "${image}@${arm64_build_digest}"

          mkdir -p dist/image-evidence
          manifest_path="dist/image-evidence/${IMAGE_NAME}.manifest.json"
          scripts/resolve-release-image-manifest.sh \
            --image "$image" \
            --tag "$RELEASE_TAG" \
            --commit "$BUILD_GIT_COMMIT" \
            --amd64-build-digest "$amd64_build_digest" \
            --arm64-build-digest "$arm64_build_digest" \
            --output "$manifest_path"
          root_digest="$(jq -r '.digest' "$manifest_path")"
          amd64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "$manifest_path")"
          arm64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "$manifest_path")"

          amd64_sbom="dist/image-evidence/${IMAGE_NAME}-linux-amd64.spdx.json"
          arm64_sbom="dist/image-evidence/${IMAGE_NAME}-linux-arm64.spdx.json"
          scripts/generate-release-sbom.sh \
            --image "$image" --tag "$RELEASE_TAG" --commit "$BUILD_GIT_COMMIT" \
            --architecture amd64 --digest "$amd64_digest" --output "$amd64_sbom"
          scripts/generate-release-sbom.sh \
            --image "$image" --tag "$RELEASE_TAG" --commit "$BUILD_GIT_COMMIT" \
            --architecture arm64 --digest "$arm64_digest" --output "$arm64_sbom"
          scripts/check-release-image-evidence.sh "$manifest_path" \
            --image "$image" --tag "$RELEASE_TAG" --commit "$BUILD_GIT_COMMIT" \
            --root-digest "$root_digest" \
            --amd64-digest "$amd64_digest" --arm64-digest "$arm64_digest" \
            --amd64-sbom "$amd64_sbom" --arm64-sbom "$arm64_sbom"

          {
            printf 'image=%s\n' "$image"
            printf 'root_digest=%s\n' "$root_digest"
            printf 'amd64_digest=%s\n' "$amd64_digest"
            printf 'arm64_digest=%s\n' "$arm64_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Attest amd64 image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.evidence.outputs.image }}
          subject-digest: ${{ steps.evidence.outputs.amd64_digest }}
          sbom-path: dist/image-evidence/${{ matrix.image }}-linux-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.evidence.outputs.image }}
          subject-digest: ${{ steps.evidence.outputs.arm64_digest }}
          sbom-path: dist/image-evidence/${{ matrix.image }}-linux-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest multi-platform image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.evidence.outputs.image }}
          subject-digest: ${{ steps.evidence.outputs.root_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the multi-platform image
        env:
          IMAGE: ${{ steps.evidence.outputs.image }}
          ROOT_DIGEST: ${{ steps.evidence.outputs.root_digest }}
        run: cosign sign --yes "${IMAGE}@${ROOT_DIGEST}"

      - name: Verify image signature and attestations
        id: verified-image
        env:
          AMD64_DIGEST: ${{ steps.evidence.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.evidence.outputs.arm64_digest }}
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.evidence.outputs.image }}
          RELEASE_TAG: ${{ github.ref_name }}
          ROOT_DIGEST: ${{ steps.evidence.outputs.root_digest }}
        run: |
          set -euo pipefail

          scripts/verify-release-image-attestations.sh \
            --image "$IMAGE" \
            --root-digest "$ROOT_DIGEST" \
            --amd64-digest "$AMD64_DIGEST" \
            --arm64-digest "$ARM64_DIGEST" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --tag "$RELEASE_TAG" \
            --commit "$BUILD_GIT_COMMIT"
          if [[ "$IMAGE" == */zinder ]]; then
            printf 'zinder_image_digest=%s\n' "$ROOT_DIGEST" >> "$GITHUB_OUTPUT"
          fi

  assemble-and-sign:
    name: assemble and sign release assets
    needs:
      - validate
      - api-docs
      - collect-binary-assets
      - merge
    permissions:
      attestations: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download API artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-api-docs
          path: dist/release-assets

      - name: Download binary release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binary-assets
          path: dist/release-assets

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install exact release verification tools
        run: |
          scripts/install-release-gh.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Verify attestations and assemble the exact catalog
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ZINDER_IMAGE_DIGEST: ${{ needs.merge.outputs.verified_zinder_image_digest }}
        run: |
          set -euo pipefail

          expected="$({
            printf '%s\n' \
              "zinder-${RELEASE_VERSION}-aarch64-apple-darwin.spdx.json" \
              "zinder-${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz" \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
              "zinder-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.spdx.json" \
              "zinder-${RELEASE_VERSION}-x86_64-v3-unknown-linux-gnu.tar.gz" \
              "zinder-api-docs-${RELEASE_TAG}.tar.gz" \
              "zinder-personal-compose.yaml" \
              "zinder.v1.descriptor.bin"
          })"
          scripts/render-personal-compose.sh "$ZINDER_IMAGE_DIGEST" \
            > dist/release-assets/zinder-personal-compose.yaml
          actual="$(find dist/release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "release asset candidates differ from the exact catalog" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }

          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          common_attestation_args=(
            --repo "$GITHUB_REPOSITORY"
            --cert-identity "$certificate_identity"
            --deny-self-hosted-runners
            --signer-digest "$BUILD_GIT_COMMIT"
            --source-ref "refs/tags/${RELEASE_TAG}"
            --source-digest "$BUILD_GIT_COMMIT"
          )
          for platform in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu x86_64-v3-unknown-linux-gnu; do
            archive="dist/release-assets/zinder-${RELEASE_VERSION}-${platform}.tar.gz"
            sbom="dist/release-assets/zinder-${RELEASE_VERSION}-${platform}.spdx.json"
            scripts/check-release-sbom.sh "$sbom" \
              --archive "$archive" \
              --version "$RELEASE_VERSION" \
              --platform "$platform" \
              --commit "$BUILD_GIT_COMMIT"
            gh attestation verify "$archive" "${common_attestation_args[@]}"
            gh attestation verify "$archive" \
              "${common_attestation_args[@]}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

          (
            cd dist/release-assets
            sha256sum \
              zinder-*.tar.gz \
              zinder-*.spdx.json \
              zinder-personal-compose.yaml \
              zinder.v1.descriptor.bin \
              | sort -k2 > SHA256SUMS
          )
          cosign sign-blob --yes \
            --bundle dist/release-assets/SHA256SUMS.sigstore.json \
            dist/release-assets/SHA256SUMS
          cosign verify-blob \
            --bundle dist/release-assets/SHA256SUMS.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-assets/SHA256SUMS

      - name: Upload final release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-final
          path: dist/release-assets
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: prepare draft GitHub Release
    needs:
      - validate
      - assemble-and-sign
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Download final release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-final
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json="$(scripts/find-github-release.sh "$RELEASE_TAG")"
          if [[ -n "$release_json" ]]; then
            jq -e '.draft == true' <<< "$release_json" >/dev/null || {
              echo "published GitHub Release ${RELEASE_TAG} already exists" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" \
              --notes-file release-notes/release-notes.md
            expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
            while IFS= read -r existing_asset; do
              if ! grep -Fxq "$existing_asset" <<< "$expected_assets"; then
                gh release delete-asset "$RELEASE_TAG" "$existing_asset" --yes
              fi
            done < <(jq -r '.assets[].name' <<< "$release_json")
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            release_args=(
              release create "$RELEASE_TAG" dist/*
              --verify-tag
              --draft
              --notes-file release-notes/release-notes.md
              --latest=false
            )
            if [[ "$RELEASE_STABLE" != true ]]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

  publish-release:
    name: publish GitHub Release
    needs:
      - validate
      - prepare-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_STABLE: ${{ needs.validate.outputs.stable }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          publish_args=(release edit "$RELEASE_TAG" --draft=false)
          if [[ "$RELEASE_STABLE" == true ]]; then
            publish_args+=(--latest)
          else
            publish_args+=(--prerelease --latest=false)
          fi
          gh "${publish_args[@]}"

  verify-release:
    name: verify immutable GitHub Release
    needs:
      - validate
      - assemble-and-sign
      - publish-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download final release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-final
          path: dist

      - name: Install exact release verification tools
        run: |
          scripts/install-release-gh.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Verify immutable release and every asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_json=""
          for attempt in $(seq 1 12); do
            release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isImmutable,assets)"
            if jq -e '.isDraft == false and .isImmutable == true' <<< "$release_json" >/dev/null \
              && gh release verify "$RELEASE_TAG"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "immutable release verification did not converge" >&2
              exit 1
            fi
            sleep 10
          done
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson expected_count "$(find dist -maxdepth 1 -type f | wc -l)" '
              .tagName == $tag
              and .isDraft == false
              and .isImmutable == true
              and (.assets | length) == $expected_count
            ' <<< "$release_json" >/dev/null
          expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' <<< "$release_json" | sort)"
          [[ "$actual_assets" == "$expected_assets" ]]

          while IFS= read -r asset; do
            gh release verify-asset "$RELEASE_TAG" "$asset"
          done < <(find dist -maxdepth 1 -type f | sort)

  promote-latest:
    name: promote stable image tags
    if: needs.validate.outputs.stable == 'true'
    needs:
      - validate
      - verify-release
    permissions:
      attestations: read
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install exact release verification tools
        run: |
          scripts/install-release-gh.sh "$RUNNER_TEMP/release-tools"
          printf '%s\n' "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact manifests and promote latest
        env:
          BUILD_GIT_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          OWNER_RAW: ${{ github.repository_owner }}
          RELEASE_IMAGES_JSON: ${{ needs.validate.outputs.release_images }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          image_names="$(jq -r '.[]' <<< "$RELEASE_IMAGES_JSON")"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"

          while IFS= read -r image_name; do
            image="ghcr.io/${owner_lc}/${image_name}"
            exact_digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
            commit_digest="$(docker buildx imagetools inspect "${image}:sha-${BUILD_GIT_COMMIT}" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "$exact_digest" =~ ^sha256:[0-9a-f]{64}$ && "$exact_digest" == "$commit_digest" ]]
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image}@${exact_digest}"
            gh attestation verify "oci://${image}@${exact_digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$certificate_identity" \
              --deny-self-hosted-runners \
              --signer-digest "$BUILD_GIT_COMMIT" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "$BUILD_GIT_COMMIT"
          done <<< "$image_names"
          while IFS= read -r image_name; do
            image="ghcr.io/${owner_lc}/${image_name}"
            exact_digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}@${exact_digest}"
            latest_digest="$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "$latest_digest" == "$exact_digest" ]]
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image}@${latest_digest}"
          done <<< "$image_names"
