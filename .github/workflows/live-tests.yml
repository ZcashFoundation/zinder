name: live-tests

# T3 (live) tests under tests/live/, double-gated by #[ignore] and
# require_live():
#   - regtest runs nightly against a Dockerized Zebra 7.0.0 Regtest node that
#     activates every upgrade through NU7 (deploy/zebra/regtest.toml)
#   - testnet runs weekly against a hosted testnet node
#   - mainnet is workflow_dispatch-only until runner topology and trigger
#     ownership are settled.
# CI secrets mirror the env-var schema: NODE_<NETWORK>_JSON_RPC_ADDR etc.

on:
  schedule:
    # Nightly regtest at 02:17 UTC.
    - cron: "17 2 * * *"
    # Weekly testnet on Mondays at 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      network:
        description: "Network to test against"
        required: true
        default: zcash-regtest
        type: choice
        options:
          - zcash-regtest
          - zcash-testnet
          - zcash-mainnet

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NEXTEST_VERSION: "0.9.116"
  PROTOC: /does/not/exist

jobs:
  regtest:
    name: live regtest
    if: |
      github.event_name == 'workflow_dispatch' && inputs.network == 'zcash-regtest'
        || (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version "${CARGO_NEXTEST_VERSION}"

      # Zebra runs as a step rather than a service container because its
      # Regtest activation heights and funding streams come from a mounted
      # TOML file (deploy/zebra/regtest.toml), which a service container cannot
      # read before checkout. The image is pinned by digest to the current
      # upstream Zebra release; Zinder's dependency-alignment gate verifies
      # that its zebra-chain boundary uses the same Zcash protocol family.
      # Cookie auth is disabled to mirror Z3's regtest topology; tests below
      # send a no-op basic-auth pair that Zebra ignores in this mode. Coinbase
      # pays to the broadcast-cycle test key, so the spend, UTXO, and balance
      # live tests find outputs they control. Derive the address with
      # `cargo run -p zinder-testkit --example print_broadcast_test_address`.
      # The indexer gRPC port and the health check let the Zebra Indexer
      # mempool tests run, including the one that restarts this container.
      - name: Start Zebra on Regtest through NU7
        run: |
          docker run -d --name zebra-regtest \
            -p 127.0.0.1:39232:39232 -p 127.0.0.1:39155:8155 \
            --health-cmd "curl -s -o /dev/null http://127.0.0.1:39232" \
            --health-interval 5s --health-timeout 5s --health-retries 12 \
            -v "${GITHUB_WORKSPACE}/deploy/zebra/regtest.toml:/etc/zebrad/zebrad.toml:ro" \
            -e CONFIG_FILE_PATH=/etc/zebrad/zebrad.toml \
            -e ZEBRA_RPC__LISTEN_ADDR=0.0.0.0:39232 \
            -e ZEBRA_RPC__INDEXER_LISTEN_ADDR=0.0.0.0:8155 \
            -e ZEBRA_RPC__ENABLE_COOKIE_AUTH=false \
            -e ZEBRA_MINING__MINER_ADDRESS=tmDpFafuBHKGUYmuwLsrxWJrwcnSyzEEtYx \
            docker.io/zfnd/zebra:7.0.0@sha256:a70d2be8ffef3a4b6e37355724e36a0e6c1838e46baa28bfb216739f00cf2d34

      # Live tests need a chain tall enough to bulk-catch-up (>= 60 blocks), a
      # matured coinbase to spend, and a tip below NU7 (height 140) so the
      # activation test can broadcast on both sides of it.
      - name: Advance regtest chain to a testable height
        run: scripts/mine-live-regtest.sh http://127.0.0.1:39232 120

      # The activation test runs first and alone: it broadcasts below NU7,
      # mines across the activation, and broadcasts again after it, so it needs
      # the pre-NU7 tip that the rest of the suite would otherwise mine past.
      - name: Run the NU7 activation test against regtest
        env:
          ZINDER_TEST_LIVE: "1"
          ZINDER_NETWORK: zcash-regtest
          ZINDER_NODE__JSON_RPC_ADDR: ${{ secrets.NODE_REGTEST_JSON_RPC_ADDR || 'http://127.0.0.1:39232' }}
          ZINDER_NODE__AUTH__METHOD: ${{ secrets.NODE_REGTEST_AUTH_METHOD || 'basic' }}
          ZINDER_NODE__AUTH__USERNAME: ${{ secrets.NODE_REGTEST_AUTH_USERNAME || 'zebra' }}
          ZINDER_NODE__AUTH__PASSWORD: ${{ secrets.NODE_REGTEST_AUTH_PASSWORD || 'zebra' }}
        run: |
          cargo nextest run --workspace --profile=ci-live --run-ignored=all \
            -E 'test(/^live::nu7_activation::/)'

      - name: Run T3 live tests against regtest
        env:
          ZINDER_TEST_LIVE: "1"
          ZINDER_NETWORK: zcash-regtest
          ZINDER_NODE__JSON_RPC_ADDR: ${{ secrets.NODE_REGTEST_JSON_RPC_ADDR || 'http://127.0.0.1:39232' }}
          ZINDER_NODE__INDEXER_GRPC_ADDR: http://127.0.0.1:39155
          ZINDER_NODE__AUTH__METHOD: ${{ secrets.NODE_REGTEST_AUTH_METHOD || 'basic' }}
          ZINDER_NODE__AUTH__USERNAME: ${{ secrets.NODE_REGTEST_AUTH_USERNAME || 'zebra' }}
          ZINDER_NODE__AUTH__PASSWORD: ${{ secrets.NODE_REGTEST_AUTH_PASSWORD || 'zebra' }}
          ZINDER_TEST_INDEXER_CONTAINER_NAME: zebra-regtest
        # Run every live test except mainnet-only ones and the activation test
        # above. Regtest is the only network where deep_chain and latency fit
        # in CI budgets without checkpoint backfill. Mainnet-only tests are
        # excluded by explicit behavior name because live test names avoid
        # network labels unless the behavior itself is network-specific.
        run: |
          cargo nextest run --workspace --profile=ci-live --run-ignored=all \
            -E 'test(/^live::/) and not test(/^live::nu7_activation::/) and not test(mainnet) and not test(backfills_last_1000_blocks_from_checkpoint)'

      - name: Dump Zebra logs on failure
        if: failure()
        run: docker logs zebra-regtest 2>&1 | tail -n 100 || true

  testnet:
    name: live testnet
    if: |
      github.event_name == 'workflow_dispatch' && inputs.network == 'zcash-testnet'
        || (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version "${CARGO_NEXTEST_VERSION}"

      - name: Run T3 live tests against testnet
        env:
          ZINDER_TEST_LIVE: "1"
          ZINDER_NETWORK: zcash-testnet
          ZINDER_NODE__JSON_RPC_ADDR: ${{ secrets.NODE_TESTNET_JSON_RPC_ADDR }}
          ZINDER_NODE__AUTH__METHOD: ${{ secrets.NODE_TESTNET_AUTH_METHOD }}
          ZINDER_NODE__AUTH__USERNAME: ${{ secrets.NODE_TESTNET_AUTH_USERNAME }}
          ZINDER_NODE__AUTH__PASSWORD: ${{ secrets.NODE_TESTNET_AUTH_PASSWORD }}
        # Filter out tests scoped to other networks. Tests under deep_chain
        # and latency need checkpoint backfill before they fit in hosted-
        # network CI budgets. Network-constrained tests are excluded by
        # explicit behavior name because live test names avoid network labels
        # unless the behavior itself is network-specific.
        run: |
          cargo nextest run --workspace --profile=ci-live --run-ignored=all \
            -E 'test(/^live::/) and not test(_on_regtest) and not test(mainnet) and not test(backfills_from_checkpoint) and not test(backfills_last_1000_blocks_from_checkpoint) and not test(deep_chain) and not test(latency)'

  mainnet:
    name: live mainnet
    # T3 mainnet is workflow_dispatch-only until the runner topology, on-call,
    # and trigger model are answered. Tests that target mainnet must opt in via
    # require_live_for(&[Network::ZcashMainnet]) or require_live_mainnet().
    if: github.event_name == 'workflow_dispatch' && inputs.network == 'zcash-mainnet'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version "${CARGO_NEXTEST_VERSION}"

      - name: Run T3 live tests against mainnet
        env:
          ZINDER_TEST_LIVE: "1"
          ZINDER_NETWORK: zcash-mainnet
          ZINDER_NODE__JSON_RPC_ADDR: ${{ secrets.NODE_MAINNET_JSON_RPC_ADDR }}
          ZINDER_NODE__AUTH__METHOD: ${{ secrets.NODE_MAINNET_AUTH_METHOD }}
          ZINDER_NODE__AUTH__USERNAME: ${{ secrets.NODE_MAINNET_AUTH_USERNAME }}
          ZINDER_NODE__AUTH__PASSWORD: ${{ secrets.NODE_MAINNET_AUTH_PASSWORD }}
        # Mainnet runs only tests that explicitly opt in via
        # require_live_for(&[Network::ZcashMainnet]) or require_live_mainnet().
        # Keep this allowlist explicit because live test names avoid network
        # names unless the behavior itself is network-specific.
        run: |
          cargo nextest run --workspace --profile=ci-live --run-ignored=all \
            -E 'test(mainnet) or test(backfills_last_1000_blocks_from_checkpoint) or test(canonical_blocks_load_requested_range_from_fixed_checkpoint)'
