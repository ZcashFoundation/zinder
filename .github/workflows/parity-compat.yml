name: parity-compat

# T3 (live) fixed-fence parity diff between Zinder's `zinder-compat-lightwalletd`
# and the pinned upstream `electriccoinco/lightwalletd` Go reference, both
# pointed at the same pinned regtest node. One leg runs against Zebra 7.1.0 and
# one against Zakura 1.8.6; both legs must pass on a release commit. Each
# leg also compares the qualification build with ordinary wallet serving,
# including a signed spend and a node outage under both retention policies.
#
# Test sources: services/zinder-compat-lightwalletd/tests/live/parity_against_lightwalletd.rs

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
  pull_request:
    # Keep this list identical in live-tests.yml and parity-compat.yml. It
    # covers every crate the live and parity tests exercise, the workspace
    # manifest and lockfile that pin the consensus cohort, the node
    # configurations, the mining and indexer TLS scripts, the CBB report
    # validator, the CI tool installer and its lock (which pins cargo-nextest),
    # the shared Rust setup action, and both workflows.
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".config/nextest.toml"
      - "crates/**"
      - "services/zinder/**"
      - "services/zinder-bench/**"
      - "services/zinder-compat-cipherscan/**"
      - "services/zinder-compat-lightwalletd/**"
      - "services/zinder-explorer/**"
      - "services/zinder-ingest/**"
      - "services/zinder-projector/**"
      - "services/zinder-query/**"
      - "deploy/systemd/**"
      - "deploy/zakura/**"
      - "deploy/zebra/**"
      - "scripts/build-release-binary-archive.sh"
      - "scripts/release-binary-platform.sh"
      - "scripts/test-native-systemd-regtest.sh"
      - "scripts/mine-live-regtest.sh"
      - "scripts/test-light-wallet-qualification.sh"
      - "scripts/generate-live-indexer-tls.sh"
      - "scripts/validate-cbb-interop-report.sh"
      - "scripts/install-ci-tool.sh"
      - ".github/ci-tools.lock"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/live-tests.yml"
      - ".github/workflows/parity-compat.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Swatinem/rust-cache hashes every CARGO_* and RUST* variable into its key, so
# keep this block identical to the other Rust workflows.
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  PROTOC: /does/not/exist
  # The reference must parse the version-6 (NU6.3 and later) transactions that
  # every block from height 6 carries on the shared Regtest schedule in
  # deploy/zebra/regtest.toml and deploy/zakura/regtest.toml.
  REFERENCE_LIGHTWALLETD_IMAGE: docker.io/electriccoinco/lightwalletd:v0.6.3@sha256:40d72a159150e152e099f888c154077273babb21ade60b2281ab932b7d2c752e
  # Past NU7 (height 140), so the fixed fence covers blocks on both sides of
  # the activation.
  PARITY_REGTEST_TIP: "150"
  PARITY_TRANSPARENT_ADDRESS: tmDpFafuBHKGUYmuwLsrxWJrwcnSyzEEtYx
  # Not prefixed `ZINDER_`: the binaries reject unknown `ZINDER_*` env vars as
  # invalid config keys, so a `ZINDER_*` port knob would crash them at startup.
  REGTEST_NODE_RPC_URL: http://127.0.0.1:39232

jobs:
  # Compiles once for both node legs: the release binaries, the compat
  # acceptance tests as a nextest archive, and the pinned CBB client.
  build-parity:
    name: build parity binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job builds the release profile as well as the test profile, so it
      # keeps its own cache, saved only from the default branch.
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: parity
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          tools: cargo-nextest

      - name: Build Zinder binaries
        run: cargo build --locked --release -p zinder-ingest -p zinder-compat-lightwalletd -p zinder-bench

      - name: Archive the live test client
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-binaries"
          cargo nextest archive --locked -p zinder-compat-lightwalletd --test acceptance \
            --archive-file "$RUNNER_TEMP/parity-binaries/compat-acceptance.tar.zst" --zstd-level 1
          cp target/release/zinder-ingest target/release/zinder-compat-lightwalletd \
            target/release/zinder-bench "$RUNNER_TEMP/parity-binaries/"

      # CBB generates its bindings at build time. Zinder uses checked-in bindings.
      - name: Install protoc for the CBB client
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the pinned CBB client
        run: |
          PROTOC="$(command -v protoc)" cargo install --locked \
            --git https://github.com/dismad/cbb \
            --rev a5a0899bac764cb330a442e777027a503a310197 \
            --root "$RUNNER_TEMP/cbb"
          cp "$RUNNER_TEMP/cbb/bin/cbb" "$RUNNER_TEMP/parity-binaries/"

      - name: Upload parity binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-binaries
          path: ${{ runner.temp }}/parity-binaries/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  parity-regtest:
    name: parity diff (regtest, ${{ matrix.node }})
    needs: build-parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: zebra
            container: zebra-regtest
          - node: zakura
            container: zakura-regtest
    # The legs install no toolchain. They call `cargo-nextest nextest` on the
    # archive, so rustup never reads rust-toolchain.toml.
    env:
      NEXTEST_ARCHIVE_FILE: ${{ github.workspace }}/target/release/compat-acceptance.tar.zst

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-nextest
        run: scripts/install-ci-tool.sh cargo-nextest

      # Artifacts drop the executable bit, so restore it after the download.
      - name: Download parity binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-binaries
          path: target/release

      - name: Install parity binaries
        run: |
          chmod +x target/release/zinder-ingest target/release/zinder-compat-lightwalletd \
            target/release/zinder-bench target/release/cbb

      # Zebra runs as a step rather than a service container because its
      # Regtest activation heights and funding streams come from a mounted
      # TOML file (deploy/zebra/regtest.toml), which a service container cannot
      # read before checkout. Coinbase pays to the broadcast-cycle test key so
      # the shim and reference agree on real transaction data.
      - name: Start Zebra on Regtest through NU7
        if: matrix.node == 'zebra'
        run: |
          docker run -d --name zebra-regtest -p 127.0.0.1:39232:39232 \
            -v "${GITHUB_WORKSPACE}/deploy/zebra/regtest.toml:/etc/zebrad/zebrad.toml:ro" \
            -e CONFIG_FILE_PATH=/etc/zebrad/zebrad.toml \
            -e ZEBRA_RPC__LISTEN_ADDR=0.0.0.0:39232 \
            -e ZEBRA_RPC__ENABLE_COOKIE_AUTH=false \
            -e ZEBRA_MINING__MINER_ADDRESS="${PARITY_TRANSPARENT_ADDRESS}" \
            docker.io/zfnd/zebra:7.1.0@sha256:4f9536c8061e407f9f2ec81b7e0dd2f1762f81deec316abb1530dca8796a33ba

      # Zakura runs on the host network with every listener on loopback
      # (deploy/zakura/regtest.toml), because it refuses a plaintext indexer
      # listener on any other address. Its coinbase cannot pay Sapling or
      # Orchard and it has no `generatetoaddress`, so the first start mines 10
      # blocks to the unified address in the TOML and the second pays the
      # parity transparent address on the same state. The step waits past
      # Zakura's 5-second non-finalized backup interval before the restart and
      # checks that all 10 blocks survived it. See live-tests.yml.
      - name: Start Zakura on Regtest through NU7
        if: matrix.node == 'zakura'
        run: |
          set -euo pipefail
          state_dir="${RUNNER_TEMP}/zakura-regtest-state"
          mkdir -p "${state_dir}"
          start_zakura() {
            docker run -d --name zakura-regtest --network host \
              --user "$(id -u):$(id -g)" --entrypoint /usr/local/bin/zakurad \
              --health-cmd "curl -sf http://127.0.0.1:38080/healthy" \
              --health-interval 5s --health-timeout 5s --health-retries 12 \
              -v "${GITHUB_WORKSPACE}/deploy/zakura/regtest.toml:/etc/zakura/zakurad.toml:ro" \
              -v "${state_dir}:/var/lib/zakura/state" \
              "$@" \
              docker.io/zakuracore/zakura:1.8.6@sha256:e514c89b751b685686690098928507aaa994311e6b90c79373c55b0afaa45d50 \
              --config /etc/zakura/zakurad.toml start
          }
          rpc() {
            curl -s -X POST -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":$2}" \
              "${REGTEST_NODE_RPC_URL}"
          }

          start_zakura
          scripts/mine-live-regtest.sh "${REGTEST_NODE_RPC_URL}" 10
          sleep 6
          docker stop zakura-regtest
          docker rm zakura-regtest

          start_zakura -e ZAKURA_MINING__MINER_ADDRESS="${PARITY_TRANSPARENT_ADDRESS}"
          for _ in $(seq 1 60); do
            if rpc getblockcount '[]' | jq -e '.result' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          tip="$(rpc getblockcount '[]' | jq -r '.result')"
          ironwood="$(rpc getblock '["10",1]' | jq -r '.result.trees.ironwood.size // 0')"
          if [[ "${tip}" != 10 || "${ironwood}" -eq 0 ]]; then
            echo "::error::Zakura restart did not keep the shielded prefix: tip ${tip}, Ironwood notes at height 10: ${ironwood}"
            exit 1
          fi

      - name: Advance regtest chain and start reference lightwalletd
        run: |
          set -euo pipefail
          scripts/mine-live-regtest.sh "${REGTEST_NODE_RPC_URL}" "${PARITY_REGTEST_TIP}"
          tip="${PARITY_REGTEST_TIP}"
          # The reference image cannot be configured as a service container, so
          # run it here on the host network to reach the node RPC port.
          docker run -d --name lightwalletd-reference --network host \
            "${REFERENCE_LIGHTWALLETD_IMAGE}" \
            --grpc-bind-addr 0.0.0.0:9088 \
            --rpchost 127.0.0.1 --rpcport 39232 --rpcuser zebra --rpcpassword zebra \
            --no-tls-very-insecure \
            --data-dir /tmp/lwd --log-file /dev/stdout
          reference_ready=""
          for _ in $(seq 1 60); do
            if docker logs lightwalletd-reference 2>&1 | grep -F "Waiting for block: $((tip + 1))" >/dev/null; then
              reference_ready=yes
              break
            fi
            sleep 2
          done
          if [ -z "${reference_ready}" ]; then
            echo "::error::Reference lightwalletd did not reach the Regtest fence at height ${tip}"
            exit 1
          fi

      - name: Build fixed-fence Zinder stores and start compat
        env:
          ZINDER_NODE__JSON_RPC_ADDR: http://127.0.0.1:39232
          ZINDER_NODE__AUTH__METHOD: basic
          ZINDER_NODE__AUTH__USERNAME: zebra
          ZINDER_NODE__AUTH__PASSWORD: zebra
        run: |
          set -euo pipefail
          mkdir -p .tmp
          # Every canonical-store opener must state the same persisted
          # raw-blob retention identity. Scope it to each process so unrelated
          # commands in this step keep their own defaults.
          ZINDER_STORAGE__RAW_BLOB_POLICY=all ./target/release/zinder-ingest --network zcash-regtest \
            --storage-path .tmp/parity-store > .tmp/ingest.log 2>&1 &
          echo "ingest=$!" > .tmp/parity.pids
          tip=$(curl -sf -X POST -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' \
            "${REGTEST_NODE_RPC_URL}" | sed -E 's/.*"result":[[:space:]]*([0-9]+).*/\1/')
          # Bring ingest to the mined tip. The one-shot benchmark wallet builder
          # still opens its input as a primary, so stop only long enough to make
          # that fixture, then restore the writer before compat starts. Compat
          # itself authenticates against the live writer and owns secondaries
          # only; it must never take a primary handle.
          caught_up=""
          for _ in $(seq 1 90); do
            if grep -qE " visible_tip_height=${tip}( |$)" .tmp/ingest.log; then
              caught_up=yes
              break
            fi
            sleep 2
          done
          if [ -z "${caught_up}" ]; then
            echo "ingest did not commit tip ${tip} in time; last ingest log lines:" >&2
            tail -n 30 .tmp/ingest.log >&2 || true
            exit 1
          fi
          echo "ingest caught up to tip ${tip}"
          ingest_pid=$(sed -n 's/^ingest=//p' .tmp/parity.pids)
          kill "${ingest_pid}"
          wait "${ingest_pid}" || true
          ./target/release/zinder-bench rocksdb-wallet-rebuild \
            --network zcash-regtest \
            --json-rpc-addr "${REGTEST_NODE_RPC_URL}" \
            --raw-blob-retention all \
            --canonical-store .tmp/parity-store \
            --wallet-store .tmp/parity-wallet-store > .tmp/wallet-rebuild.json

          ZINDER_STORAGE__RAW_BLOB_POLICY=all ./target/release/zinder-ingest --network zcash-regtest \
            --storage-path .tmp/parity-store > .tmp/ingest.log 2>&1 &
          echo "ingest=$!" > .tmp/parity.pids
          writer_restored=""
          for _ in $(seq 1 90); do
            if grep -qE " visible_tip_height=${tip}( |$)" .tmp/ingest.log; then
              writer_restored=yes
              break
            fi
            sleep 2
          done
          if [ -z "${writer_restored}" ]; then
            echo "ingest did not restore tip ${tip} after wallet build; last ingest log lines:" >&2
            tail -n 30 .tmp/ingest.log >&2 || true
            exit 1
          fi

          # The mined Regtest timestamps predate the outage by years.
          ZINDER_COMPAT__STALE_TIP_LIMIT_MS=0 ZINDER_STORAGE__RAW_BLOB_POLICY=all \
            ./target/release/zinder-compat-lightwalletd --network zcash-regtest \
            --canonical-primary-path .tmp/parity-store \
            --canonical-secondary-root .tmp/parity-secondary-compat-canonical \
            --wallet-primary-path .tmp/parity-wallet-store \
            --wallet-secondary-root .tmp/parity-secondary-compat-wallet \
            --listen-addr 127.0.0.1:9087 \
            --node-json-rpc-addr http://127.0.0.1:39232 > .tmp/compat.log 2>&1 &
          echo "compat=$!" >> .tmp/parity.pids
          compat_ready=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9107/readyz >/dev/null; then
              compat_ready=yes
              break
            fi
            sleep 1
          done
          if [ -z "${compat_ready}" ]; then
            echo "compat did not admit traffic in time; readiness response:" >&2
            curl -s http://127.0.0.1:9107/readyz >&2 || true
            echo >&2
            echo "last compat log lines:" >&2
            tail -n 50 .tmp/compat.log >&2 || true
            exit 1
          fi

      - name: Run CBB interoperability smoke
        run: |
          set -euo pipefail
          printf '%s\n' "$((PARITY_REGTEST_TIP - 1))" > .tmp/cbb-tree-heights.txt
          cbb=target/release/cbb
          "$cbb" \
            --endpoint zinder=http://127.0.0.1:9087 \
            --endpoint reference=http://127.0.0.1:9088 \
            --concurrency 1 --warmup 0 --steps 1 --chunk 3 --start-height "$((PARITY_REGTEST_TIP - 2))" \
            --tree-every 0 --timeout 30 --json-out .tmp/cbb-range.json
          scripts/validate-cbb-interop-report.sh .tmp/cbb-range.json GetBlockRange zinder reference
          # The pinned CBB checks response height in tree-file mode.
          "$cbb" \
            --endpoint zinder=http://127.0.0.1:9087 \
            --endpoint reference=http://127.0.0.1:9088 \
            --tree-heights-file .tmp/cbb-tree-heights.txt \
            --concurrency 1 --warmup 0 --steps 1 --timeout 30 \
            --json-out .tmp/cbb-tree.json
          scripts/validate-cbb-interop-report.sh .tmp/cbb-tree.json GetTreeState zinder reference

      - name: Run parity diff
        env:
          ZINDER_TEST_LIVE: "1"
          ZINDER_NETWORK: zcash-regtest
          ZINDER_NODE__JSON_RPC_ADDR: http://127.0.0.1:39232
          ZINDER_NODE__AUTH__METHOD: basic
          ZINDER_NODE__AUTH__USERNAME: zebra
          ZINDER_NODE__AUTH__PASSWORD: zebra
          ZINDER_TEST_PARITY_ZINDER_ADDR: http://127.0.0.1:9087
          ZINDER_TEST_PARITY_LIGHTWALLETD_ADDR: http://127.0.0.1:9088
          ZINDER_TEST_PARITY_TRANSPARENT_ADDRESS: ${{ env.PARITY_TRANSPARENT_ADDRESS }}
        run: |
          mkdir -p "$RUNNER_TEMP/nextest-extracted"
          cargo-nextest nextest run --archive-file "$NEXTEST_ARCHIVE_FILE" \
            --extract-to "$RUNNER_TEMP/nextest-extracted" --workspace-remap "$GITHUB_WORKSPACE" \
            --profile=ci-live --run-ignored=all \
            -E 'test(/^live::parity_against_lightwalletd::/) and not test(/mempool/)'

      - name: Compare light-wallet qualification with wallet serving
        env:
          ZINDER_NODE__JSON_RPC_ADDR: ${{ env.REGTEST_NODE_RPC_URL }}
          ZINDER_NODE__AUTH__METHOD: basic
          ZINDER_NODE__AUTH__USERNAME: zebra
          ZINDER_NODE__AUTH__PASSWORD: zebra
          REGTEST_CONTAINER: ${{ matrix.container }}
        run: scripts/test-light-wallet-qualification.sh target/release "$REGTEST_CONTAINER" http://127.0.0.1:9087

      - name: Dump pipeline logs on failure
        if: failure()
        run: |
          echo "=== ingest.log ==="; tail -n 50 .tmp/ingest.log || true
          echo "=== compat.log ==="; tail -n 50 .tmp/compat.log || true
          echo "=== cbb-range.json ==="; cat .tmp/cbb-range.json || true
          echo "=== cbb-tree.json ==="; cat .tmp/cbb-tree.json || true
          echo "=== lightwalletd-reference ==="; docker logs lightwalletd-reference 2>&1 | tail -n 50 || true
          echo "=== ${{ matrix.container }} ==="; docker logs ${{ matrix.container }} 2>&1 | tail -n 50 || true

      - name: Stop Zinder pipeline and reference
        if: always()
        run: |
          if [ -f .tmp/parity.pids ]; then
            cat .tmp/parity.pids
            mapfile -t pids < <(grep -oE '[0-9]+' .tmp/parity.pids)
            if [ "${#pids[@]}" -gt 0 ]; then
              kill "${pids[@]}" 2>/dev/null || true
            fi
          fi
          docker rm -f lightwalletd-reference 2>/dev/null || true
