name: parity-compat

# T3 (live) fixed-fence parity diff between Zinder's `zinder-compat-lightwalletd`
# and the pinned upstream `electriccoinco/lightwalletd` Go reference, both
# pointed at the same pinned regtest Zebra node. Mempool parity remains outside
# this workflow until dedicated ingest-control composition is restored.
#
# Test sources: services/zinder-compat-lightwalletd/tests/live/parity_against_lightwalletd.rs

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "services/zinder-compat-lightwalletd/**"
      - "services/zinder-bench/**"
      - "services/zinder-ingest/**"
      - "crates/zinder-proto/proto/compat/lightwalletd/**"
      - "services/zinder-query/**"
      - "crates/zinder-store/**"
      - "crates/zinder-core/src/wire/**"
      - "crates/zinder-proto/src/capabilities.rs"
      - "deploy/zebra/regtest.toml"
      - "scripts/mine-live-regtest.sh"
      - ".github/workflows/parity-compat.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NEXTEST_VERSION: "0.9.116"
  PROTOC: /does/not/exist
  # The reference must parse the version-6 (NU6.3 and later) transactions that
  # every block from height 6 carries under deploy/zebra/regtest.toml.
  REFERENCE_LIGHTWALLETD_IMAGE: docker.io/electriccoinco/lightwalletd:v0.6.0@sha256:abc8199dae800e050415a3459f71c7850aeefeb1ca6a681e9b9eda7249ce8613
  # Past NU7 (height 140), so the fixed fence covers blocks on both sides of
  # the activation.
  PARITY_REGTEST_TIP: "150"
  PARITY_TRANSPARENT_ADDRESS: tmDpFafuBHKGUYmuwLsrxWJrwcnSyzEEtYx
  # Not prefixed `ZINDER_`: the binaries reject unknown `ZINDER_*` env vars as
  # invalid config keys, so a `ZINDER_*` port knob would crash them at startup.
  ZEBRA_RPC_URL: http://127.0.0.1:39232

jobs:
  parity-regtest:
    name: parity diff (regtest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version "${CARGO_NEXTEST_VERSION}"

      - name: Build Zinder binaries
        run: cargo build --release -p zinder-ingest -p zinder-compat-lightwalletd -p zinder-bench

      # Zebra runs as a step rather than a service container because its
      # Regtest activation heights and funding streams come from a mounted
      # TOML file (deploy/zebra/regtest.toml), which a service container cannot
      # read before checkout. Coinbase pays to the broadcast-cycle test key so
      # the shim and reference agree on real transaction data.
      - name: Start Zebra on Regtest through NU7
        run: |
          docker run -d --name zebra-regtest -p 127.0.0.1:39232:39232 \
            -v "${GITHUB_WORKSPACE}/deploy/zebra/regtest.toml:/etc/zebrad/zebrad.toml:ro" \
            -e CONFIG_FILE_PATH=/etc/zebrad/zebrad.toml \
            -e ZEBRA_RPC__LISTEN_ADDR=0.0.0.0:39232 \
            -e ZEBRA_RPC__ENABLE_COOKIE_AUTH=false \
            -e ZEBRA_MINING__MINER_ADDRESS="${PARITY_TRANSPARENT_ADDRESS}" \
            docker.io/zfnd/zebra:7.0.0@sha256:a70d2be8ffef3a4b6e37355724e36a0e6c1838e46baa28bfb216739f00cf2d34

      - name: Advance regtest chain and start reference lightwalletd
        run: |
          set -euo pipefail
          scripts/mine-live-regtest.sh "${ZEBRA_RPC_URL}" "${PARITY_REGTEST_TIP}"
          tip="${PARITY_REGTEST_TIP}"
          # The reference image cannot be configured as a service container, so
          # run it here on the host network to reach the mapped Zebra RPC port.
          docker run -d --name lightwalletd-reference --network host \
            "${REFERENCE_LIGHTWALLETD_IMAGE}" \
            --grpc-bind-addr 0.0.0.0:9088 \
            --rpchost 127.0.0.1 --rpcport 39232 --rpcuser zebra --rpcpassword zebra \
            --no-tls-very-insecure --ping-very-insecure \
            --data-dir /tmp/lwd --log-file /dev/stdout
          for _ in $(seq 1 60); do
            if docker logs lightwalletd-reference 2>&1 | grep -q "Waiting for block: $((tip + 1))"; then
              break
            fi
            sleep 2
          done

      - name: Build fixed-fence Zinder stores and start compat
        env:
          ZINDER_NODE__JSON_RPC_ADDR: http://127.0.0.1:39232
          ZINDER_NODE__AUTH__METHOD: basic
          ZINDER_NODE__AUTH__USERNAME: zebra
          ZINDER_NODE__AUTH__PASSWORD: zebra
        run: |
          set -euo pipefail
          mkdir -p .tmp
          # Every canonical-store opener must state the same persisted
          # raw-blob retention identity. Scope it to each process so unrelated
          # commands in this step keep their own defaults.
          ZINDER_STORAGE__RAW_BLOB_POLICY=all ./target/release/zinder-ingest --network zcash-regtest \
            --storage-path .tmp/parity-store > .tmp/ingest.log 2>&1 &
          echo "ingest=$!" > .tmp/parity.pids
          tip=$(curl -sf -X POST -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' \
            "${ZEBRA_RPC_URL}" | sed -E 's/.*"result":[[:space:]]*([0-9]+).*/\1/')
          # Bring ingest to the mined tip. The one-shot benchmark wallet builder
          # still opens its input as a primary, so stop only long enough to make
          # that fixture, then restore the writer before compat starts. Compat
          # itself authenticates against the live writer and owns secondaries
          # only; it must never take a primary handle.
          caught_up=""
          for _ in $(seq 1 90); do
            if grep -qE " visible_tip_height=${tip}( |$)" .tmp/ingest.log; then
              caught_up=yes
              break
            fi
            sleep 2
          done
          if [ -z "${caught_up}" ]; then
            echo "ingest did not commit tip ${tip} in time; last ingest log lines:" >&2
            tail -n 30 .tmp/ingest.log >&2 || true
            exit 1
          fi
          echo "ingest caught up to tip ${tip}"
          ingest_pid=$(sed -n 's/^ingest=//p' .tmp/parity.pids)
          kill "${ingest_pid}"
          wait "${ingest_pid}" || true
          ./target/release/zinder-bench rocksdb-wallet-rebuild \
            --network zcash-regtest \
            --json-rpc-addr "${ZEBRA_RPC_URL}" \
            --raw-blob-retention all \
            --canonical-store .tmp/parity-store \
            --wallet-store .tmp/parity-wallet-store > .tmp/wallet-rebuild.json

          ZINDER_STORAGE__RAW_BLOB_POLICY=all ./target/release/zinder-ingest --network zcash-regtest \
            --storage-path .tmp/parity-store > .tmp/ingest.log 2>&1 &
          echo "ingest=$!" > .tmp/parity.pids
          writer_restored=""
          for _ in $(seq 1 90); do
            if grep -qE " visible_tip_height=${tip}( |$)" .tmp/ingest.log; then
              writer_restored=yes
              break
            fi
            sleep 2
          done
          if [ -z "${writer_restored}" ]; then
            echo "ingest did not restore tip ${tip} after wallet build; last ingest log lines:" >&2
            tail -n 30 .tmp/ingest.log >&2 || true
            exit 1
          fi

          ZINDER_STORAGE__RAW_BLOB_POLICY=all \
            ./target/release/zinder-compat-lightwalletd --network zcash-regtest \
            --canonical-primary-path .tmp/parity-store \
            --canonical-secondary-root .tmp/parity-secondary-compat-canonical \
            --wallet-primary-path .tmp/parity-wallet-store \
            --wallet-secondary-root .tmp/parity-secondary-compat-wallet \
            --listen-addr 127.0.0.1:9087 \
            --node-json-rpc-addr http://127.0.0.1:39232 > .tmp/compat.log 2>&1 &
          echo "compat=$!" >> .tmp/parity.pids
          compat_ready=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9107/readyz >/dev/null; then
              compat_ready=yes
              break
            fi
            sleep 1
          done
          if [ -z "${compat_ready}" ]; then
            echo "compat did not admit traffic in time; readiness response:" >&2
            curl -s http://127.0.0.1:9107/readyz >&2 || true
            echo >&2
            echo "last compat log lines:" >&2
            tail -n 50 .tmp/compat.log >&2 || true
            exit 1
          fi

      - name: Run parity diff
        env:
          ZINDER_TEST_LIVE: "1"
          ZINDER_NETWORK: zcash-regtest
          ZINDER_NODE__JSON_RPC_ADDR: http://127.0.0.1:39232
          ZINDER_NODE__AUTH__METHOD: basic
          ZINDER_NODE__AUTH__USERNAME: zebra
          ZINDER_NODE__AUTH__PASSWORD: zebra
          ZINDER_TEST_PARITY_ZINDER_ADDR: http://127.0.0.1:9087
          ZINDER_TEST_PARITY_LIGHTWALLETD_ADDR: http://127.0.0.1:9088
          ZINDER_TEST_PARITY_TRANSPARENT_ADDRESS: ${{ env.PARITY_TRANSPARENT_ADDRESS }}
        run: |
          cargo nextest run -p zinder-compat-lightwalletd --profile=ci-live --run-ignored=all \
            -E 'test(/^live::parity_against_lightwalletd::/) and not test(/mempool/)'

      - name: Dump pipeline logs on failure
        if: failure()
        run: |
          echo "=== ingest.log ==="; tail -n 50 .tmp/ingest.log || true
          echo "=== compat.log ==="; tail -n 50 .tmp/compat.log || true
          echo "=== lightwalletd-reference ==="; docker logs lightwalletd-reference 2>&1 | tail -n 50 || true
          echo "=== zebra-regtest ==="; docker logs zebra-regtest 2>&1 | tail -n 50 || true

      - name: Stop Zinder pipeline and reference
        if: always()
        run: |
          if [ -f .tmp/parity.pids ]; then
            cat .tmp/parity.pids
            mapfile -t pids < <(grep -oE '[0-9]+' .tmp/parity.pids)
            if [ "${#pids[@]}" -gt 0 ]; then
              kill "${pids[@]}" 2>/dev/null || true
            fi
          fi
          docker rm -f lightwalletd-reference 2>/dev/null || true
