# One tool per line: name, version, url, sha256 of the downloaded archive.
# Every URL is the upstream project's own GitHub release asset for an x86_64
# Linux runner. The sha256 is checked before anything is extracted, so bumping
# a version means updating the URL and the checksum together.
#
# cargo-deny and cargo-machete publish only statically linked musl builds for
# x86_64 Linux. No job that installs a tool runs on arm64.
