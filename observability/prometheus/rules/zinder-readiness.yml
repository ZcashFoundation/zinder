groups:
  - name: zinder-readiness
    rules:
      - alert: ZinderTargetDown
        expr: up{stack="zinder-local"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Zinder scrape target is down"
          description: "{{ $labels.service }} has not been scrapeable for 30 seconds."

      - alert: ZinderServiceNotReady
        expr: zinder_readiness_state{cause!~"^(ready|cursor_at_risk|serving_pair_stale)$"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Zinder service is not ready"
          description: "{{ $labels.service }} reports readiness cause {{ $labels.cause }}."

      - alert: ZinderReadinessWarning
        expr: zinder_readiness_state{cause=~"^cursor_at_risk$"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Zinder readiness warning"
          description: "{{ $labels.service }} reports traffic-safe readiness warning {{ $labels.cause }}."

      # The cause clears itself once storage.serving_pair_staleness_ceiling_ms
      # passes, so this window must stay well inside the shortest ceiling an
      # operator would configure.
      - alert: ZinderServingPairStale
        expr: zinder_readiness_state{cause=~"^serving_pair_stale$"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Zinder wallet-serving pair is stale"
          description: "{{ $labels.service }} is answering from the pair the writer last attested; it stops admitting traffic when the staleness ceiling passes."

      - alert: ZinderReplicaLag
        expr: max by (service) (zinder_readiness_replica_lag_chain_epochs) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Zinder secondary replica lag"
          description: "{{ $labels.service }} has a non-zero secondary replica lag."

      - alert: ZinderNodeRpcErrors
        expr: sum by (service, method, error_class) (rate(zinder_node_request_total{status!="ok"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Zinder node RPC errors"
          description: "{{ $labels.service }} sees {{ $labels.error_class }} errors from {{ $labels.method }}."

      - alert: ZinderWalletQueryP95High
        expr: histogram_quantile(0.95, sum by (service, operation, le) (rate(zinder_query_request_duration_seconds_bucket[5m]))) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Zinder wallet query p95 is high"
          description: "{{ $labels.service }} {{ $labels.operation }} p95 is above 250ms."

      - alert: ZinderRocksDbCompactionPressure
        expr: max by (service, cf) (zinder_store_rocksdb_property{property="rocksdb.estimate-pending-compaction-bytes"}) > 268435456
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Zinder RocksDB compaction pressure"
          description: "{{ $labels.service }} {{ $labels.cf }} has more than 256MiB pending compaction bytes."

      - alert: ZinderRocksDbCompactionRunningTooLong
        expr: max by (service, cf) (zinder_store_rocksdb_property{property="rocksdb.num-running-compactions"}) > 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Zinder RocksDB compaction is running for too long"
          description: "{{ $labels.service }} {{ $labels.cf }} reports more than four running compactions for 15 minutes."

      - alert: ZinderStoreWalGrowth
        expr: max by (service, store_role) (zinder_store_wal_bytes) / max by (service, store_role) (zinder_store_wal_bytes_limit) > 0.75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Zinder RocksDB WAL approaching ceiling"
          description: "{{ $labels.service }} {{ $labels.store_role }} live WAL is above 75% of the role-specific RocksDB max_wal_bytes budget; investigate flush stalls and resource pressure (docs/runbooks/bulk-catchup-resource-tuning.md)."

      - alert: ZinderStartupOpenStorageSlow
        expr: histogram_quantile(0.95, sum by (service, phase, le) (rate(zinder_startup_phase_duration_seconds_bucket{phase="open_storage"}[10m]))) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Zinder open_storage p95 is high"
          description: "{{ $labels.service }} open_storage p95 exceeds 60 seconds; sustained values point at WAL-replay-on-restart or filesystem contention."
