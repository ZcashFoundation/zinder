[workspace]
members = [
    "crates/zinder-core",
    "crates/zinder-client",
    "crates/zinder-materialized-views",
    "crates/zinder-proto",
    "crates/zinder-rocksdb-bulk-load",
    "crates/zinder-runtime",
    "crates/zinder-source",
    "crates/zinder-store",
    "crates/zinder-testkit",
    "crates/zinder-wallet-projection",
    "crates/zinder-wallet-rocksdb",
    "services/zinder-bench",
    "services/zinder-compat-lightwalletd",
    "services/zinder-compat-cipherscan",
    "services/zinder-explorer",
    "services/zinder-ingest",
    "services/zinder-projector",
    "services/zinder-query",
    "tools/zinder-proto-codegen",
    "vendor/postgres-protocol",
]
resolver = "3"

[workspace.package]
version = "0.5.0-rc.8"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/gustavovalverde/zinder"
rust-version = "1.95"

[workspace.dependencies]
arc-swap = "1.9"
async-trait = "0.1.91"
blake2b_simd = "1.0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# Zinder uses the scalar engines; avoid Base64 0.23's default `simd-unsafe` feature.
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
bytes = "1.12.1"
clap = "4.6.4"
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
eyre = "0.6.12"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", features = ["std"] }
hex = "0.4.3"
hmac = "0.12.1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
incrementalmerkletree = "0.9"
jsonrpsee = { version = "0.26.0", default-features = false, features = ["http-client", "server"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
parking_lot = "0.12.5"
orchard = { version = "0.16.0", default-features = false }
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rust-rocksdb = { version = "0.51.0", features = ["multi-threaded-cf"] }
secrecy = "0.10.3"
secp256k1 = { version = "0.33.1", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10.9"
sapling = { package = "sapling-crypto", version = "0.9.0", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
toml = "1.1.3"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tonic-types = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "smallvec", "std", "tracing-log"] }
# These protocol crates share concrete types with Zebra. Keep them on the
# release line selected by `zebra-chain`, and advance the entire stack
# together so Cargo cannot resolve incompatible duplicate type families.
zcash_address = { version = "=0.14.0-pre.0", default-features = false }
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false }
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false }
zcash_transparent = { version = "=0.11.0-pre.0", default-features = false }
zcash_script = "0.6"
zebra-chain = "=14.0.0"
zip32 = "0.3"
zinder-core = { version = "0.5.0-rc.8", path = "crates/zinder-core" }
zinder-rocksdb-bulk-load = { path = "crates/zinder-rocksdb-bulk-load" }
zinder-client = { version = "0.5.0-rc.8", path = "crates/zinder-client" }
zinder-compat-cipherscan = { path = "services/zinder-compat-cipherscan" }
zinder-compat-lightwalletd = { path = "services/zinder-compat-lightwalletd" }
zinder-materialized-views = { path = "crates/zinder-materialized-views" }
zinder-explorer = { path = "services/zinder-explorer" }
zinder-ingest = { path = "services/zinder-ingest" }
zinder-projector = { path = "services/zinder-projector" }
zinder-proto = { version = "0.5.0-rc.8", path = "crates/zinder-proto" }
zinder-query = { path = "services/zinder-query" }
zinder-runtime = { path = "crates/zinder-runtime" }
zinder-source = { path = "crates/zinder-source" }
zinder-store = { path = "crates/zinder-store" }
zinder-testkit = { path = "crates/zinder-testkit" }
zinder-wallet-projection = { path = "crates/zinder-wallet-projection" }
zinder-wallet-rocksdb = { path = "crates/zinder-wallet-rocksdb" }

[patch.crates-io]
# `bip32 0.6.0-pre.1` pins prerelease RustCrypto 0.13 packages that Cargo
# cannot resolve beside the stable 0.13 packages used by postgres-protocol.
# This tested 0.6.12 compatibility fork retains the mature 0.10/0.12 crypto
# line while preserving all upstream 0.6.12 protocol and security fixes.
postgres-protocol = { path = "vendor/postgres-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_pub_crate = "allow"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
disallowed_types = "deny"

[profile.release]
lto = "thin"
