[workspace]
members = [
    "crates/zinder-core",
    "crates/zinder-client",
    "crates/zinder-materialized-views",
    "crates/zinder-proto",
    "crates/zinder-rocksdb-bulk-load",
    "crates/zinder-runtime",
    "crates/zinder-source",
    "crates/zinder-store",
    "crates/zinder-testkit",
    "crates/zinder-wallet-projection",
    "crates/zinder-wallet-rocksdb",
    "services/zinder-bench",
    "services/zinder-compat-lightwalletd",
    "services/zinder-compat-cipherscan",
    "services/zinder-explorer",
    "services/zinder-ingest",
    "services/zinder-projector",
    "services/zinder-query",
    "tools/zinder-proto-codegen",
]
resolver = "3"

[workspace.package]
version = "0.24.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/ZcashFoundation/zinder"
rust-version = "1.100"

[workspace.dependencies]
arc-swap = "1.9.5"
async-trait = "0.1.92"
blake2b_simd = "1.0.5"
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base16ct = "1.0.0"
# Zinder uses the scalar engines; avoid Base64 0.23's default `simd-unsafe` feature.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.12.2"
clap = "4.6.8"
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller"] }
composefs-ioctls = "0.10.0"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
eyre = "0.6.14"
fs-verity = "0.2.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", features = ["std"] }
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "server", "service", "tokio"] }
incrementalmerkletree = "0.9.0"
jsonrpsee = { version = "0.26.2", default-features = false, features = ["http-client", "server"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
parking_lot = "0.13.0"
orchard = { version = "0.16.0", default-features = false }
# Pin the Pasta field-arithmetic crate so the opt-in `asm` feature selects the
# version already locked transitively through `orchard`. The `asm` feature is
# enabled only by an explicit `--features pasta_curves/asm` build (see
# docs/runbooks/deploying.md); it is neither a default feature nor reachable
# through `--all-features`, so the portable backend remains the shipped default.
pasta_curves = { version = "=0.6.3", default-features = false }
prost = "0.14.6"
prost-types = "0.14.6"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
raw-cpuid = "11.6.0"
rayon = "1.12.0"
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rust-rocksdb = { version = "0.54.1", features = ["multi-threaded-cf"] }
ring = "0.17.14"
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.16.0", default-features = false, features = ["alloc"] }
secrecy = "0.10.3"
secp256k1 = { version = "0.33.1", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
slab = "0.4.12"
sapling = { package = "sapling-crypto", version = "0.9.0", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
# Unprefixed symbols replace the C library `malloc`, so RocksDB's native
# allocations share jemalloc with Rust code instead of glibc's arena locks.
tikv-jemallocator = { version = "0.7.0", features = ["unprefixed_malloc_on_supported_platforms"] }
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
toml = "1.2.1"
tonic = { version = "0.14.9", features = ["tls-ring", "tls-native-roots"] }
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tonic-reflection = "0.14.9"
tonic-types = "0.14.9"
tonic-web = "0.14.9"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "smallvec", "std", "tracing-log"] }
url = "2.5.8"
# These protocol crates share concrete types with Zebra. Keep them on the
# release line selected by `zebra-chain`, and advance the entire stack
# together so Cargo cannot resolve incompatible duplicate type families.
zcash_address = { version = "0.14.0", default-features = false }
zcash_primitives = { version = "0.31.1", default-features = false }
zcash_protocol = { version = "0.11.0", default-features = false }
zcash_transparent = { version = "0.11.1", default-features = false }
zebra-chain = "16.0.0"
zip32 = "0.3.0"
zinder-core = { version = "0.24.0", path = "crates/zinder-core" }
zinder-rocksdb-bulk-load = { path = "crates/zinder-rocksdb-bulk-load" }
zinder-client = { version = "0.24.0", path = "crates/zinder-client" }
zinder-compat-lightwalletd = { path = "services/zinder-compat-lightwalletd" }
zinder-materialized-views = { path = "crates/zinder-materialized-views" }
zinder-ingest = { path = "services/zinder-ingest" }
zinder-proto = { version = "0.24.0", path = "crates/zinder-proto" }
zinder-query = { path = "services/zinder-query" }
zinder-runtime = { path = "crates/zinder-runtime" }
zinder-source = { path = "crates/zinder-source" }
zinder-store = { path = "crates/zinder-store" }
zinder-testkit = { path = "crates/zinder-testkit" }
zinder-wallet-projection = { path = "crates/zinder-wallet-projection" }
zinder-wallet-rocksdb = { path = "crates/zinder-wallet-rocksdb" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_pub_crate = "allow"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
disallowed_types = "deny"

[profile.release]
lto = "thin"

# `zinder-testkit` builds Orchard and Ironwood bundles with real Halo2 proofs.
# Unoptimized, building the proving key and one proof takes about five times
# longer, which pushes shielded tests toward their timeouts on CI runners. The
# cost is a slower first dev build of these crates.
[profile.dev.package.halo2_proofs]
opt-level = 3

[profile.dev.package.halo2_gadgets]
opt-level = 3

[profile.dev.package.orchard]
opt-level = 3

[profile.dev.package.pasta_curves]
opt-level = 3
