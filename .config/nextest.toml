# Workspace nextest profiles. The Testing Runbook owns the tier definitions;
# service operations records the operator-facing validation shape.
#
# Tiers:
#   T0 unit         -> #[cfg(test)] mod tests in src/   (default-filter)
#   T1 integration  -> tests/integration/               (default-filter)
#   T1 Postgres     -> externally backed Postgres test  (ci-postgres profile)
#   T2 perf         -> tests/perf/                      (ci-perf profile)
#   T3 live         -> tests/live/                      (ci-live profile)
#   T4 parity       -> tests/parity/                    (ci-parity profile)
#
# default-filter is the structural boundary between tiers; #[ignore] is the
# libtest-fallback safety net for `cargo test` users without nextest. Both
# must remain in place; either alone is insufficient.

[profile.default]
slow-timeout = { period = "10s", terminate-after = 2 }
fail-fast = false
default-filter = "not test(/^live::/) and not test(/^perf::/) and not test(/^parity::/)"

[profile.ci]
inherits = "default"
retries = { count = 1, backoff = "exponential", delay = "1s" }
final-status-level = "fail"
junit = { path = "target/nextest/junit.xml" }

[[profile.default.overrides]]
# Concurrent canonical and wallet fixture builds stall on filesystem journal
# commits. Each replay then copies and syncs both stores and opens a secondary.
# Limit overlapping fixtures. Even two can cross 20s when other suites share
# the disk, so report slow tests at 20s and terminate them at 60s.
filter = "package(=zinder-bench) & test(/^integration::rocksdb_tip_replay::/)"
test-group = "rocksdb-tip-replay"
slow-timeout = { period = "20s", terminate-after = 3 }

[[profile.default.overrides]]
# Active-writer publication tests build canonical and wallet stores across a
# 4,096-block segment boundary, clone them into three matched modes, and drive
# concurrent RocksDB writers, projector, and gRPC readers.
filter = "package(=zinder-bench) & test(/^integration::active_writer_publication::/)"
test-group = "rocksdb-tip-replay"
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.default.overrides]]
# Process-crash tests spawn child processes that abort at a crash point, then
# reopen the store. Each abort plus RocksDB reopen costs seconds where the host
# collects core dumps, which exceeds the 20s default kill window under
# full-workspace parallelism.
filter = "test(publication_crashes_preserve_the_atomic_build_state) | test(live_commit_crashes_reopen_at_one_complete_atomic_fence) | test(activation_schedule_crash_recovers_before_or_after_atomic_record_and_control_write) | test(killed_wallet_build_restarts_under_the_same_owner_without_waiting_for_lease_expiry) | test(/across_process_abort$/) | test(/^process_crash::tests::/)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# These tests build a wallet store holding thousands of unspent outputs, for
# one address whose production-sized stream spans several 1,024-output pages,
# or for the 60 busy addresses the lightwalletd merge bound is checked
# across. The build takes seconds alone and more under full-workspace
# parallelism, which crosses the 20s default kill window.
filter = "test(abandoned_and_stalled_unspent_output_reads_do_not_stop_publication) | test(cancelling_an_unspent_output_stream_stops_its_storage_reads_and_releases_its_pair) | test(address_utxos_bound_the_outputs_held_across_many_addresses)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# These tests give store rows table files of their own, one flush per row, and
# then compact the files away under a secondary. Each takes about a second
# alone, but under full-workspace parallelism every flush waits on a contended
# disk, and they take 10-20s, which reaches the 20s default kill window.
filter = "test(/table_file/) | test(a_stream_ends_with_its_epoch_unavailable_when_its_replacement_serves_a_newer_epoch) | test(a_corrupt_store_control_row_refuses_admission) | test(a_bounded_read_its_first_block_fills_fetches_only_that_block) | test(publisher_exports_live_sst_size_for_newest_published_pair_without_per_file_properties)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# This test plans a rollback of a 200-output block about 25 times, 20 of them
# to search for its tightest logical-byte limit, and then builds the wallet
# cold. It takes 8-11s alone in a debug build and more under full-workspace
# parallelism, which crosses the 20s default kill window.
filter = "test(a_rollback_near_its_limit_rereads_rows_it_could_not_remember)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# Each of the 24 seeded cases opens four RocksDB stores with every bundled
# consumer's column families and applies two reorgs. The fixed case set takes
# 13-20s on a 4-vCPU runner, which crosses the 20s default kill window.
filter = "test(every_bundled_consumer_is_reorg_path_independent)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# These tests build an Orchard or Ironwood bundle with a real Halo2 proof,
# including the proving key, which each test process builds once. That takes
# seconds even with the optimized dev profile of the proving crates, and more
# on a contended runner.
filter = "test(/^transparent_signer::tests::shielding_spend_.*_pays_one_/)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# These tests publish a 380-block chain with note commitments, derive every
# block's trees from genesis to check against, and run the densification pass
# to completion. Each takes 4-18s alone in a debug build and more under
# full-workspace parallelism, which crosses the 20s default kill window.
filter = "test(/^integration::tree_state_densification::/)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# This test starts a canonical writer on RocksDB, an ingest-control server, and
# the tip-change publisher, then waits for the writer to commit a new tip. It
# bounds each wait by a 90s scenario deadline that reports the condition still
# outstanding, which needs a kill window longer than the 20s default under
# full-workspace parallelism.
filter = "test(production_tip_change_publisher_observes_a_post_wait_canonical_event)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# This test builds two 6,100-block canonical and wallet store fixtures (each
# sealing a 4,096-block settled segment). It takes ~10-11s alone in a debug
# build and crosses the 20s default kill window under 4-vCPU CI shard
# parallelism.
filter = "package(=zinder-compat-lightwalletd) & test(=integration::lightwalletd_grpc::canonical_range::descending_gap_retry_delivers_every_previously_checked_retained_block)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
# These qualification tests pass 100,000 UTXOs through JSON-RPC to exercise
# the node's actual page limit. The cutoff proof can read a full page more
# than once for each node. Each RPC has its own 30s timeout.
filter = """
package(=zinder-compat-lightwalletd) & (
  test(cap_sized_cutoff_height_returns_a_smaller_wallet_ordered_prefix)
  | test(cap_sized_multi_height_prefix_stays_bounded_and_wallet_ordered)
  | test(later_outputs_can_prevent_proving_a_full_cutoff_height)
)
"""
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci-perf]
default-filter = "test(/^perf::/)"
slow-timeout = { period = "5m", terminate-after = 1 }
junit = { path = "target/nextest/perf.xml" }

# Concrete driver gate. The test remains under tests/integration/ because it
# exercises a crate boundary, but it is ignored by default because it requires
# a fresh disposable PostgreSQL database. CI supplies that database and runs
# this profile with --run-ignored=all.
[profile.ci-postgres]
default-filter = "test(/^integration::postgres_canonical_replay::/) | test(/^integration::postgres_segmented::/)"
slow-timeout = { period = "60s", terminate-after = 1 }
junit = { path = "target/nextest/postgres.xml" }

[profile.ci-live]
default-filter = "test(/^live::/)"
retries = { count = 2, backoff = "exponential", delay = "5s" }
slow-timeout = { period = "60s", terminate-after = 1 }
junit = { path = "target/nextest/live.xml" }

# Consumer-release certification tier. Per-consumer parity
# assertions live under `tests/parity/` in each crate that surfaces a public
# consumer contract. The main PR pipeline runs this profile so consumer-shaped
# regressions fail before a release-candidate certification run.
[profile.ci-parity]
default-filter = "test(/^parity::/)"
slow-timeout = { period = "60s", terminate-after = 1 }
junit = { path = "target/nextest/parity.xml" }

[test-groups]
rocksdb-tip-replay = { max-threads = 2 }

# Live tests that mutate node state share a single Docker container.
# Read-only live tests (capability probes, tip fetches, broadcast-rejection
# classification) run in parallel under the default group unless they share a
# fixture with a mutating test. The lightwalletd parity file serializes as a
# unit because accepted-send parity mutates the shared regtest mempool.
node-mutating = { max-threads = 1 }

[[profile.ci-live.overrides]]
# This test intentionally broadcasts into the shared regtest mempool. A retry
# would replay the same spend against the same node state and fail as a
# double-spend rather than exercising parity.
filter = "test(accepted_send_transaction_surfaces_in_non_empty_mempool_methods)"
retries = { count = 0, backoff = "fixed", delay = "0s" }

[[profile.ci-live.overrides]]
# The NU7 activation test spends regtest coinbase outputs and mines across the
# activation. A retry would start above NU7 and could not cross it again.
filter = "test(/^live::nu7_activation::/)"
retries = { count = 0, backoff = "fixed", delay = "0s" }

[[profile.ci-live.overrides]]
# The shielded broadcast test builds a Halo2 proof and then constructs a
# canonical store from genesis through the tip. A retry would repeat that cost
# against a chain the failed attempt already advanced, so it reports the first
# failure instead.
filter = "test(shielded_outputs_are_indexed_after_mining)"
slow-timeout = { period = "180s", terminate-after = 1 }
retries = { count = 0, backoff = "fixed", delay = "0s" }

[[profile.ci-live.overrides]]
# The real-client flow creates a wallet, spends a unique UTXO, and mines
# confirmations. Retrying after a failure would exercise a different chain
# state, not the failed client interaction.
filter = "test(zingolib_bootstrap_restore_shield_and_mempool_flow_certifies_zinder)"
retries = { count = 0, backoff = "fixed", delay = "0s" }

[[profile.ci-live.overrides]]
# Tests that share or contend on the upstream node's process state must
# serialize through `node-mutating`. The Zebra indexer gRPC port is a single
# upstream resource: any test that opens an indexer stream races with the
# destructive container-restart test, so all indexer consumers join here.
# `source_blocks_reencode_to_node_bytes_across_the_chain` reads every block up
# to the tip it observed, which a concurrent reorg test could invalidate.
filter = "test(live::deep_chain) or test(live::cli) or test(/live::broadcast_fallback::/) or test(/live::zebra_indexer_mempool::/) or test(/live::mempool_broadcast_cycle::/) or test(/live::parity_against_lightwalletd::/) or test(/live::zingolib::/) or test(/live::reorg_sweep::/) or test(/live::nu7_activation::/) or test(source_blocks_reencode_to_node_bytes_across_the_chain)"
test-group = "node-mutating"

[[profile.ci-live.overrides]]
filter = "test(standalone_wallet_query_serves_native_contract)"
slow-timeout = { period = "15s", terminate-after = 1 }

[[profile.ci-live.overrides]]
filter = "test(canonical_blocks_load_requested_range_from_fixed_checkpoint)"
slow-timeout = { period = "5m", terminate-after = 1 }
