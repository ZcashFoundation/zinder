[package]
name = "zinder-client"
version.workspace = true
description = "Typed Rust client surface for Zinder chain-index consumers"
edition.workspace = true
readme = "README.md"
keywords = ["zcash", "indexer", "client"]
categories = ["api-bindings"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
include = [
    "/src/**",
    "/examples/**",
    "/Cargo.toml",
    "/README.md",
]

[features]
default = ["remote"]
remote = [
    "dep:arc-swap",
    "dep:futures-util",
    "dep:tokio",
    "dep:tonic",
    "dep:tonic-types",
    "dep:tracing",
    "dep:zinder-proto",
]

[dependencies]
arc-swap = { workspace = true, optional = true }
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"], optional = true }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "tls-ring", "tls-native-roots"], optional = true }
tonic-types = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zinder-core = { version = "0.6.0", path = "../zinder-core", default-features = false }
zinder-proto = { workspace = true, optional = true }

[dev-dependencies]
eyre.workspace = true
secrecy.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "time"] }
toml.workspace = true
tonic = { workspace = true, features = ["server", "transport"] }
tonic-prost.workspace = true
zebra-chain.workspace = true
zinder-compat-lightwalletd.workspace = true
zinder-query.workspace = true
zinder-runtime.workspace = true
zinder-source.workspace = true
zinder-store.workspace = true
zinder-testkit.workspace = true

[[example]]
name = "observe_transparent_address"
path = "examples/observe_transparent_address.rs"
required-features = ["remote"]

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
required-features = ["remote"]

[[example]]
name = "observe_mempool_to_confirmed"
path = "examples/observe_mempool_to_confirmed.rs"
required-features = ["remote"]

[lints]
workspace = true
