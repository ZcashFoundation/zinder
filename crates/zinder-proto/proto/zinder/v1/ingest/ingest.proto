syntax = "proto3";

package zinder.v1.ingest;

import "zinder/v1/ops/readiness.proto";
import "zinder/v1/ops/server_info.proto";
import "zinder/v1/wallet/wallet.proto";

// IngestControl ServerInfo request. Same shape as every Zinder ServerInfo;
// orchestrators that probe the writer's identity and capability set use
// this rpc.
message ServerInfoRequest {}

// IngestControl ServerInfo response.
//
// Carries the cross-service `ops.ServerInfo` message. Operators probing
// the writer get the same descriptor shape they get from WalletQuery,
// without the wallet-specific retention or reorg-window fields.
message ServerInfoResponse {
  zinder.v1.ops.ServerInfo server_info = 1;
}

// Private ingest control-plane request for the writer's latest committed
// chain epoch.
message WriterStatusRequest {}

// Current phase of the phase-driven ingest loop. Orthogonal to readiness
// `cause`: a writer in `WRITER_PHASE_BULK_CATCHUP` may report `syncing`
// (normal) or `upstream_not_ready` (Zebra itself is behind). See ADR-0015.
enum WriterPhase {
  // Default scalar so unset fields do not silently match a real phase.
  WRITER_PHASE_UNSPECIFIED = 0;
  // Upstream tip is below the catch-up floor (regtest near genesis or
  // freshly initialized nodes). The loop polls on the upstream-health
  // interval and emits `cause=upstream_not_ready` until enough chain
  // exists to commit.
  WRITER_PHASE_AWAITING_UPSTREAM = 1;
  // Gap to the upstream tip is above `ingest.phase_classification.catchup_threshold_blocks`.
  // The bulk-catchup driver runs pipelined block fetches, commits batches,
  // and advances the settled tip under the configured reorg-window policy.
  WRITER_PHASE_BULK_CATCHUP = 2;
  // Gap is within the catch-up threshold. The serial tip-follow driver
  // commits one block per poll cycle.
  WRITER_PHASE_FOLLOWING_TIP = 3;

}

// Private ingest control-plane response used by colocated secondary readers
// to compute RocksDB-secondary replica lag.
message WriterStatusResponse {
  // Cross-plane chain-state envelope. The writer's latest committed chain
  // epoch (with its visible and settled tips) rides on
  // `chain_view.chain_epoch`; `chain_view.upstream_tip` carries the upstream
  // observation. Absent when the writer has not committed a chain epoch yet.
  optional zinder.v1.wallet.ChainView chain_view = 1;

  // Stable public network name, such as "zcash-regtest". Carried outside
  // `chain_view` because it is known before the first commit.
  string network_name = 2;

  // Current phase of the phase-driven ingest loop. ADR-0015.
  WriterPhase phase = 5;

  // Distance from the writer's visible tip to the observed upstream tip
  // when known. Drives phase classification; populated whenever the writer
  // has both a store tip and an upstream tip observation.
  optional uint32 gap_blocks = 7;

  // Last upstream-health observation. Unset when no probe has produced a
  // sample yet (writer still in the `STARTING` window) or when the
  // upstream is healthy. Carries the same payload `ReadinessReport`
  // surfaces under `cause=upstream_not_ready`; readers parse one struct
  // for both surfaces. ADR-0015 §Upstream sync detection.
  optional zinder.v1.ops.UpstreamNotReadyDetail upstream_not_ready = 8;
}

// Private point lookup for one transaction in the writer's live mempool
// index. Transaction ids use canonical RPC byte order.
message MempoolTransactionRequest {
  string transaction_id = 1;
}

// Exact authenticated fence published by the canonical writer.
message CanonicalWriterFence {
  uint64 chain_epoch_id = 1;
  uint64 event_sequence = 2;
  uint32 visible_tip_height = 3;
  bytes visible_tip_hash = 4;
  bytes canonical_sequence_digest = 5;
  uint64 visible_block_count = 6;
}

// Status request for the canonical writer.
message CanonicalWriterStatusRequest {}

// Status used by projectors and secondary readers to authenticate their view.
message CanonicalWriterStatusResponse {
  string network_name = 1;
  CanonicalWriterFence fence = 2;
  uint64 oldest_retained_event_sequence = 3;
  // Activation schedule the writer admitted for this store. Absent only when
  // no writer of this release has opened the store. The immutable
  // construction fingerprint is reported separately in checkpoint evidence.
  CanonicalNetworkUpgradeSchedule network_upgrade_schedule = 4;
}

// One node-advertised network-upgrade activation in an admitted schedule.
message CanonicalNetworkUpgradeActivation {
  uint32 branch_id = 1;
  uint32 height = 2;
  string name = 3;
}

// Writer-admitted network-upgrade schedule bound to canonical store control.
// The revision increases each time the writer admits a changed table; the
// fingerprint is the V1 activation-table fingerprint of `activations`.
message CanonicalNetworkUpgradeSchedule {
  uint64 revision = 1;
  uint32 fingerprint_version = 2;
  bytes fingerprint = 3;
  // Ordered by activation height; same-height order is significant.
  repeated CanonicalNetworkUpgradeActivation activations = 4;
}

// Inclusive block-height range carried by one canonical transition.
message CanonicalEventBlockRange {
  uint32 start_height = 1;
  uint32 end_height = 2;
}

// Exact transition category in the retained canonical event log.
enum CanonicalRetainedEventKind {
  CANONICAL_RETAINED_EVENT_KIND_UNSPECIFIED = 0;
  CANONICAL_RETAINED_EVENT_KIND_COMMITTED = 1;
  CANONICAL_RETAINED_EVENT_KIND_REORGED = 2;
}

// One validated event returned in durable sequence order.
message CanonicalRetainedEvent {
  bytes cursor = 1;
  uint64 resulting_epoch_id = 2;
  optional uint64 previous_epoch_id = 3;
  CanonicalRetainedEventKind kind = 4;
  optional CanonicalEventBlockRange reverted_range = 5;
  CanonicalEventBlockRange committed_range = 6;
  // Exact authenticated canonical state produced by this event. This is
  // distinct from EventPage.writer_fence, which may describe a later event.
  CanonicalWriterFence resulting_fence = 7;
}

// Bounded page request. An empty cursor starts at the retention floor.
message CanonicalEventPageRequest {
  bytes from_cursor = 1;
  uint32 max_events = 2;
}

// Ordered retained events and the writer fence that bounded the page.
message CanonicalEventPageResponse {
  repeated CanonicalRetainedEvent events = 1;
  CanonicalWriterFence writer_fence = 2;
  uint64 oldest_retained_event_sequence = 3;
}

// Durable lease identity protecting one projection-construction anchor.
message CanonicalProjectionBuildLease {
  bytes lease_id = 1;
  uint64 anchor_chain_epoch_id = 2;
  bytes anchor_event_cursor = 3;
  uint64 expires_at_unix_millis = 4;
  uint64 generation = 5;
}

message AcquireCanonicalProjectionBuildLeaseRequest {
  CanonicalProjectionBuildLease lease = 1;
}

message RenewCanonicalProjectionBuildLeaseRequest {
  CanonicalProjectionBuildLease lease = 1;
}

message ReleaseCanonicalProjectionBuildLeaseRequest {
  CanonicalProjectionBuildLease lease = 1;
}

message CanonicalProjectionBuildLeaseResponse {
  CanonicalProjectionBuildLease lease = 1;
}

message ReleaseCanonicalProjectionBuildLeaseResponse {}

// An opaque block identifier carried in checkpoint admission evidence. Hash
// bytes use Zinder's native canonical block-hash byte order.
message CanonicalCheckpointBlockId {
  uint32 height = 1;
  bytes hash = 2;
}

// Authenticated replay prefix retained at the settled checkpoint of a
// cold-admitted canonical checkpoint.
message CanonicalCheckpointSequenceEvidence {
  CanonicalCheckpointBlockId through = 1;
  uint64 retained_block_count = 2;
  bytes sequence_digest = 3;
  uint64 logical_replay_bytes = 4;
}

// One validated predecessor frontier committed by a canonical build plan.
message CanonicalCheckpointFrontier {
  bytes final_root = 1;
  bytes final_state = 2;
}

// Typed predecessor checkpoint that seeds retained canonical history.
message CanonicalCheckpointHistoryPredecessor {
  CanonicalCheckpointBlockId block_id = 1;
  uint32 block_time_seconds = 2;
  CanonicalCheckpointFrontier sapling_frontier = 3;
  CanonicalCheckpointFrontier orchard_frontier = 4;
  CanonicalCheckpointFrontier ironwood_frontier = 5;
}

// Immutable canonical construction identity admitted from the checkpoint.
// This includes the exact activation table, retention boundary, predecessor,
// and fixed build tip; consumers need no pre-checkpoint status response to
// bind a state-bundle manifest to this canonical artifact.
message CanonicalOwnerCheckpointBuildPlanEvidence {
  uint32 activation_fingerprint_version = 1;
  bytes activation_fingerprint = 2;
  uint32 reorg_window_blocks = 3;
  CanonicalCheckpointBlockId history_preceding_checkpoint = 4;
  CanonicalCheckpointHistoryPredecessor history_predecessor = 5;
  CanonicalCheckpointBlockId build_tip = 6;
  // Exact persisted raw-blob retention: none, transactions, or all.
  string raw_blob_retention = 7;
}

// Complete READY evidence cold-read from one owner-created canonical
// checkpoint. This is intentionally evidence, not a filesystem handle or
// path: consumers pair independently owned checkpoint artifacts by the
// returned identity and authenticated canonical state.
message CanonicalOwnerCheckpointReadyEvidence {
  CanonicalCheckpointBlockId first_retained_block = 1;
  CanonicalWriterFence visible_fence = 2;
  uint32 block_digest_version = 3;
  uint32 replay_format_version = 4;
  uint32 sequence_digest_version = 5;
  uint64 visible_logical_replay_bytes = 6;
  CanonicalCheckpointSequenceEvidence sequence_checkpoint = 7;
  // Immutable fresh-build construction-manifest format bound into READY.
  uint32 construction_manifest_version = 8;
  // Domain-separated SHA-256 of the complete construction-manifest sidecar.
  bytes construction_manifest_sha256 = 9;
}

// Requests a canonical owner checkpoint by an opaque, operator-selected
// candidate id. The writer resolves this identifier below its configured
// checkpoint staging root; arbitrary filesystem paths are never accepted.
message CreateCanonicalOwnerCheckpointRequest {
  string candidate_id = 1;
  // SHA-256 of the canonical realpath of the shared staging root. This is an
  // opaque root-binding proof, not a path supplied by the client.
  bytes staging_root_binding = 2;
  // Exact writer fence the projector has authenticated against its wallet.
  // The owner queue refuses a checkpoint if the canonical primary advanced.
  CanonicalWriterFence expected_fence = 3;
}

// Cold-admitted canonical identity and READY evidence for one checkpoint.
// `candidate_id` names the operator-selected staging entry; it is not a path.
message CreateCanonicalOwnerCheckpointResponse {
  string candidate_id = 1;
  string store_identity = 2;
  uint32 schema_version = 3;
  string workload = 4;
  string network_name = 5;
  CanonicalOwnerCheckpointReadyEvidence ready_evidence = 6;
  CanonicalOwnerCheckpointBuildPlanEvidence build_plan = 7;
  // Exact RocksDB database identity cold-read from the physical checkpoint.
  // Consumers bind it into their manifest and use it for exact path
  // re-admission; it is opaque and is not filesystem authority.
  bytes database_identity = 8;
  // Admitted activation schedule cold-read from the physical checkpoint.
  CanonicalNetworkUpgradeSchedule network_upgrade_schedule = 9;
}

// Re-admits an already-created canonical owner checkpoint at the fixed child
// of an opaque staging candidate. The canonical owner resolves the path below
// its own configured staging root; callers cannot provide filesystem paths.
//
// The expected database identity and visible fence must be the exact values
// returned from CreateOwnerCheckpoint. The owner cold-opens the immutable
// checkpoint again and rejects any path, identity, or fence drift before a
// wallet checkpoint can be published.
message ReadmitCanonicalOwnerCheckpointRequest {
  string candidate_id = 1;
  // SHA-256 of the canonical realpath of the shared staging root. This is an
  // opaque root-binding proof, not a path supplied by the client.
  bytes staging_root_binding = 2;
  // Exact canonical visible fence returned by CreateOwnerCheckpoint.
  CanonicalWriterFence expected_fence = 3;
  // Exact RocksDB database identity returned by CreateOwnerCheckpoint.
  bytes expected_database_identity = 4;
}

// Canonical-writer operations needed by projectors and secondary readers.
// Every mutation is serialized by the canonical writer; clients never open a
// second primary handle to acquire leases or change event retention.
service CanonicalControl {
  rpc WriterStatus(CanonicalWriterStatusRequest) returns (CanonicalWriterStatusResponse);
  rpc EventPage(CanonicalEventPageRequest) returns (CanonicalEventPageResponse);
  rpc CreateOwnerCheckpoint(CreateCanonicalOwnerCheckpointRequest)
      returns (CreateCanonicalOwnerCheckpointResponse);
  rpc ReadmitOwnerCheckpoint(ReadmitCanonicalOwnerCheckpointRequest)
      returns (CreateCanonicalOwnerCheckpointResponse);
  rpc AcquireProjectionBuildLease(AcquireCanonicalProjectionBuildLeaseRequest)
      returns (CanonicalProjectionBuildLeaseResponse);
  rpc RenewProjectionBuildLease(RenewCanonicalProjectionBuildLeaseRequest)
      returns (CanonicalProjectionBuildLeaseResponse);
  rpc ReleaseProjectionBuildLease(ReleaseCanonicalProjectionBuildLeaseRequest)
      returns (ReleaseCanonicalProjectionBuildLeaseResponse);
}

// Requests a coherent, capture-only checkpoint bundle from the wallet
// projection owner. `candidate_id` is opaque: it is never interpreted as a
// filesystem path by the service.
message CreateStateBundleCaptureRequest {
  string candidate_id = 1;
}

// Identifies a state bundle that was fully captured and whose manifest was
// published last. Archive, restore, and serving-lane activation are outside
// this RPC's contract.
message CreateStateBundleCaptureResponse {
  string candidate_id = 1;
  string state_bundle_identity = 2;
  uint32 state_bundle_format_version = 3;
  string topology = 4;
  string network_name = 5;
  uint64 chain_epoch_id = 6;
  uint64 chain_event_sequence = 7;
  uint32 visible_tip_height = 8;
}

// Private, loopback-only owner control plane for the running wallet
// projector. It is deliberately separate from the public query and ops
// planes, and must authenticate every request with a bearer token.
service ProjectorControl {
  rpc CreateStateBundleCapture(CreateStateBundleCaptureRequest)
      returns (CreateStateBundleCaptureResponse);
}

// Private ingest control-plane RPCs for colocated read replicas.
service IngestControl {
  // Returns the writer's identity and capability set in the cross-service
  // ops.ServerInfo shape.
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse);

  // Returns the writer's latest committed chain epoch.
  rpc WriterStatus(WriterStatusRequest) returns (WriterStatusResponse);

  // Streams visible-tip chain-event history from the canonical writer.
  //
  // This private control stream exists so compatibility runtimes can observe
  // best-block changes without opening a source connection. Settled and
  // address-filtered streams belong to WalletQuery, not the writer control
  // plane.
  rpc VisibleChainEvents(zinder.v1.wallet.EventStreamStart) returns (stream zinder.v1.wallet.ChainEventEnvelope);

  // Returns a bounded snapshot of the writer's live mempool index.
  //
  // Secondary readers cannot observe the live in-process mempool index
  // through RocksDB-secondary catchup, so the wallet data plane proxies
  // mempool snapshots through this control RPC.
  rpc MempoolSnapshot(zinder.v1.wallet.MempoolSnapshotRequest) returns (zinder.v1.wallet.MempoolSnapshotResponse);

  // Returns one transaction from the writer's live mempool index. The
  // response uses the public wallet transaction-status shape so
  // `WalletQuery.Transaction` can preserve one location contract across
  // canonical and transient state without scanning a snapshot.
  rpc MempoolTransaction(MempoolTransactionRequest) returns (zinder.v1.wallet.TransactionStatusResponse);

  // Streams mempool events from the writer's mempool event log.
  rpc MempoolEvents(zinder.v1.wallet.MempoolEventsRequest) returns (stream zinder.v1.wallet.MempoolEventEnvelope);

  // Returns unmined transparent outputs that fund a transparent address.
  //
  // Secondary readers cannot observe the writer's live `MempoolIndex`
  // through RocksDB-secondary catchup, so the wallet data plane proxies
  // transparent-mempool point lookups through this control RPC.
  rpc TransparentMempoolOutputsByAddress(zinder.v1.wallet.TransparentMempoolOutputsByAddressRequest)
      returns (zinder.v1.wallet.TransparentMempoolOutputsByAddressResponse);

  // Returns the unmined spends of a batch of transparent outpoints, when
  // any are visible in the writer's live mempool index.
  rpc TransparentMempoolSpendsByOutpoint(zinder.v1.wallet.TransparentMempoolSpendsByOutpointRequest)
      returns (zinder.v1.wallet.TransparentMempoolSpendsByOutpointResponse);

  // Resolves a batch of outpoints against the writer's live mempool index.
  //
  // Used by chained-mempool flows: outpoints that reference outputs of
  // unconfirmed mempool transactions resolve here without a canonical-chain
  // round trip.
  rpc TransparentMempoolOutputsByOutpoint(zinder.v1.wallet.TransparentMempoolOutputsByOutpointRequest)
      returns (zinder.v1.wallet.TransparentOutputsByOutpointResponse);

  // Returns chain-wide value pool totals at the upstream node's tip by
  // calling `getblockchaininfo.valuePools`. The wallet data plane proxies
  // through this RPC because the wallet has no source handle.
  rpc ChainValuePoolsAtTip(zinder.v1.wallet.ChainValuePoolsAtTipRequest)
      returns (zinder.v1.wallet.ChainValuePoolsAtTipResponse);
}
