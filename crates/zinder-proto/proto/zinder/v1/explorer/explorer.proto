syntax = "proto3";

package zinder.v1.explorer;

import "zinder/v1/ops/server_info.proto";
import "zinder/v1/wallet/wallet.proto";

// Explorer-plane server descriptor returned by `ExplorerQuery.ServerInfo`.
//
// `common` carries the cross-service identity, capability set, and
// deprecation metadata defined in [`zinder.v1.ops.ServerInfo`]. The
// remaining fields describe the Explorer view plane.
message ExplorerServerInfo {
  // Cross-service identity and capability descriptor.
  zinder.v1.ops.ServerInfo common = 1;

  // Service vendor, always "Zinder".
  string vendor = 2;

  // Materialized-view plane health: whether the queryable views are live with the
  // canonical tip, catching up, or paused. Lets an operator distinguish a
  // transient catch-up from a stalled materialized-view plane without scraping metrics.
  // Absent until the ingest plane writes its first status record. See
  // `zinder.v1.wallet.MaterializedViewStatus`.
  optional zinder.v1.wallet.MaterializedViewStatus materialized_view_status = 3;

  // Consumer identities of the admitted Explorer view store. Empty when no
  // view store is admitted. Order is not significant; compare as a set.
  repeated string materialized_view_identities = 4;
}

// Server descriptor request.
message ServerInfoRequest {}

// Server descriptor response.
//
// Carries the standard `ExplorerFreshness` envelope per
// [ADR-0011](../../../../../docs/adrs/0011-explorer-freshness-envelope.md)
// so consumers can read the upstream tip and capability versions from any
// explorer response, including the bootstrap call. Without this, the upstream
// tip (which rides on `ExplorerFreshness.chain_view.upstream_tip`) would only
// be reachable through materialized-view-backed endpoints that are capability-gated and
// unavailable during `bulk_catchup`, leaving sync-progress UIs unable to
// compute an honest denominator at exactly the moment they most need it.
message ServerInfoResponse {
  ExplorerFreshness freshness = 1;
  ExplorerServerInfo info = 2;
}

// Per-field unavailability with structured reason and canonical text.
//
// Carried in `ExplorerFreshness.unavailable` so consumers can branch on
// the structured `reason` or render `human_reason` verbatim. The reason
// string comes from the canonical registry in
// `crates/zinder-core/src/explorer_reasons.rs`; the contract is defined in
// [ADR-0011](../../../../../docs/adrs/0011-explorer-freshness-envelope.md).
message UnavailableField {
  // Dotted path matching the response field hierarchy, e.g.
  // `fee.computed.zip317_conventional_zat`.
  string field_path = 1;

  // Structured reason the field is absent.
  UnavailableReason reason = 2;

  // Canonical human-readable reason a UI can render verbatim.
  string human_reason = 3;
}

// Coarse classification of why an explorer field is absent.
enum UnavailableReason {
  UNAVAILABLE_REASON_UNSPECIFIED = 0;

  // Shielded by design; the value is private, not missing.
  UNAVAILABLE_PRIVATE_BY_DESIGN = 1;

  // Computation depends on prevouts that could not be resolved.
  UNAVAILABLE_PREVOUTS_MISSING = 2;

  // An upstream dependency does not expose the fact this field needs.
  UNAVAILABLE_UPSTREAM_NOT_SUPPORTED = 3;

  // The derived index does not yet contain this entity.
  UNAVAILABLE_NOT_INDEXED = 4;

  // Derived index is too far behind canonical to answer this view.
  UNAVAILABLE_STALE = 5;

  // The transaction includes sections the parser cannot decode.
  UNAVAILABLE_PARSER_VERSION_UNSUPPORTED = 6;
}

// Explorer response metadata that varies per call, carried at field tag 1 on
// every `ExplorerQuery` response.
//
// The chain-state axes (epoch, tips, upstream, materialized views) live on
// `chain_view`; this message keeps only the metadata that genuinely varies
// per call. Defined in
// [ADR-0011](../../../../../docs/adrs/0011-explorer-freshness-envelope.md);
// every `ExplorerQuery` RPC's response carries this field tag 1 first so
// consumers can read `response.freshness` unconditionally.
message ExplorerFreshness {
  // Cross-plane chain-state envelope the response was produced from.
  zinder.v1.wallet.ChainView chain_view = 1;

  // Milliseconds since the current mempool source generation was certified;
  // zero for responses that do not touch mempool state.
  uint64 snapshot_age_millis = 2;

  // The capability string that produced this response. Lets clients branch
  // on which `_vN` was used to construct the response shape.
  string capability_version = 5;

  // Field-path-keyed unavailability entries.
  repeated UnavailableField unavailable = 6;

}

// Coarse transaction-format identifier.
//
// `effective_version` carries the integer version from
// [ZIP-225](https://zips.z.cash/zip-0225). `version_group_id` carries the
// raw `nVersionGroupId` for v3/v4/v5+ transactions. The discrete `kind`
// arm lets clients switch on a closed enum without parsing the integer.
enum TransactionVersionKind {
  TRANSACTION_VERSION_KIND_UNSPECIFIED = 0;
  TRANSACTION_VERSION_KIND_V1 = 1;
  TRANSACTION_VERSION_KIND_V2 = 2;
  TRANSACTION_VERSION_KIND_V3 = 3;
  TRANSACTION_VERSION_KIND_V4 = 4;
  TRANSACTION_VERSION_KIND_V5 = 5;
  TRANSACTION_VERSION_KIND_UNSUPPORTED = 6;
  TRANSACTION_VERSION_KIND_V6 = 7;
}

// Transaction-format identifier carried on the explorer wire.
message TransactionVersion {
  TransactionVersionKind kind = 1;
  uint32 effective_version = 2;
  optional uint32 version_group_id = 3;
}

// Coarse privacy classification computed by
// `zinder_core::classify_privacy_shape`.
enum PrivacyShape {
  PRIVACY_SHAPE_UNSPECIFIED = 0;
  PRIVACY_SHAPE_TRANSPARENT_ONLY = 1;
  PRIVACY_SHAPE_SHIELDING = 2;
  PRIVACY_SHAPE_DESHIELDING = 3;
  PRIVACY_SHAPE_SHIELDED_ONLY = 4;
  PRIVACY_SHAPE_MIXED = 5;
  PRIVACY_SHAPE_COINBASE = 6;
  PRIVACY_SHAPE_SHIELDED_COINBASE = 7;
  PRIVACY_SHAPE_UNCLASSIFIED = 8;
}

// Transaction lock-time classification.
//
// Mirrors `zinder_core::LockTime`: explicit `unlocked` marker, height-based
// lock time, or Unix-seconds lock time. The oneof is closed; clients
// switch on the present arm.
message LockTime {
  oneof kind {
    LockTimeUnlocked unlocked = 1;
    uint32 height = 2;
    uint64 unix_seconds = 3;
  }
}

// Discrete marker for the "no lock-time constraint" case.
message LockTimeUnlocked {}

// Component counts feeding the privacy classifier and the wire surface.
message TransactionComponentCounts {
  uint32 transparent_input_count = 1;
  uint32 transparent_output_count = 2;
  uint32 sapling_spend_count = 3;
  uint32 sapling_output_count = 4;
  uint32 orchard_action_count = 5;
  uint32 sprout_joinsplit_count = 6;
  uint32 ironwood_action_count = 7;
}

// Single typed value carrying every public fact the explorer renders for a
// transaction.
//
// Parsed once by `zinder_source::parse_transaction_public_facts` from raw
// transaction bytes plus the node-discovered network upgrade table per
// [ADR-0010](../../../../../docs/adrs/0010-transaction-public-facts.md).
message TransactionPublicFacts {
  // Canonical Zcash transaction identifier in RPC byte order (64 lowercase
  // hex characters; the form `zcash-cli`, every wallet UI, and every block
  // explorer display).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // ZIP-244 authorization digest in RPC byte order (64 lowercase hex
  // characters). Empty for v1-v4 transactions, which have no distinct
  // authorization digest.
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string auth_digest = 2;

  // ZIP-239 witness identifier in RPC byte order: 128 lowercase hex
  // characters, the concatenation of the RPC-form `txid` (64 chars) and
  // the RPC-form `auth_digest` (64 chars). Empty for v1-v4 where wtxid
  // equals txid by definition.
  // References: ZIP 239; Zcash protocol spec term `\rpcByteOrder`.
  string wtxid = 3;

  // Coarse transaction-format identifier.
  TransactionVersion version = 4;

  // Consensus branch ID in the canonical 8-character lowercase hex form
  // (per the BIP70 / Zebra convention). Empty when not applicable (v1/v2).
  string consensus_branch_id_hex = 5;

  // Lock-time classification.
  LockTime lock_time = 6;

  // [ZIP-203](https://zips.z.cash/zip-0203) `nExpiryHeight` when present and
  // non-sentinel. Zero/unset means the transaction has no expiry.
  uint32 expiry_height = 7;

  // Raw transaction byte length.
  uint32 size_bytes = 8;

  // Component counts (transparent / Sapling / Orchard / Sprout).
  TransactionComponentCounts counts = 9;

  // Coarse privacy classification.
  PrivacyShape privacy_shape = 10;

  // `true` when the transaction is a coinbase row.
  bool is_coinbase = 11;
}

// Classification of a transaction's transparent prevout resolution state.
//
// `TransactionFeesConsumer` writes `RESOLVED` when every transparent input
// has a known prevout value in the hydrated canonical spend facts, `PARTIAL`
// when at least one is missing, and `UNAVAILABLE` when the committed block
// carried no hydrated spend facts for the transaction.
enum PrevoutResolutionStatus {
  PREVOUT_RESOLUTION_STATUS_UNSPECIFIED = 0;
  PREVOUT_RESOLUTION_STATUS_RESOLVED = 1;
  PREVOUT_RESOLUTION_STATUS_PARTIAL = 2;
  PREVOUT_RESOLUTION_STATUS_UNAVAILABLE = 3;
}

// Whether a transparent-address value event credits or debits the address.
//
// `RECEIVED` is a transparent output paying the address: the signed
// `value_zat` is positive and `index` is the output index. `SPENT` is a
// transparent input consuming one of the address's prior outputs: the
// signed `value_zat` is negative and `index` is the input index.
enum TransparentDeltaKind {
  TRANSPARENT_DELTA_KIND_UNSPECIFIED = 0;
  TRANSPARENT_DELTA_KIND_RECEIVED = 1;
  TRANSPARENT_DELTA_KIND_SPENT = 2;
}

// Storage-only per-input transparent prevout value materialized by
// `TransactionFeesConsumer`.
//
// This record deliberately excludes the prevout script: fee materialized-view rows
// need only the value, while `TransactionDetail` resolves the complete prevout
// from retained canonical parent facts at request time.
message TransparentInputValueRecord {
  uint32 input_index = 1;
  optional uint64 value_zat = 2;
}

// One ordered transparent input carried by `TransactionDetail`.
//
// `spent_outpoint` identifies the output consumed by this input. `value_zat`
// and `script_pub_key` are independently optional: retained parent facts can
// recover both, while a persisted fee row may preserve the value
// after the parent script is unavailable. Absence must not be interpreted as a
// zero value or an empty script. Shielded spends are not represented because
// their values and receivers are encrypted by protocol.
message TransparentInput {
  uint32 input_index = 1;
  zinder.v1.wallet.OutPoint spent_outpoint = 2;
  optional uint64 value_zat = 3;
  optional bytes script_pub_key = 4;
}

// One ordered transparent output carried by `TransactionDetail`.
//
// `output` contains the intrinsic value and scriptPubKey created by this
// transaction. `spent_by` is populated only when a canonical transaction has
// consumed the outpoint at the response's chain epoch; absence means unspent
// on that canonical chain. Mempool spends remain a separate wallet-plane
// relation and do not change this field.
message TransparentOutput {
  uint32 output_index = 1;
  zinder.v1.wallet.TransparentOutput output = 2;
  zinder.v1.wallet.TransparentSpend spent_by = 3;
}

// `ExplorerQuery.TransactionDetail` request.
//
// `at_epoch_id` optionally pins the read to a specific chain epoch so the
// response stays consistent with a concurrent caller's other reads.
message TransactionDetailRequest {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters; the form callers paste from a wallet or block explorer).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  optional uint64 at_epoch_id = 2;
}

// `ExplorerQuery.TransactionDetail` response.
//
// Carries the cross-cutting freshness envelope plus the parsed public
// facts, the shared transaction-location discriminator, and raw
// transaction bytes so consumers can keep parsed and raw forms together
// (per the PRD's user story 16).
//
// `location` is the same `zinder.v1.wallet.TransactionLocation` oneof
// `WalletQuery.Transaction` returns, so a consumer writes one match shape
// for both surfaces.
//
// `transparent_inputs` is populated for mined transactions from retained raw
// bytes plus projected fee rows. Each entry combines input identity and
// optional prevout resolution so callers do not have to correlate parallel
// arrays. Library compositions with a canonical secondary may merge values and
// scripts recovered from retained parent facts. `prevout_resolution_status`
// and `paid_fee_zat` remain fee materialized-view fields advertised by
// `EXPLORER_TRANSACTION_FEES_V1`.
// `paid_fee_zat` additionally requires `facts.privacy_shape ==
// TRANSPARENT_ONLY`; shielded and unclassified transactions omit it because
// canonical facts do not retain the value balances needed to prove their
// actual fee. Consumers fall back to
// `TransactionPublicFacts.counts.zip317_conventional_fee_zat` when absent.
//
// `transparent_inputs` and `transparent_outputs` are ordered public facts for
// mined and mempool transactions. Mined inputs may carry retained parent values
// and scripts; mempool inputs carry their transaction-local index and outpoint
// without implying prevout resolution. Outputs always carry their intrinsic
// value and script. Only mined outputs may carry a canonical `spent_by` relation;
// mempool-spend state remains a separate wallet-plane relation. Addresses remain
// an edge concern derived from standard scripts; Zinder returns scriptPubKey bytes.
//
// `intrinsic_value_balances` is populated only for mined transactions when
// the canonical artifact or retained transaction blob is available at the
// response's pinned chain epoch. Absence is distinct from an all-zero balance.
message TransactionDetailResponse {
  ExplorerFreshness freshness = 1;
  TransactionPublicFacts facts = 2;
  zinder.v1.wallet.TransactionLocation location = 3;
  optional uint64 paid_fee_zat = 5;
  PrevoutResolutionStatus prevout_resolution_status = 6;
  repeated TransparentInput transparent_inputs = 7;
  repeated TransparentOutput transparent_outputs = 9;
  TransactionIntrinsicValueBalances intrinsic_value_balances = 10;
}

// Compact summary of one canonical block.
//
// Materialized once at materialization time and read back by both
// `ExplorerQuery.BlockSummariesInRange` (materialized view) and
// `ExplorerQuery.BlockDetail` (full record). See
// [Explorer plane §Block view shape](../../../../../docs/architecture/explorer-plane.md#block-view-shape).
message BlockSummary {
  // Canonical block height.
  uint32 block_height = 1;

  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string block_hash = 2;

  // `nTime` from the block header.
  int64 block_time_unix_seconds = 3;

  // Number of transactions in the block, including the coinbase.
  uint32 transaction_count = 4;

  // Previous block hash in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string previous_block_hash = 5;

  // Complete serialized block byte length, including the block header,
  // transaction-count encoding, and every transaction. Materialized by
  // `BlockSummaryConsumer` at commit time so the recent-blocks listing
  // renders block size without re-fetching the block.
  uint64 total_size_bytes = 6;

  // Sum of `zip317_conventional_fee_zat` across every non-coinbase
  // transaction in the block. ZIP-317 conventional floor; the actual
  // paid-fee sum is in `paid_fees_collected_zat` and only populated when
  // the `TransactionFeesConsumer` has resolved every transparent input.
  uint64 fees_collected_zat = 7;

  // Sum of actual paid fees across every non-coinbase transaction, when
  // every transparent input could be resolved through the wallet plane's
  // prevout index. Absent when at least one transaction is missing prevout
  // values; consumers fall back to `fees_collected_zat`.
  optional uint64 paid_fees_collected_zat = 8;

  // Sum of transparent coinbase outputs, in zatoshis. Shielded coinbase
  // outputs are not included because `BlockSummaryConsumer` currently
  // materializes only transparent output values.
  uint64 coinbase_reward_zat = 9;

  // Sum of Sapling output counts across every transaction in the block.
  // Useful for tracking shielded-protocol throughput per block.
  uint32 sapling_output_count = 10;

  // Sum of Orchard action counts across every transaction in the block.
  uint32 orchard_action_count = 11;

  // Distance from this block to the canonical tip at response time.
  // `1` when this block IS the tip, `2` for the block before, and so on.
  // Computed at request time from
  // `WalletQuery.VisibleTipBlock.visible_tip_block.height - block_height + 1`; not
  // stored in the materialized-view column family.
  uint32 confirmations = 12;

  // True when this block is part of the canonical best chain at response
  // time. False during a rolling reorg window when the block has been
  // rewound but not yet replaced by a heavier chain. Computed at request
  // time; consumers render an "orphaned" badge when false.
  bool is_canonical = 13;

  // Sum of Ironwood action counts across every transaction in the block.
  uint32 ironwood_action_count = 14;
}

// Materialized storage record for the `BlockSummary` materialized view.
//
// Not exposed by any RPC. Encoded once at materialization time and read back by
// both `ExplorerQuery.BlockSummariesInRange` (projecting `summary`) and
// `ExplorerQuery.BlockDetail` (emitting `summary` plus `transaction_ids`).
// One record per canonical block, keyed by big-endian block height inside
// the consumer's `block_summary` column family.
message BlockSummaryRecord {
  BlockSummary summary = 1;
  // Transaction ids in canonical block order (each entry is 64 lowercase
  // hex characters in RPC byte order). The leading entry is the coinbase.
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  repeated string transaction_ids = 2;
  // Number of non-coinbase transactions in this block.
  uint32 fee_transaction_count = 3;
  // Smallest ZIP-317 conventional fee floor among non-coinbase transactions,
  // zero when the block has no non-coinbase transactions.
  uint64 min_zip317_conventional_fee_zat = 4;
  // Largest ZIP-317 conventional fee floor among non-coinbase transactions,
  // zero when the block has no non-coinbase transactions.
  uint64 max_zip317_conventional_fee_zat = 5;
}

// `ExplorerQuery.BlockSummariesInRange` request.
//
// Returns one `BlockSummary` per canonical block in
// `[start_height, end_height]` inclusive, ordered by ascending height.
message BlockSummariesInRangeRequest {
  // First block height to return (inclusive).
  uint32 start_height = 1;

  // Last block height to return (inclusive).
  uint32 end_height = 2;

  // Optional chain-epoch id pin for snapshot consistency with concurrent reads.
  optional uint64 at_epoch_id = 3;
}

// `ExplorerQuery.BlockSummariesInRange` response.
message BlockSummariesInRangeResponse {
  ExplorerFreshness freshness = 1;
  repeated BlockSummary summaries = 2;
}

// One canonical block-production observation.
//
// `summary` carries the reusable transaction, fee, size, reward, and component
// facts already exposed by `BlockSummariesInRange`. `bits` adds the compact
// difficulty target from the canonical block header. Consumers can derive
// difficulty, inter-block intervals, and rolling production rates without
// requiring a second per-height header lookup.
message BlockProductionPoint {
  BlockSummary summary = 1;

  // Compact difficulty target (`nBits`) from the canonical block header.
  // This is the same unsigned integer exposed as
  // `zinder.v1.wallet.BlockHeader.bits`.
  uint32 bits = 2;

  // Canonical coinbase facts when the transaction fact artifact is retained.
  // Absence means the canonical fact is unavailable; a present summary with
  // no transparent outputs is a valid shielded-only coinbase. Address and pool
  // attribution remain product-edge concerns.
  CoinbaseTransactionSummary coinbase = 3;
}

// Public facts for the canonical coinbase transaction of one production point.
message CoinbaseTransactionSummary {
  // Canonical transaction id in RPC byte order.
  string transaction_id = 1;

  // Intrinsic transparent coinbase outputs in ascending output-index order.
  repeated zinder.v1.wallet.TransparentOutput transparent_outputs = 2;

  // True when the coinbase also creates Sapling, Orchard, Ironwood, or Sprout
  // shielded outputs. Absent when unsupported transaction sections prevent a
  // complete classification. Shielded values and receivers remain encrypted.
  optional bool has_shielded_outputs = 3;
}

// `ExplorerQuery.BlockProductionSeries` request.
//
// Returns points over the inclusive height range `[start_height, end_height]`.
// The range is bounded server-side. `at_epoch_id` optionally pins canonical
// header visibility to one chain epoch; materialized-view rows are joined only when their
// block hash and time agree with that canonical header.
message BlockProductionSeriesRequest {
  uint32 start_height = 1;
  uint32 end_height = 2;
  optional uint64 at_epoch_id = 3;
}

// `ExplorerQuery.BlockProductionSeries` response.
//
// Points are ordered by ascending block height. `covered_block_count` counts
// heights where both the block-summary row and canonical header were present
// and agreed. `missing_block_count` makes partial local retention, view lag,
// and concurrent reorg mismatches explicit instead of emitting fabricated
// zero-valued observations.
message BlockProductionSeriesResponse {
  ExplorerFreshness freshness = 1;
  uint32 start_height = 2;
  uint32 end_height = 3;
  uint32 covered_block_count = 4;
  uint32 missing_block_count = 5;
  repeated BlockProductionPoint points = 6;
}

// `ExplorerQuery.BlockProductionInTimeRange` request.
//
// Returns a bounded page of canonical block-production observations whose
// header timestamps are in `[start_time_unix_seconds, end_time_unix_seconds)`.
// Points are ordered by `(block_time, block_height, block_hash)`, so equal and
// non-monotonic timestamps remain deterministic. The cursor binds the time
// bounds, resolved chain epoch, and materialized-view revision so every page
// reads one canonical/materialized-view fence.
message BlockProductionInTimeRangeRequest {
  // Inclusive Unix timestamp lower bound.
  int64 start_time_unix_seconds = 1;

  // Exclusive Unix timestamp upper bound.
  int64 end_time_unix_seconds = 2;

  // Maximum canonical block candidates scanned for this page. Zero selects the
  // server default; values above the server cap are clamped. A candidate with
  // missing or mismatched production facts still consumes this bound.
  uint32 max_entries = 3;

  // Empty starts at the first canonical candidate in the time range. Non-empty
  // resumes strictly after the previous page's last scanned candidate. The
  // cursor is opaque and is bound to the time bounds and chain epoch.
  bytes from_cursor = 4;

  // Optional chain-epoch read fence. Absent on the first page resolves to the
  // visible epoch; later pages reuse the epoch encoded by `from_cursor`.
  optional uint64 at_epoch_id = 5;
}

// `ExplorerQuery.BlockProductionInTimeRange` response.
//
// `covered_block_count` and `missing_block_count` describe the canonical
// candidates scanned for this page. A covered candidate has a matching
// canonical header and block-summary row and yields one point. A missing
// candidate has incomplete or mismatched production facts and yields no
// fabricated point. Their sum is the number of candidates scanned.
message BlockProductionInTimeRangeResponse {
  ExplorerFreshness freshness = 1;
  repeated BlockProductionPoint points = 2;
  bytes next_cursor = 3;
  uint32 covered_block_count = 4;
  uint32 missing_block_count = 5;
  uint32 missing_coinbase_count = 6;
  uint32 missing_paid_fee_count = 7;
  BlockProductionTimeRangeCoverage coverage = 8;
  BlockProductionTimeRangeReadFence read_fence = 9;
}

// Durable and request-specific coverage for a production-time query.
message BlockProductionTimeRangeCoverage {
  optional uint32 complete_from_height = 1;
  optional uint32 complete_through_height = 2;
  optional int64 complete_from_time_unix_seconds = 3;
  optional int64 complete_through_time_unix_seconds = 4;
  bool requested_range_complete = 5;
}

// Materialized-view identity bound into every continuation cursor.
message BlockProductionTimeRangeReadFence {
  uint64 chain_epoch_id = 1;
  uint64 materialized_view_revision = 2;
  zinder.v1.wallet.BlockTip materialized_view_tip = 3;
}

// `ExplorerQuery.BlockActivityDistribution` request.
//
// Aggregates the existing materialized block-summary rows over the inclusive
// height range `[start_height, end_height]`. The range is bounded server-side;
// consumers that need longer-lived history must request an explicit durable
// materialized view rather than treating this request-time aggregate as unbounded.
message BlockActivityDistributionRequest {
  uint32 start_height = 1;
  uint32 end_height = 2;
}

// One fixed weekday/hour activity bucket.
//
// `weekday` follows the PostgreSQL and JavaScript convention: Sunday is zero,
// Monday is one, through Saturday at six. Rows are ordered by weekday then
// hour and include zero-valued buckets so consumers never need to synthesize a
// missing grid cell.
message BlockActivityBucket {
  uint32 weekday = 1;
  uint32 hour = 2;
  uint64 transaction_count = 3;
  uint32 block_count = 4;
}

// `ExplorerQuery.BlockActivityDistribution` response.
//
// The response reports the requested height range separately from the number
// of materialized rows read. A nonzero `missing_block_count` means the materialized view
// store does not cover the entire requested range, so a caller must present
// the returned window as partial rather than a complete history.
message BlockActivityDistributionResponse {
  ExplorerFreshness freshness = 1;
  uint32 start_height = 2;
  uint32 end_height = 3;
  uint32 materialized_block_count = 4;
  uint32 missing_block_count = 5;
  optional int64 first_block_time_unix_seconds = 6;
  optional int64 last_block_time_unix_seconds = 7;
  uint64 transaction_count = 8;
  repeated BlockActivityBucket buckets = 9;
}

// `ExplorerQuery.BlockDetail` request.
//
// Either `block_height` or `block_hash` resolves the target block. Hash
// lookups consult the upstream wallet plane's
// `WalletQuery.BlockIdBySelector` indirection so the materialized-view store keeps a
// single height-keyed schema.
message BlockDetailRequest {
  oneof selector {
    uint32 block_height = 1;
    // Canonical block hash in RPC byte order (64 lowercase hex
    // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
    string block_hash = 2;
  }

  // Optional chain-epoch id pin for snapshot consistency with concurrent reads.
  optional uint64 at_epoch_id = 3;
}

// `ExplorerQuery.BlockDetail` response.
//
// Carries the `BlockSummary` plus the canonical-ordered transaction ids the
// block committed. Clients render per-transaction rows by calling
// `ExplorerQuery.TransactionDetail` with each id; the v1 surface keeps
// per-transaction data out of the block-detail wire shape to avoid the
// fan-out cost of parsing every transaction at request time.
message BlockDetailResponse {
  ExplorerFreshness freshness = 1;
  BlockSummary summary = 2;

  // Transaction ids in canonical block order (each entry is 64 lowercase
  // hex characters in RPC byte order). The leading entry is the coinbase.
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  repeated string transaction_ids = 3;
}

// One public transaction row in `ExplorerQuery.BlockTransactions`.
//
// `transaction_id` and `transaction_index` are always present because they
// come from the materialized canonical block record. `public_facts` is absent
// when a deployment has no canonical fact artifact for that transaction; an
// absent message is unavailable data, never an all-zero transaction. The
// transparent outputs are in ascending output-index order. Shielded output
// values are encrypted and are intentionally not represented here.
message BlockTransaction {
  // Zero-based position in canonical block order. The leading row is the
  // coinbase transaction.
  uint32 transaction_index = 1;

  // Canonical transaction id in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 2;

  // Parsed public facts, when the canonical fact artifact is retained.
  TransactionPublicFacts public_facts = 3;

  // Transparent outputs in ascending output-index order. The index is the
  // zero-based position in this array; each entry carries its amount and raw
  // scriptPubKey but no inferred address label.
  repeated zinder.v1.wallet.TransparentOutput transparent_outputs = 4;


  // Transparent inputs in ascending input-index order. Each entry identifies
  // the spent outpoint and independently carries its retained value and
  // scriptPubKey when the parent transaction fact is available. Missing parent
  // facts remain absent, never zero or an empty script. Address decoding stays
  // at the product edge.
  repeated TransparentInput transparent_inputs = 6;
}

// `ExplorerQuery.BlockTransactions` response.
//
// A page-ready bounded aggregate over the existing canonical block and
// transaction-fact artifacts. This is deliberately separate from
// `BlockDetail`: callers needing only ids avoid output-script payloads, while
// explorer pages avoid one `TransactionDetail` RPC per row.
message BlockTransactionsResponse {
  ExplorerFreshness freshness = 1;
  BlockSummary summary = 2;
  repeated BlockTransaction transactions = 3;

  // Final post-block note-commitment-tree roots when the canonical artifact is
  // available for this height. Individual roots remain absent before their
  // protocol activates; an absent enclosing message means this height has not
  // yet been enriched.
  BlockFinalNoteCommitmentRoots final_note_commitment_roots = 4;
}

// Final note-commitment-tree roots after one block.
//
// Bytes retain the same order Zebra emits through
// `z_gettreestate.*.commitments.finalRoot`; hex-encoding them produces the
// root string used by `CommitmentRootSearch` and explorer UIs.
message BlockFinalNoteCommitmentRoots {
  optional bytes sapling = 1;
  optional bytes orchard = 2;
  optional bytes ironwood = 3;
}

// Per-arm privacy refusal payload returned for shielded receivers,
// viewing keys, and shielded receivers within a unified address.
//
// The structured `reason` lets the UI branch on the refusal class while
// `human_reason` carries a canonical sentence the UI may render verbatim.
// `canonical_form` echoes the classified input when echoing is safe
// (e.g. a Sapling-encoded shielded address); it is omitted for viewing
// keys, where echoing would be a privacy regression.
message NotPubliclyIndexable {
  NotPubliclyIndexableReason reason = 1;
  string human_reason = 2;
  optional string canonical_form = 3;
}

// Discrete reason classes the explorer refuses public history for.
enum NotPubliclyIndexableReason {
  NOT_PUBLICLY_INDEXABLE_REASON_UNSPECIFIED = 0;

  // The input decoded as a shielded address (Sapling, Orchard, Sprout)
  // but the classifier could not narrow the network.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_ADDRESS = 1;

  // The input decoded as a viewing key (UIVK, UFVK, Sapling extended
  // viewing key). Echoing the key in the response would itself be a
  // privacy regression, so `canonical_form` is omitted.
  NOT_PUBLICLY_INDEXABLE_REASON_VIEWING_KEY = 2;

  // The receiver inside a unified address is shielded. The enclosing
  // `UnifiedAddressMatch` may still route transparent receivers from the
  // same input.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_RECEIVER_IN_UNIFIED = 3;

  // The input decoded as a mainnet shielded address (Sapling `zs1...`,
  // Orchard, or Sprout). Lets the consumer render network-specific help
  // text without inferring the network from the canonical form.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_ADDRESS_MAINNET = 4;

  // The input decoded as a testnet or regtest shielded address (Sapling
  // `zs1testsapling...` / `zregtestsapling...`, Orchard, or Sprout
  // testnet form). Distinguishes from `MAINNET` so the consumer can warn
  // a user that they may have switched networks.
  NOT_PUBLICLY_INDEXABLE_REASON_SHIELDED_ADDRESS_TESTNET = 5;

  // The input decoded as a [ZIP-316](https://zips.z.cash/zip-0316)
  // unified address whose receiver list contains no transparent
  // receiver. The address itself is valid but the explorer cannot route
  // it to a transparent-history page; there is nothing publicly indexable
  // to look up.
  NOT_PUBLICLY_INDEXABLE_REASON_UNIFIED_ADDRESS_NO_TRANSPARENT_RECEIVER = 6;
}

// Block candidate produced when the input parses as a height or a
// 32-byte block hash that the upstream wallet confirms.
message BlockMatch {
  // Canonical block height of the resolved block.
  uint32 block_height = 1;

  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string block_hash = 2;
}

// Transaction candidate produced when the input parses as a 32-byte
// transaction id that the upstream wallet confirms.
//
// Mined transactions carry block-context fields; mempool transactions
// populate only the transaction id.
message TransactionMatch {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // True when the transaction is currently in the mempool.
  bool in_mempool = 2;

  // Populated when the transaction is mined; zero for mempool entries.
  uint32 mined_block_height = 3;

  // Mined block hash in RPC byte order (64 lowercase hex characters) when
  // the transaction is mined; empty for mempool entries.
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string mined_block_hash = 4;
}

// Transparent (P2PKH or P2SH) address candidate.
//
// The classifier verifies that the input parses as a valid Zcash
// transparent address on the configured network; existence of on-chain
// history is not asserted.
message TransparentAddressMatch {
  // Canonical base58check form of the address.
  string canonical_form = 1;

  // SHA-256 of the canonical scriptPubKey, in 32-byte form. Matches the
  // `script_hash` selector accepted by every transparent-address request.
  bytes address_script_hash = 2;

  // True for P2PKH; false for P2SH.
  bool is_p2pkh = 3;
}

// ZIP-320 TEX address candidate.
//
// The classifier extracts the underlying P2PKH hash and re-encodes
// both the canonical `tex1.../textest1...` form and the equivalent
// `t1.../tm...` P2PKH form so the UI can link directly to the
// transparent-address page.
message TexAddressMatch {
  // Canonical Bech32m `tex1.../textest1...` form.
  string canonical_tex_form = 1;

  // Equivalent `t1.../tm...` P2PKH form that drives indexable history.
  string equivalent_p2pkh_form = 2;

  // Routable transparent match the UI can link to for history.
  TransparentAddressMatch transparent = 3;

  // Always `true`: TEX addresses constrain the sender to transparent
  // inputs only; on-chain the output is indistinguishable from the
  // underlying P2PKH.
  bool transparent_source_only = 4;

  // Canonical reason a UI may render verbatim.
  string spend_side_note = 5;
}

// ZIP-316 unified address candidate.
//
// The classifier decodes the receiver typecodes and surfaces each
// receiver as its own routing hint; transparent receivers carry a
// `TransparentAddressMatch`, while shielded receivers carry the typed
// `NotPubliclyIndexable` refusal.
message UnifiedAddressMatch {
  // Original Bech32m encoding of the input.
  string canonical_form = 1;

  // Network the unified address belongs to ("zcash-mainnet",
  // "zcash-testnet", "zcash-regtest"), matching the wire vocabulary in
  // `zinder.v1.ops.ServerInfo.network`.
  string network = 2;

  // One entry per ZIP-316 receiver typecode present in the unified
  // address, in the order declared by the encoding.
  repeated UnifiedAddressReceiver receivers = 3;
}

// Per-receiver routing inside a unified address.
message UnifiedAddressReceiver {
  UnifiedAddressReceiverKind kind = 1;
  oneof body {
    TransparentAddressMatch transparent = 2;
    NotPubliclyIndexable shielded = 4;
  }
}

// ZIP-316 receiver typecodes the classifier recognizes.
enum UnifiedAddressReceiverKind {
  UNIFIED_ADDRESS_RECEIVER_KIND_UNSPECIFIED = 0;

  // P2PKH transparent receiver (typecode 0x00).
  UNIFIED_ADDRESS_RECEIVER_KIND_P2PKH = 1;

  // P2SH transparent receiver (typecode 0x01).
  UNIFIED_ADDRESS_RECEIVER_KIND_P2SH = 2;

  // Sapling shielded receiver (typecode 0x02).
  UNIFIED_ADDRESS_RECEIVER_KIND_SAPLING = 3;

  // Orchard shielded receiver (typecode 0x03).
  UNIFIED_ADDRESS_RECEIVER_KIND_ORCHARD = 4;

  // Receiver typecode the classifier does not recognize. The receiver
  // body carries a `NotPubliclyIndexable` shape with
  // `UNAVAILABLE_PARSER_VERSION_UNSUPPORTED` semantics.
  UNIFIED_ADDRESS_RECEIVER_KIND_UNKNOWN = 5;
}

// Shielded-address candidate. The classifier always routes this arm
// through `NotPubliclyIndexable`; no storage call is ever issued.
message ShieldedAddressMatch {
  NotPubliclyIndexable not_publicly_indexable = 1;
}

// Viewing-key candidate. The classifier never echoes the key bytes,
// because doing so on the response surface would itself be a privacy
// regression even when the server never persists the key.
message ViewingKeyMatch {
  NotPubliclyIndexable not_publicly_indexable = 1;
}

// Catch-all candidate when no other arm classifies the input.
message UnclassifiedMatch {
  // Operator-readable hint explaining what the classifier expected.
  string hint = 1;
}

// One classified search candidate. Exactly one `match` arm is populated.
message SearchCandidate {
  oneof match {
    BlockMatch block = 1;
    TransactionMatch transaction = 2;
    TransparentAddressMatch transparent_address = 3;
    TexAddressMatch tex_address = 4;
    UnifiedAddressMatch unified_address = 5;
    ShieldedAddressMatch shielded_address = 6;
    ViewingKeyMatch viewing_key = 7;
    UnclassifiedMatch unclassified = 9;
  }

  // Heuristic confidence in `[0.0, 1.0]`. `1.0` means the classifier is
  // structurally certain (e.g. address parsed cleanly); lower values
  // mean the arm is one of several plausible interpretations of the
  // same input (e.g. a short numeric string matches both a height and
  // the prefix of a possible txid).
  float confidence = 10;
}

// `ExplorerQuery.Search` request.
message SearchRequest {
  // Raw user input. Capped at 4 KiB on the server side; longer payloads
  // (for example, ZIP-321 URIs) are not search targets.
  string query = 1;
}

// `ExplorerQuery.Search` response. One request produces zero or more
// typed candidates; the UI renders the highest-confidence arm first.
message SearchResponse {
  ExplorerFreshness freshness = 1;
  repeated SearchCandidate candidates = 2;
}

// `ExplorerQuery.CommitmentRootSearch` request.
//
// Searches final, post-block note-commitment-tree roots. It intentionally does
// not search transaction-intermediate anchors or completed 2^16-leaf subtree
// roots: those are different protocol facts.
message CommitmentRootSearchRequest {
  // Final note-commitment-tree root bytes. Exactly 32 bytes, in the same byte
  // order Zebra emits as `z_gettreestate.*.commitments.finalRoot`; hex-encoding
  // these bytes produces the root string shown by explorer APIs.
  bytes root = 1;

  // Maximum matches to return, ordered newest-first. Zero asks for the server
  // default; the server clamps larger values.
  uint32 max_matches = 2;
}

// One canonical block whose final root matches the requested bytes.
message CommitmentRootMatch {
  uint32 block_height = 1;

  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  string block_hash = 2;

  int64 block_time_unix_seconds = 3;
  ShieldedProtocol protocol = 4;
}

// Historical coverage of the commitment-root materialized view.
//
// The materialized view can serve tip-adjacent blocks while a preceding range
// is still backfilling. Consumers must not interpret an empty `matches` list as a
// definitive absence unless `canonical_history_complete` is true.
message CommitmentRootSearchCoverage {
  // First height in the contiguous historical backfill range. Absent until the
  // backfill has committed its first batch.
  optional uint32 complete_from_height = 1;

  // Last height in the contiguous historical backfill range. Absent until the
  // backfill has committed its first batch.
  optional uint32 complete_through_height = 2;

  // Highest canonical height with a materialized root row. This may be ahead
  // of `complete_through_height` while tip-follow and backfill run together.
  optional uint32 latest_indexed_height = 3;

  // True only when every root-bearing canonical height through the response's
  // visible tip is covered by the contiguous historical range.
  bool canonical_history_complete = 4;
}

// Historical coverage of displaced commitment-root matches.
//
// This is independent from canonical-root coverage. The archive begins at an
// activation event and can retain a displaced block whose final roots were not
// available at capture time. Consumers must not interpret an empty
// `displaced_matches` list as a definitive absence before activation, or when
// `root_artifact_unavailable_count` is nonzero. Even a definitive negative is
// limited to the captured range, never all historical displaced blocks.
message CommitmentRootSearchDisplacedCoverage {
  // First event covered by displaced-root capture. Absent before activation,
  // so negative displaced-root results remain indeterminate.
  optional uint64 activation_event_sequence = 1;

  // Epoch made visible by the activation event.
  optional uint64 activation_epoch_id = 2;

  // Wall-clock time when displaced-root capture became active.
  optional uint64 activated_at_millis = 3;

  // Number of displaced blocks captured at or after activation.
  uint64 captured_block_count = 4;

  // Captured displaced blocks whose final-root artifact was unavailable.
  // A nonzero value makes a negative displaced-root result indeterminate.
  uint64 root_artifact_unavailable_count = 5;

  // True only when capture has activated and every captured displaced block
  // has a searchable final-root artifact. This says nothing about displaced
  // blocks from before activation.
  bool captured_range_complete = 6;
}

// `ExplorerQuery.CommitmentRootSearch` response.
message CommitmentRootSearchResponse {
  ExplorerFreshness freshness = 1;
  repeated CommitmentRootMatch matches = 2;
  CommitmentRootSearchCoverage coverage = 3;

  // Retained displaced blocks whose final root matches the request. Each row
  // supplies the hash accepted by `DisplacedBlockDetail`; coinbase and product
  // metadata remain on that dedicated RPC.
  repeated CommitmentRootMatch displaced_matches = 4;

  // Coverage for `displaced_matches`, independent from canonical `coverage`.
  CommitmentRootSearchDisplacedCoverage displaced_coverage = 5;
}

// Per-shape count carried by [`MempoolSummaryResponse`].
message PrivacyShapeCount {
  PrivacyShape shape = 1;
  uint32 count = 2;
}

// Per-version count carried by [`MempoolSummaryResponse`].
message TransactionVersionCount {
  TransactionVersionKind kind = 1;
  uint32 count = 2;
}

// `ExplorerQuery.MempoolSummary` request.
//
// Optionally pins the read to a specific chain epoch so the response
// stays consistent with concurrent reads.
message MempoolSummaryRequest {
  optional uint64 at_epoch_id = 1;
}

// `ExplorerQuery.MempoolSummary` response.
//
// Aggregates the current mempool snapshot into a single page-friendly
// shape: total counts, byte size, privacy-shape distribution, version
// distribution, and freshness extremes. The handler parses every entry
// via `zinder_source::parse_transaction_public_facts` so the shape and
// version classifiers stay in lockstep with `TransactionDetail`.
message MempoolSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Number of transactions in the snapshot.
  uint32 transaction_count = 2;

  // Sum of `size_bytes` across every entry.
  uint64 total_size_bytes = 3;

  // One entry per privacy shape present in the snapshot; shapes with
  // zero entries are omitted.
  repeated PrivacyShapeCount privacy_shape_distribution = 4;

  // One entry per transaction version kind present in the snapshot;
  // versions with zero entries are omitted.
  repeated TransactionVersionCount version_distribution = 5;

  // Age of the oldest mempool entry (largest `first_seen_unix_millis`
  // delta vs. now). Zero when the snapshot is empty.
  uint64 oldest_entry_age_millis = 6;

  // Age of the newest mempool entry (smallest `first_seen_unix_millis`
  // delta vs. now). Zero when the snapshot is empty.
  uint64 newest_entry_age_millis = 7;
}

// Summary facts derived from one observed mempool snapshot.
//
// The fields deliberately mirror `MempoolSummaryResponse` without its
// response-level freshness envelope so a paged snapshot can return its global
// totals and rows from one source read.
message MempoolSnapshotSummary {
  uint32 transaction_count = 1;
  uint64 total_size_bytes = 2;
  repeated PrivacyShapeCount privacy_shape_distribution = 3;
  repeated TransactionVersionCount version_distribution = 4;
  uint64 oldest_entry_age_millis = 5;
  uint64 newest_entry_age_millis = 6;
}

// `ExplorerQuery.MempoolSnapshot` request.
//
// Selects one bounded page from the same current mempool observation used for
// the returned summary. The cursor is opaque and has the same transient
// semantics as `MempoolActivityRequest`.
message MempoolSnapshotRequest {
  uint32 max_entries = 1;
  bytes from_cursor = 2;
}

// `ExplorerQuery.MempoolSnapshot` response.
//
// `summary`, `entries`, and `next_cursor` are all derived from one
// `WalletQuery.MempoolSnapshot` response. This avoids combining global totals
// with a page that may have been read after a transaction was mined or added.
message MempoolSnapshotResponse {
  ExplorerFreshness freshness = 1;
  MempoolSnapshotSummary summary = 2;
  repeated MempoolActivityEntry entries = 3;
  bytes next_cursor = 4;
}

// `ExplorerQuery.MempoolActivity` request.
//
// Returns the current mempool entries sorted by newest-first observation
// time. The cursor is opaque and encodes the prior page's last entry so
// subsequent calls resume past it. Mempool state is transient; restarted
// pages may return new entries that arrived since the prior call.
message MempoolActivityRequest {
  uint32 max_entries = 1;
  bytes from_cursor = 2;
}

// One mempool entry projected into the explorer wire shape.
message MempoolActivityEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // Wall-clock time when the indexer first observed this entry.
  uint64 first_seen_unix_millis = 2;

  // Raw transaction byte length.
  uint32 size_bytes = 3;

  // Coarse privacy classification computed from the parsed facts.
  PrivacyShape privacy_shape = 4;

  // Coarse transaction version classification.
  TransactionVersion version = 5;

  // ZIP-317 conventional fee floor for this entry, in zatoshis. Always
  // populated.
  uint64 zip317_conventional_fee_zat = 6;

  // Actual paid fee, in zatoshis. Populated when the explorer advertises
  // `EXPLORER_TRANSACTION_FEES_V1` and the wallet plane's mempool prevout
  // index resolved every transparent input for this entry. Absent
  // otherwise; consumers fall back to `zip317_conventional_fee_zat`.
  optional uint64 paid_fee_zat = 7;

  // ZIP-317 logical-action count for this entry. The fee floor formula's
  // input; surfaced separately so consumers can render fee-per-action
  // without re-deriving from the component counts.
  uint32 logical_actions = 8;

  // Parsed transaction component counts. These are derived from the live
  // entry's raw transaction bytes at request time; no durable mempool
  // materialized view is involved.
  TransactionComponentCounts component_counts = 9;

  // Sum of every transparent output created by this transaction, in
  // zatoshis. Shielded output values are encrypted and are deliberately not
  // included.
  uint64 transparent_output_total_zat = 10;
}

// `ExplorerQuery.MempoolActivity` response.
message MempoolActivityResponse {
  ExplorerFreshness freshness = 1;
  repeated MempoolActivityEntry entries = 2;
  bytes next_cursor = 3;
}

// `ExplorerQuery.TransparentAddressActivity` request.
//
// Returns confirmed transparent-address activity from the materialized view.
// Mempool activity for a transparent address is served
// separately through `MempoolActivity` so each surface has one source
// of truth.
message TransparentAddressActivityRequest {
  // Selector for the transparent address being queried.
  zinder.v1.wallet.AddressLookup address = 1;

  // Inclusive minimum block height. Zero means start from genesis.
  uint32 start_height = 2;

  // Inclusive maximum block height.
  uint32 end_height = 3;

  // Server-bounded maximum entries per page. Zero means use the server
  // default; values larger than the server's configured cap are silently
  // clamped.
  uint32 max_entries = 4;

  // Empty resumes from the head of the timeline. Non-empty resumes
  // strictly after the prior page's last entry.
  //
  // Ordering: rows are always emitted newest-first; the consumer's
  // storage layout is descending by height. Clients that want oldest-
  // first reverse the page client-side.
  bytes from_cursor = 5;

  // Reserved tag for the deleted `descending` field. The handler always
  // serves newest-first; the previous bool led to an ordering bug when
  // Optional chain-epoch id pin.
  optional uint64 at_epoch_id = 7;

  // Number of matching rows to skip before collecting the page. Intended for
  // bounded page-number adapters. Must be zero when `from_cursor` is non-empty.
  uint64 offset = 8;
}

// One transparent-address confirmed-activity row.
//
// Materialized by `TransparentAddressActivityConsumer` at commit time.
// `net_value_zat` is positive when the transaction paid the address and
// negative when it spent from the address. Absent when prevout
// resolution did not produce a complete picture; the
// `prevout_resolution_status` field disambiguates why.
message TransparentAddressActivityEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // Canonical block height of the confirming block.
  uint32 block_height = 2;

  // `nTime` from the confirming block header.
  int64 block_time_unix_seconds = 3;

  // Signed net value, in zatoshis, the transaction moved into the
  // address. Set only when every prevout the transaction spends for this
  // address was resolved; see `prevout_resolution_status`.
  optional sint64 net_value_zat = 4;

  // Number of transparent inputs in the transaction that spent from
  // this address. The parent message scopes the address; the field name
  // does not repeat the discriminator.
  uint32 input_count = 5;

  // Number of transparent outputs in the transaction that paid this
  // address.
  uint32 output_count = 6;

  // Why `net_value_zat` is or is not set. Always populated.
  PrevoutResolutionStatus prevout_resolution_status = 7;

  // Canonical zero-based position inside the block. Absent when retained
  // canonical transaction facts are unavailable.
  optional uint32 transaction_index = 8;

  // Raw transaction byte length. Absent when retained canonical transaction
  // facts are unavailable.
  optional uint32 size_bytes = 9;

  // Full transaction component counts. Absent when retained canonical
  // transaction facts are unavailable. The address-specific `input_count`
  // and `output_count` above retain their existing meaning.
  TransactionComponentCounts component_counts = 10;

  // Sum of resolved transparent inputs spent from the requested address.
  // Present only when every non-coinbase transparent input was resolved.
  optional uint64 input_value_zat = 11;

  // Sum of intrinsic transparent outputs paid to the requested address.
  // Present whenever retained canonical transaction facts are available.
  optional uint64 output_value_zat = 12;

  // Deduplicated raw scripts for resolved inputs spent from other addresses,
  // in first-input order. May be partial when `input_facts_complete` is false.
  repeated bytes other_input_script_pub_keys = 13;

  // Deduplicated raw scripts for intrinsic outputs paid to other addresses,
  // in first-output order. Complete whenever `component_counts` is present.
  repeated bytes other_output_script_pub_keys = 14;

  // True when every transparent input script and value is known. Coinbase has
  // a complete empty input set. False when transaction or parent facts are
  // unavailable; `input_value_zat` is absent in that case.
  bool input_facts_complete = 15;
}

// Current balance and lifetime facts for one transparent script hash.
//
// Lifetime fields are absent for a valid address with no retained history.
// `script_pub_key` is absent when the request supplied only a script hash and
// neither snapshot nor tail facts retained the corresponding raw script.
message TransparentAddressSummary {
  optional bytes script_pub_key = 1;
  uint64 balance_zat = 2;
  optional uint64 total_received_zat = 3;
  optional uint64 total_sent_zat = 4;
  optional uint64 distinct_transaction_count = 5;
  optional int64 first_seen_unix_seconds = 6;
  optional int64 last_seen_unix_seconds = 7;
}

// `ExplorerQuery.TransparentAddressActivity` response.
message TransparentAddressActivityResponse {
  ExplorerFreshness freshness = 1;
  repeated TransparentAddressActivityEntry entries = 2;
  bytes next_cursor = 3;
  TransparentAddressSummary summary = 4;
  TransparentAddressRankingCoverage coverage = 5;
}

// `ExplorerQuery.TransparentAddressDeltas` request.
//
// Returns the per-event signed value series for one transparent address
// over an inclusive height range, ordered ascending. One entry per received
// output and per resolved spend, so the series is strictly finer than
// `TransparentAddressActivity`, which folds the same events into one net row
// per transaction. The mempool view is served separately through
// `MempoolActivity`.
message TransparentAddressDeltasRequest {
  // Selector for the transparent address being queried.
  zinder.v1.wallet.AddressLookup address = 1;

  // Inclusive minimum block height. Zero means start from genesis.
  uint32 start_height = 2;

  // Inclusive maximum block height.
  uint32 end_height = 3;

  // Server-bounded maximum entries per page. Zero means use the server
  // default; values larger than the server's configured cap are silently
  // clamped.
  uint32 max_entries = 4;

  // Empty resumes from the oldest event in range. Non-empty resumes
  // strictly after the prior page's last entry.
  //
  // Ordering: events are always emitted ascending (oldest first), matching
  // the zcashd `getaddressdeltas` order. The sibling
  // `TransparentAddressActivity` is deliberately newest-first; this surface
  // is the ascending per-event counterpart.
  bytes from_cursor = 5;

  // Optional chain-epoch id pin.
  optional uint64 at_epoch_id = 6;
}

// One signed transparent-address value event.
//
// Materialized by `TransparentAddressDeltasConsumer` at commit time. A
// received output carries a positive `value_zat` and the output index; a
// spent prevout carries a negative `value_zat` and the input index. Spend
// events use `spent_value_zat` recorded on the canonical spend fact, so they
// need no prevout re-resolution at read time. A spend whose prevout cannot
// be resolved produces no event rather than a wrong number.
message TransparentAddressDeltasEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;

  // Canonical block height of the confirming block.
  uint32 block_height = 2;

  // `nTime` from the confirming block header.
  int64 block_time_unix_seconds = 3;

  // Output index for a received output, input index for a spent prevout.
  uint32 index = 4;

  // Signed value, in zatoshis, the event moved for the address. Positive
  // for a received output, negative for a spent prevout.
  sint64 value_zat = 5;

  // Whether the event credits (`RECEIVED`) or debits (`SPENT`) the address.
  TransparentDeltaKind kind = 6;
}

// `ExplorerQuery.TransparentAddressDeltas` response.
message TransparentAddressDeltasResponse {
  ExplorerFreshness freshness = 1;
  repeated TransparentAddressDeltasEntry entries = 2;
  bytes next_cursor = 3;
}

// Per-event record materialized by `TransparentAddressDeltasConsumer`.
//
// Storage-only: never returned directly on the wire. Encoded into the
// `transparent_address_deltas` column family value bytes; the key carries
// `(address_script_hash, ascending_height, in_block_position, kind, index)`.
// The handler projects this onto `TransparentAddressDeltasEntry`, pulling
// the height from the key.
message TransparentAddressDeltasRecord {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  int64 block_time_unix_seconds = 2;
  // Signed value the event moved for the address; positive for a received
  // output, negative for a spent prevout.
  sint64 value_zat = 3;
}

// `ExplorerQuery.FeeSummary` request.
//
// Aggregates per-transaction ZIP-317 conventional fee floors over the
// inclusive block range `[start_height, end_height]` from the typed
// `BlockSummaryRecord` facts materialized by the materialized-view plane.
message FeeSummaryRequest {
  uint32 start_height = 1;
  uint32 end_height = 2;
}

// `ExplorerQuery.FeeSummary` response.
//
// The fee fields are ZIP-317 conventional fee floors, not miner-collected
// fees. Computing actual fees requires prevout resolution and is
// intentionally out of scope for `v1`; the conventional-fee floor is the
// minimum a wallet should attach to a transaction with the given shape.
message FeeSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Number of canonical blocks the response aggregated.
  uint32 block_count = 2;

  // Number of non-coinbase transactions across the aggregated range.
  // Coinbase transactions are excluded because they have no fee.
  uint32 transaction_count = 3;

  // Sum of `zip317_conventional_fee_zat` across every non-coinbase
  // transaction.
  uint64 total_zip317_conventional_fee_zat = 4;

  // Smallest `zip317_conventional_fee_zat` observed across the range,
  // zero when the range carries no non-coinbase transactions.
  uint64 min_zip317_conventional_fee_zat = 5;

  // Largest `zip317_conventional_fee_zat` observed across the range,
  // zero when the range carries no non-coinbase transactions.
  uint64 max_zip317_conventional_fee_zat = 6;
}

// `ExplorerQuery.MigrationOverview` request.
//
// Aggregates the Orchard-to-Ironwood migration facts the materialized-view plane
// materializes. Both bounds absent aggregates the full indexed history;
// present bounds restrict the aggregate to the inclusive block range
// `[start_height, end_height]`.
message MigrationOverviewRequest {
  // First block height to aggregate (inclusive). Absent starts from genesis.
  optional uint32 start_height = 1;

  // Last block height to aggregate (inclusive). Absent runs to the indexed tip.
  optional uint32 end_height = 2;
}

// `ExplorerQuery.MigrationOverview` response.
//
// `total_migrated_ironwood_zat` counts only loose-predicate migrations, so it
// tracks migrated value rather than raw Ironwood inflow. `orchard_outflow_zat`
// and `ironwood_inflow_zat` are the two-sided pool audit: they sum the two
// value balances independently and should closely track each other net of
// fees, which is what makes a divergence detectable.
message MigrationOverviewResponse {
  ExplorerFreshness freshness = 1;

  // Sum of migrated Ironwood output amounts across the range, in zatoshi,
  // restricted to loose-predicate migrations.
  uint64 total_migrated_ironwood_zat = 2;

  // Number of migrations counted into `total_migrated_ironwood_zat`.
  uint32 migration_count = 3;

  // First block height carrying a counted migration. Absent when the range
  // contains no counted migration.
  optional uint32 first_height = 4;

  // Last block height carrying a counted migration. Absent when the range
  // contains no counted migration.
  optional uint32 last_height = 5;

  // Sum of `orchard_value_balance_zat` across the range: the value leaving the
  // chain-wide Orchard pool. Pairs with `ironwood_inflow_zat` net of fees.
  uint64 orchard_outflow_zat = 6;

  // Sum of the absolute Ironwood value balances across the range: the value
  // entering the chain-wide Ironwood pool. Should track `orchard_outflow_zat`
  // net of fees.
  uint64 ironwood_inflow_zat = 7;
}

// `ExplorerQuery.MigrationCohorts` request.
//
// Groups migrations in the inclusive block range `[start_height, end_height]`
// by shared Orchard anchor.
message MigrationCohortsRequest {
  // First block height to group (inclusive).
  uint32 start_height = 1;

  // Last block height to group (inclusive). The span
  // `end_height - start_height + 1` may not exceed 4096 blocks; the handler
  // rejects wider ranges so one request bounds the materialized-view scan, matching
  // the `MAX_BLOCK_SUMMARIES_PER_REQUEST`-style caps elsewhere on this surface.
  uint32 end_height = 2;

  // Optional chain-epoch id pin for snapshot consistency with concurrent reads.
  optional uint64 at_epoch_id = 3;
}

// One anchor-sharing migration cohort.
//
// Migrations that spend from the same Orchard anchor form a cohort; a larger
// cohort is a larger anonymity set. `conformant_member_count` narrows the
// count to members whose migration shape is genuinely privacy-preserving, so a
// client can show how much of a cohort is real cover.
message MigrationCohort {
  // The shared Orchard anchor: 32 raw bytes in canonical wire order (the
  // internal little-endian representation, not the reversed RPC-display form).
  bytes orchard_anchor = 1;

  // Number of migrations in the cohort.
  uint32 member_count = 2;

  // Sum of migrated Ironwood output amounts across the cohort, in zatoshi.
  uint64 total_migrated_zat = 3;

  // Members whose migration shape is conformant (genuinely privacy-
  // preserving). Always `<= member_count`.
  uint32 conformant_member_count = 4;
}

// `ExplorerQuery.MigrationCohorts` response.
message MigrationCohortsResponse {
  ExplorerFreshness freshness = 1;

  // One entry per distinct Orchard anchor observed in the range.
  repeated MigrationCohort cohorts = 2;

  // Number of cohorts, equal to `cohorts` length.
  uint32 cohort_count = 3;

  // Average cohort member count across the range, zero when there are no
  // cohorts.
  uint32 avg_member_count = 4;

  // Smallest cohort member count, zero when there are no cohorts.
  uint32 min_member_count = 5;

  // Largest cohort member count, zero when there are no cohorts.
  uint32 max_member_count = 6;
}

// `ExplorerQuery.MigrationDenominations` request.
//
// Bins conformant migrations in the inclusive block range `[start_height,
// end_height]` by the power-of-ten magnitude of their Ironwood output amount.
message MigrationDenominationsRequest {
  // First block height to bin (inclusive).
  uint32 start_height = 1;

  // Last block height to bin (inclusive). The span
  // `end_height - start_height + 1` may not exceed 4096 blocks; the handler
  // rejects wider ranges so one request bounds the materialized-view scan, matching
  // the `MAX_BLOCK_SUMMARIES_PER_REQUEST`-style caps elsewhere on this surface.
  uint32 end_height = 2;

  // Optional chain-epoch id pin for snapshot consistency with concurrent reads.
  optional uint64 at_epoch_id = 3;
}

// One power-of-ten denomination bucket.
message MigrationDenominationBin {
  // The bucket's representative amount: the power-of-ten floor of its members'
  // Ironwood output amount, in zatoshi.
  uint64 denomination_zat = 1;

  // Number of conformant migrations whose amount falls in this bucket.
  uint32 count = 2;
}

// `ExplorerQuery.MigrationDenominations` response.
message MigrationDenominationsResponse {
  ExplorerFreshness freshness = 1;

  // One entry per populated power-of-ten bucket, ascending by
  // `denomination_zat`.
  repeated MigrationDenominationBin bins = 2;

  // Total conformant migrations binned across the range.
  uint32 total_tx = 3;
}

// `ExplorerQuery.ConventionalFeeDistribution` request.
//
// Selects the half-open block-time range
// `[start_time_unix_seconds, end_time_unix_seconds)`. Boundary UTC days are
// clipped to transactions in the requested range.
message ConventionalFeeDistributionRequest {
  int64 start_time_unix_seconds = 1;
  int64 end_time_unix_seconds = 2;
}

// One exact ZIP-317 conventional-fee frequency.
//
// This is the ZIP-317 conventional fee, not the miner-collected fee.
message ConventionalFeeFrequency {
  uint64 zip317_conventional_fee_zat = 1;
  uint64 transaction_count = 2;
}

// Exact conventional-fee frequencies for one UTC day, clipped to the
// request's half-open time range.
message ConventionalFeeDistributionDay {
  // UTC midnight as Unix seconds.
  int64 day_start_unix_seconds = 1;

  // Frequencies sorted by `zip317_conventional_fee_zat` ascending.
  repeated ConventionalFeeFrequency frequencies = 2;

  // Transactions whose ZIP-317 conventional fee was unavailable.
  uint64 unavailable_transaction_count = 3;
}

// Contiguous materialized-view coverage for a conventional-fee distribution query.
message ConventionalFeeDistributionCoverage {
  optional uint32 complete_from_height = 1;
  optional uint32 complete_through_height = 2;
  optional int64 complete_from_time_unix_seconds = 3;
  optional int64 complete_through_time_unix_seconds = 4;

  // True only when contiguous materialized-view coverage starts at height 1 and
  // includes the full requested range. The genesis floor is required because
  // canonical block times are non-monotonic.
  bool requested_range_complete = 5;
}

// `ExplorerQuery.ConventionalFeeDistribution` response.
message ConventionalFeeDistributionResponse {
  ExplorerFreshness freshness = 1;
  repeated ConventionalFeeDistributionDay days = 2;
  ConventionalFeeDistributionCoverage coverage = 3;
}

// `ExplorerQuery.PaidFeeDistribution` request.
//
// Selects the half-open block-time range
// `[start_time_unix_seconds, end_time_unix_seconds)`. Boundary UTC days are
// clipped to transactions in the requested range.
message PaidFeeDistributionRequest {
  int64 start_time_unix_seconds = 1;
  int64 end_time_unix_seconds = 2;
}

// One exact positive miner-collected fee frequency. Proven zero-fee
// transactions are omitted and are not counted as unavailable.
message PaidFeeFrequency {
  uint64 paid_fee_zat = 1;
  uint64 transaction_count = 2;
}

// Exact paid-fee frequencies for one UTC day, clipped to the request's
// half-open time range.
message PaidFeeDistributionDay {
  // UTC midnight as Unix seconds.
  int64 day_start_unix_seconds = 1;

  // Positive frequencies sorted by `paid_fee_zat` ascending.
  repeated PaidFeeFrequency frequencies = 2;

  // Non-coinbase transactions whose exact paid fee was unavailable.
  uint64 unavailable_transaction_count = 3;
}

// Contiguous materialized-view coverage for a paid-fee distribution query.
message PaidFeeDistributionCoverage {
  optional uint32 complete_from_height = 1;
  optional uint32 complete_through_height = 2;
  optional int64 complete_from_time_unix_seconds = 3;
  optional int64 complete_through_time_unix_seconds = 4;

  // True only when materialized-view coverage includes the full requested range.
  bool requested_range_complete = 5;
}

// `ExplorerQuery.PaidFeeDistribution` response.
message PaidFeeDistributionResponse {
  ExplorerFreshness freshness = 1;
  repeated PaidFeeDistributionDay days = 2;
  PaidFeeDistributionCoverage coverage = 3;
}

// Additive public transaction-component totals over a canonical time range.
//
// Component counters and transaction predicates are public protocol facts.
// Predicate counters name their exact protocol scope so callers do not infer
// behavior for future pools.
message TransactionComponentTotals {
  uint64 transaction_count = 1;
  uint64 transparent_input_count = 2;
  uint64 transparent_output_count = 3;
  uint64 sapling_spend_count = 4;
  uint64 sapling_output_count = 5;
  uint64 orchard_action_count = 6;
  uint64 ironwood_action_count = 7;
  uint64 sprout_joinsplit_count = 8;
  uint64 sapling_transaction_count = 9;
  uint64 orchard_transaction_count = 10;
  uint64 ironwood_transaction_count = 11;
  uint64 sprout_transaction_count = 12;
  uint64 sapling_or_orchard_transaction_count = 13;
  uint64 sapling_without_orchard_transaction_count = 14;
  uint64 orchard_without_sapling_transaction_count = 15;
  uint64 sapling_and_orchard_transaction_count = 16;
  uint64 sapling_or_orchard_fully_shielded_transaction_count = 17;
  // Includes coinbase transactions with at least one Sapling, Orchard, or
  // Ironwood component. Sprout-only transactions do not count.
  uint64 sapling_orchard_or_ironwood_transaction_count = 18;
  // Non-coinbase transactions without Sapling, Orchard, or Ironwood
  // components. Sprout-only transactions count.
  uint64 non_coinbase_without_sapling_orchard_or_ironwood_transaction_count = 19;
  // Non-coinbase transactions with a Sapling, Orchard, or Ironwood component
  // and at least one transparent input and output.
  uint64 non_coinbase_sapling_orchard_or_ironwood_with_transparent_inputs_and_outputs_transaction_count = 20;
  // Non-coinbase transactions with a Sapling, Orchard, or Ironwood component
  // and no transparent inputs or outputs.
  uint64 non_coinbase_sapling_orchard_or_ironwood_without_transparent_inputs_or_outputs_transaction_count = 21;
  // Coinbase transactions, independent of their component counts.
  uint64 coinbase_transaction_count = 22;
  // Transactions excluded from every predicate counter because the parsed
  // public facts retain unsupported sections. Predicate totals are exact only
  // when this count is zero.
  uint64 transaction_predicate_unavailable_count = 23;
}

// One UTC-day bucket clipped to the request's half-open time range.
message TransactionComponentDay {
  // UTC midnight as Unix seconds.
  int64 day_start_unix_seconds = 1;
  TransactionComponentTotals totals = 2;
  optional int64 first_sapling_or_orchard_transaction_time_unix_seconds = 3;
  optional int64 last_sapling_or_orchard_transaction_time_unix_seconds = 4;
}

// Historical range whose transaction-component materialized view is contiguous.
message TransactionComponentCoverage {
  uint32 complete_from_height = 1;
  uint32 complete_through_height = 2;
  int64 complete_from_time_unix_seconds = 3;
  int64 complete_through_time_unix_seconds = 4;
  bool requested_range_complete = 5;
}

// `ExplorerQuery.TransactionComponentSummary` request.
//
// Includes transactions whose canonical block timestamp is in
// `[start_time_unix_seconds, end_time_unix_seconds)`.
message TransactionComponentSummaryRequest {
  int64 start_time_unix_seconds = 1;
  int64 end_time_unix_seconds = 2;
  // False returns UTC-day buckets. Set true to return only the range totals
  // and coverage.
  bool totals_only = 3;
}

// `ExplorerQuery.TransactionComponentSummary` response.
message TransactionComponentSummaryResponse {
  ExplorerFreshness freshness = 1;
  TransactionComponentTotals totals = 2;
  repeated TransactionComponentDay days = 3;
  TransactionComponentCoverage coverage = 4;
}

// `ExplorerQuery.TransparentAddressRanking` request.
//
// Offset is a rank offset in the response's deterministic
// `(balance descending, script hash ascending)` order. The server caps limit;
// callers must not assume an unbounded page.
message TransparentAddressRankingRequest {
  uint32 limit = 1;
  uint64 offset = 2;
}

// One positive-balance standard transparent script in rank order.
//
// Address string encoding remains an edge concern because it depends on the
// target network. The native surface returns the canonical raw script.
message TransparentAddressRankingEntry {
  uint64 rank = 1;
  bytes script_pub_key = 2;
  uint64 balance_zat = 3;
  optional uint64 total_received_zat = 4;
  optional uint64 total_sent_zat = 5;
  optional uint64 distinct_transaction_count = 6;
  optional int64 first_seen_unix_seconds = 7;
  optional int64 last_seen_unix_seconds = 8;
}

// Recovery coverage for transparent-address ranking and lifetime facts.
message TransparentAddressRankingCoverage {
  uint32 balance_complete_through_height = 1;
  optional uint32 history_complete_from_height = 2;
  optional uint32 history_complete_through_height = 3;
  bool lifetime_statistics_complete = 4;
}

// Standard transparent script template represented by a ranking aggregate.
enum TransparentScriptType {
  TRANSPARENT_SCRIPT_TYPE_UNSPECIFIED = 0;
  TRANSPARENT_SCRIPT_TYPE_P2PKH = 1;
  TRANSPARENT_SCRIPT_TYPE_P2SH = 2;
}

// Positive-address count and balance for one standard script template.
message TransparentAddressScriptTypeSummary {
  TransparentScriptType script_type = 1;
  uint64 positive_address_count = 2;
  uint64 total_positive_balance_zat = 3;
}

// `ExplorerQuery.TransparentAddressRanking` response.
message TransparentAddressRankingResponse {
  ExplorerFreshness freshness = 1;
  repeated TransparentAddressRankingEntry entries = 2;
  uint64 positive_address_count = 3;
  uint64 total_positive_balance_zat = 4;
  uint64 top_10_balance_zat = 5;
  uint64 top_100_balance_zat = 6;
  TransparentAddressRankingCoverage coverage = 7;
  repeated TransparentAddressScriptTypeSummary script_type_summaries = 8;
}

// Explorer-shaped read surface served by zinder-explorer.
service ExplorerQuery {
  // Returns the consumer-side capability descriptor.
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse);

  // Returns a typed read model for one transaction. Capability:
  // `explorer.transaction.detail_v4`.
  rpc TransactionDetail(TransactionDetailRequest)
      returns (TransactionDetailResponse);

  // Returns one `BlockSummary` per canonical block in the requested
  // height range, ordered by ascending height. Capability:
  // `explorer.block.summary_v1`.
  rpc BlockSummariesInRange(BlockSummariesInRangeRequest)
      returns (BlockSummariesInRangeResponse);

  // Joins existing block-summary rows to canonical header difficulty bits over
  // one bounded height range. Capability:
  // `explorer.block.production_series_v2`.
  rpc BlockProductionSeries(BlockProductionSeriesRequest)
      returns (BlockProductionSeriesResponse);

  // Returns a bounded page of canonical block-production observations in one
  // half-open block-time range. Capability:
  // `explorer.block.production_time_range_v1`.
  rpc BlockProductionInTimeRange(BlockProductionInTimeRangeRequest)
      returns (BlockProductionInTimeRangeResponse);

  // Aggregates canonical block activity by weekday and hour across one bounded
  // height range. Capability: `explorer.block.activity_distribution_v1`.
  rpc BlockActivityDistribution(BlockActivityDistributionRequest)
      returns (BlockActivityDistributionResponse);

  // Returns canonical transaction-component totals and UTC-day buckets over
  // one half-open block-time range. Capability:
  // `explorer.transaction.component_summary_v2`.
  rpc TransactionComponentSummary(TransactionComponentSummaryRequest)
      returns (TransactionComponentSummaryResponse);

  // Returns positive standard transparent scripts in deterministic balance
  // order with optional lifetime activity facts. Capability:
  // `explorer.transparent_address.ranking_v1`.
  rpc TransparentAddressRanking(TransparentAddressRankingRequest)
      returns (TransparentAddressRankingResponse);

  // Returns one `BlockSummary` plus the canonical-ordered transaction ids
  // for the requested block. Capability: `explorer.block.detail_v1`.
  rpc BlockDetail(BlockDetailRequest) returns (BlockDetailResponse);

  // Returns page-ready public transaction rows for one canonical block.
  // Capability: `explorer.block.transactions_v2`.
  rpc BlockTransactions(BlockDetailRequest) returns (BlockTransactionsResponse);

  // Classifies a raw user input string into typed search candidates per
  // [ADR-0012](../../../../../docs/adrs/0012-typed-explorer-search-and-privacy-refusal.md).
  // Shielded receivers, viewing keys, and shielded receivers inside
  // unified addresses route to the typed `NotPubliclyIndexable` arm and
  // never reach a storage read. Capability: `explorer.search_v1`.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Finds canonical blocks whose post-block Sapling, Orchard, or Ironwood
  // note-commitment-tree root equals the requested bytes. The response carries
  // explicit backfill coverage so an empty partial-history result is never
  // mistaken for proof of absence. Capability:
  // `explorer.commitment_root.search_v1`.
  rpc CommitmentRootSearch(CommitmentRootSearchRequest)
      returns (CommitmentRootSearchResponse);

  // Aggregates the current mempool snapshot into a single explorer-shaped
  // response: total counts, byte size, privacy-shape distribution,
  // version distribution, and freshness extremes. Capability:
  // `explorer.mempool.summary_v1`.
  rpc MempoolSummary(MempoolSummaryRequest) returns (MempoolSummaryResponse);

  // Returns aggregate facts and one page from the same observed mempool
  // snapshot. Capability: `explorer.mempool.snapshot_v1`.
  rpc MempoolSnapshot(MempoolSnapshotRequest) returns (MempoolSnapshotResponse);

  // Returns the current mempool entries sorted by newest-first
  // observation time, paged with an opaque cursor. Mempool state is
  // transient; subsequent pages may interleave with new arrivals.
  // Capability: `explorer.mempool.activity_v1`.
  rpc MempoolActivity(MempoolActivityRequest) returns (MempoolActivityResponse);

  // Returns the confirmed transparent-address activity feed materialized
  // by `TransparentAddressActivityConsumer`. The mempool view for an
  // address is served separately through `MempoolActivity` so each
  // surface has one source of truth. Capability:
  // `explorer.transparent_address.activity_v2`.
  rpc TransparentAddressActivity(TransparentAddressActivityRequest)
      returns (TransparentAddressActivityResponse);

  // Returns the per-event signed value series for one transparent address
  // over an inclusive height range, ordered ascending (oldest first).
  // Materialized by `TransparentAddressDeltasConsumer`. The per-transaction
  // net folds these same events; this surface emits each received output and
  // each resolved spend individually. Capability:
  // `explorer.transparent_address.deltas_v1`.
  rpc TransparentAddressDeltas(TransparentAddressDeltasRequest)
      returns (TransparentAddressDeltasResponse);

  // Aggregates ZIP-317 conventional fee floors over the inclusive block
  // range `[start_height, end_height]`. Capability:
  // `explorer.fee.summary_v1`.
  rpc FeeSummary(FeeSummaryRequest) returns (FeeSummaryResponse);

  // Returns exact per-UTC-day ZIP-317 conventional-fee frequencies over a
  // half-open block-time range. This does not report miner-collected fees or
  // compute consumer-specific percentiles. Capability:
  // `explorer.fee.conventional_distribution_v1`.
  rpc ConventionalFeeDistribution(ConventionalFeeDistributionRequest)
      returns (ConventionalFeeDistributionResponse);

  // Returns exact per-UTC-day miner-collected fee frequencies over a
  // half-open block-time range. Missing canonical inputs remain explicit and
  // no conventional-fee fallback is substituted. Capability:
  // `explorer.fee.paid_distribution_v1`.
  rpc PaidFeeDistribution(PaidFeeDistributionRequest)
      returns (PaidFeeDistributionResponse);

  // Returns chain-wide value pool totals at the upstream node's tip.
  // Composed from `WalletQuery.ChainValuePoolsAtTip`. Capability:
  // `explorer.value_pool.summary_v1`.
  rpc ValuePoolSummary(ValuePoolSummaryRequest) returns (ValuePoolSummaryResponse);

  // Returns the node-advertised network-upgrade activation table alongside
  // the canonical tip height, so a client can tell whether an upgrade is
  // active and, if not, how far the tip is from its activation height.
  // Capability: `explorer.network_upgrade.status_v1`.
  rpc NetworkUpgradeStatus(NetworkUpgradeStatusRequest)
      returns (NetworkUpgradeStatusResponse);
  // Returns canonical transparent-to-shielded flow events, newest first.
  // Capability: `explorer.value_pool.flow_history_v1`.
  rpc ValuePoolFlowHistory(ValuePoolFlowHistoryRequest)
      returns (ValuePoolFlowHistoryResponse);

  // Returns bounded canonical value-pool flow events in one half-open time
  // range. Capability: `explorer.value_pool.flow_events_in_range_v1`.
  rpc ValuePoolFlowEventsInRange(ValuePoolFlowEventsInRangeRequest)
      returns (ValuePoolFlowEventsInRangeResponse);

  // Aggregates canonical value-pool flow events into UTC hour or day buckets
  // over one half-open time range. Capability:
  // `explorer.value_pool.flow_summary_v1`.
  rpc ValuePoolFlowSummary(ValuePoolFlowSummaryRequest)
      returns (ValuePoolFlowSummaryResponse);

  // Returns exact counts and amount sums for each requested minimum flow
  // amount over one half-open time range. Capability:
  // `explorer.value_pool.flow_amount_threshold_summary_v1`.
  rpc ValuePoolFlowAmountThresholdSummary(ValuePoolFlowAmountThresholdSummaryRequest)
      returns (ValuePoolFlowAmountThresholdSummaryResponse);

  // Groups canonical value-pool flow events by rounded raw amount over one
  // half-open time range. Capability:
  // `explorer.value_pool.flow_rounded_amount_summary_v1`.
  rpc ValuePoolFlowRoundedAmountSummary(ValuePoolFlowRoundedAmountSummaryRequest)
      returns (ValuePoolFlowRoundedAmountSummaryResponse);

  // Returns authoritative cumulative value-pool balances at canonical
  // UTC-day boundaries, newest first. Capability:
  // `explorer.value_pool.balance_history_v1`.
  rpc ValuePoolBalanceHistory(ValuePoolBalanceHistoryRequest)
      returns (ValuePoolBalanceHistoryResponse);

  // Returns retained chain reorg events from the canonical chain-event log,
  // scanning at most `max_events` retained chain events per request.
  // Capability: `explorer.chain.reorg_history_v1`.
  rpc ChainReorgHistory(ChainReorgHistoryRequest)
      returns (ChainReorgHistoryResponse);

  // Returns a bounded newest-first page from the writer-owned archive of
  // formerly canonical blocks. Capability:
  // `explorer.chain.displaced_block_history_v1`.
  rpc DisplacedBlockHistory(DisplacedBlockHistoryRequest)
      returns (DisplacedBlockHistoryResponse);

  // Returns one displaced block by hash and its current canonical counterpart
  // at the former height. Capability:
  // `explorer.chain.displaced_block_detail_v1`.
  rpc DisplacedBlockDetail(DisplacedBlockDetailRequest)
      returns (DisplacedBlockDetailResponse);

  // Returns rolling counts of mempool events from the durable per-second
  // counter column family.
  // Capability: `explorer.mempool.event_counts_v1`.
  rpc MempoolEventCounts(MempoolEventCountsRequest)
      returns (MempoolEventCountsResponse);

  // Streams the newest-first materialized view of canonical transactions from
  // the `recent_transactions` materialized-view column family. Capability:
  // `explorer.transaction.recent_v1`.
  rpc RecentTransactions(RecentTransactionsRequest)
      returns (stream RecentTransactionsChunk);

  // Returns one filtered, newest-first page of canonical transaction history.
  // Capability: `explorer.transaction.history_v1`.
  rpc TransactionHistory(TransactionHistoryRequest)
      returns (TransactionHistoryResponse);

  // Returns one coherent point-in-time bundle of every field a consumer
  // needs to render an overview dashboard. The handler anchors the bundle
  // on a single `WalletQuery.VisibleTipBlock` tip and reads every other field
  // from the materialized-view store in one pass, so all fields share one
  // `ExplorerFreshness` and one snapshot identity. This avoids a per-card
  // fan-out (`MempoolSummary` + `FeeSummary` + `ValuePoolSummary` +
  // `BlockSummariesInRange` + `RecentTransactions` + `MempoolEventCounts`),
  // which cannot guarantee tip coherence across calls. Capability:
  // `explorer.overview.snapshot_v1`.
  rpc OverviewSnapshot(OverviewSnapshotRequest)
      returns (OverviewSnapshotResponse);

  // Aggregates Orchard-to-Ironwood migration facts over an optional block
  // range into the two-sided pool audit plus the migrated-value total.
  // Capability: `explorer.migration.overview_v1`.
  rpc MigrationOverview(MigrationOverviewRequest)
      returns (MigrationOverviewResponse);

  // Groups migrations in the inclusive block range by shared Orchard anchor,
  // reporting per-cohort size, migrated value, and conformant-member share.
  // Capability: `explorer.migration.cohorts_v1`.
  rpc MigrationCohorts(MigrationCohortsRequest)
      returns (MigrationCohortsResponse);

  // Bins conformant migrations in the inclusive block range by the
  // power-of-ten magnitude of their Ironwood output amount. Capability:
  // `explorer.migration.denominations_v1`.
  rpc MigrationDenominations(MigrationDenominationsRequest)
      returns (MigrationDenominationsResponse);
}

// `ExplorerQuery.ValuePoolSummary` request.
message ValuePoolSummaryRequest {}

// `ExplorerQuery.ValuePoolSummary` response.
//
// Mirrors `WalletQuery.ChainValuePoolsAtTipResponse` with the explorer's
// cross-cutting `ExplorerFreshness` envelope at field tag 1. Values are
// the cumulative chain totals reported by the upstream node, not
// per-block deltas.
message ValuePoolSummaryResponse {
  ExplorerFreshness freshness = 1;

  // Upstream value-pool entries, preserved in upstream order so unknown
  // future pools can flow through without a wire-shape change.
  repeated zinder.v1.wallet.ChainValuePool pools = 2;

  // Source tip returned by the same upstream observation as `pools`.
  zinder.v1.wallet.BlockTip source_tip = 4;
}

// Direction of one net flow between the transparent and shielded value pools.
enum ValuePoolFlowDirection {
  VALUE_POOL_FLOW_DIRECTION_UNSPECIFIED = 0;
  // Transparent value enters one or more shielded pools.
  VALUE_POOL_FLOW_DIRECTION_SHIELD = 1;
  // Shielded value exits to the transparent pool.
  VALUE_POOL_FLOW_DIRECTION_DESHIELD = 2;
}

// Shielded-pool attribution for one net value-pool flow event.
enum ValuePoolFlowPool {
  VALUE_POOL_FLOW_POOL_UNSPECIFIED = 0;
  VALUE_POOL_FLOW_POOL_SPROUT = 1;
  VALUE_POOL_FLOW_POOL_SAPLING = 2;
  VALUE_POOL_FLOW_POOL_ORCHARD = 3;
  VALUE_POOL_FLOW_POOL_IRONWOOD = 4;
  // More than one shielded pool has a nonzero transaction-intrinsic balance.
  VALUE_POOL_FLOW_POOL_MIXED = 5;
}

// Typed filters applied to a value-pool flow history page.
message ValuePoolFlowFilter {
  // Empty means either direction.
  repeated ValuePoolFlowDirection directions = 1;
  // Empty means every pool attribution, including `MIXED`.
  repeated ValuePoolFlowPool pools = 2;
  // Excludes events whose unsigned net amount is below this threshold.
  uint64 minimum_amount_zat = 3;
}

// One canonical transaction crossing the transparent/shielded boundary.
message ValuePoolFlowEvent {
  // Canonical transaction id in RPC byte order (64 lowercase hex characters).
  string transaction_id = 1;
  uint32 block_height = 2;
  int64 block_time_unix_seconds = 3;
  uint32 transaction_index_in_block = 4;
  ValuePoolFlowDirection direction = 5;
  ValuePoolFlowPool pool = 6;
  uint64 amount_zat = 7;
  // Signed transaction-intrinsic balances for every shielded pool.
  TransactionIntrinsicValueBalances pool_balances = 8;
}

// Historical and live-tail coverage of the value-pool flow event materialized view.
//
// The historical segment is populated by an explicit backfill. The live-tail
// segment begins at `live_tail_from_height` and advances from canonical ingest.
// Callers can compare both segments with `freshness.chain_view` before making
// a completeness claim for a requested range.
message ValuePoolFlowCoverage {
  // Boundary timestamps describe the blocks at the historical height bounds;
  // they are not time extrema because canonical block times are non-monotonic.
  optional uint32 historical_from_height = 1;
  optional uint32 historical_through_height = 2;
  optional int64 historical_from_time_unix_seconds = 3;
  optional int64 historical_through_time_unix_seconds = 4;
  optional uint32 live_tail_from_height = 5;
  optional uint32 live_tail_through_height = 6;
  optional int64 live_tail_through_time_unix_seconds = 7;
  // True only when contiguous coverage starts at height 1 and reaches the
  // response's current visible tip. This full-domain proof makes the requested
  // half-open time range complete even when block times are non-monotonic.
  // History pages leave this false because they do not carry a time range.
  bool requested_range_complete = 8;
}

// `ExplorerQuery.ValuePoolFlowHistory` request.
message ValuePoolFlowHistoryRequest {
  // Zero asks for the server default; the server clamps larger values.
  uint32 page_size = 1;
  // Opaque continuation bound to this request's filter and the last scanned
  // canonical event anchor. Native clients should not construct or inspect it.
  bytes cursor = 2;
  ValuePoolFlowFilter filter = 3;
  // Exact counts are returned only when materialized-view coverage is contiguous from
  // height 1 through the response's current visible tip. Otherwise the field
  // remains absent even when requested.
  bool include_total_count = 4;
}

// One bounded, newest-first value-pool flow page.
message ValuePoolFlowHistoryResponse {
  ExplorerFreshness freshness = 1;
  repeated ValuePoolFlowEvent events = 2;
  bytes next_cursor = 3;
  bool has_more = 4;
  optional uint64 total_matching_events = 5;
  uint32 scanned_event_count = 6;
  bool scan_limit_reached = 7;
  ValuePoolFlowCoverage coverage = 8;
}

// Bounded query for individual canonical value-pool flow events in one
// half-open block-time range.
message ValuePoolFlowEventsInRangeRequest {
  // Inclusive Unix timestamp lower bound.
  int64 start_time_unix_seconds = 1;
  // Exclusive Unix timestamp upper bound.
  int64 end_time_unix_seconds = 2;
  // Empty means either direction.
  repeated ValuePoolFlowDirection directions = 3;
  // Empty means every pool attribution, including `MIXED`.
  repeated ValuePoolFlowPool pools = 4;
  // Inclusive unsigned amount lower bound.
  uint64 minimum_amount_zat = 5;
  // Inclusive unsigned amount upper bound. Absence means unbounded.
  optional uint64 maximum_amount_zat = 6;
  // Zero asks for the server default; the server clamps larger values.
  uint32 max_events = 7;
}

// Bounded canonical events plus enough metadata to distinguish an empty
// complete range from a truncated or incompletely indexed query.
message ValuePoolFlowEventsInRangeResponse {
  ExplorerFreshness freshness = 1;
  repeated ValuePoolFlowEvent events = 2;
  uint32 scanned_event_count = 3;
  bool scan_limit_reached = 4;
  bool event_limit_reached = 5;
  ValuePoolFlowCoverage coverage = 6;
}

// UTC bucket width requested from `ExplorerQuery.ValuePoolFlowSummary`.
enum ValuePoolFlowSummaryResolution {
  VALUE_POOL_FLOW_SUMMARY_RESOLUTION_UNSPECIFIED = 0;
  VALUE_POOL_FLOW_SUMMARY_RESOLUTION_HOUR = 1;
  VALUE_POOL_FLOW_SUMMARY_RESOLUTION_DAY = 2;
}

// `ExplorerQuery.ValuePoolFlowSummary` request.
message ValuePoolFlowSummaryRequest {
  // Inclusive Unix timestamp lower bound.
  int64 start_time_unix_seconds = 1;
  // Exclusive Unix timestamp upper bound.
  int64 end_time_unix_seconds = 2;
  // Empty means every pool attribution, including `MIXED`.
  repeated ValuePoolFlowPool pools = 3;
  ValuePoolFlowSummaryResolution resolution = 4;
}

// Exact flow totals for one UTC-aligned bucket.
message ValuePoolFlowSummaryBucket {
  int64 bucket_start_time_unix_seconds = 1;
  uint64 shield_event_count = 2;
  uint64 deshield_event_count = 3;
  uint64 shield_amount_zat = 4;
  uint64 deshield_amount_zat = 5;
}

// `ExplorerQuery.ValuePoolFlowSummary` response.
message ValuePoolFlowSummaryResponse {
  ExplorerFreshness freshness = 1;
  repeated ValuePoolFlowSummaryBucket buckets = 2;
  ValuePoolFlowCoverage coverage = 3;
}

// `ExplorerQuery.ValuePoolFlowAmountThresholdSummary` request.
message ValuePoolFlowAmountThresholdSummaryRequest {
  // Inclusive Unix timestamp lower bound.
  int64 start_time_unix_seconds = 1;
  // Exclusive Unix timestamp upper bound.
  int64 end_time_unix_seconds = 2;
  // Empty means every pool attribution, including `MIXED`.
  repeated ValuePoolFlowPool pools = 3;
  // Strictly increasing unique thresholds, limited to 32 entries.
  repeated uint64 minimum_amounts_zat = 4;
}

// Exact value-pool flow totals at one requested minimum amount.
message ValuePoolFlowAmountThresholdSummaryRow {
  uint64 minimum_amount_zat = 1;
  uint64 shield_event_count = 2;
  uint64 deshield_event_count = 3;
  uint64 shield_amount_zat = 4;
  uint64 deshield_amount_zat = 5;
}

// `ExplorerQuery.ValuePoolFlowAmountThresholdSummary` response.
message ValuePoolFlowAmountThresholdSummaryResponse {
  ExplorerFreshness freshness = 1;
  // Exactly one row per requested threshold, in request order.
  repeated ValuePoolFlowAmountThresholdSummaryRow thresholds = 2;
  ValuePoolFlowCoverage coverage = 3;
}

// `ExplorerQuery.ValuePoolFlowRoundedAmountSummary` request.
message ValuePoolFlowRoundedAmountSummaryRequest {
  // Inclusive Unix timestamp lower bound.
  int64 start_time_unix_seconds = 1;
  // Exclusive Unix timestamp upper bound.
  int64 end_time_unix_seconds = 2;
  // Empty means every pool attribution, including `MIXED`.
  repeated ValuePoolFlowPool pools = 3;
  // Inclusive lower bound applied to each event's raw amount before rounding.
  uint64 minimum_raw_amount_zat = 4;
  // Optional exclusive upper bound applied to each event's raw amount before
  // rounding.
  optional uint64 maximum_raw_amount_zat = 5;
  // Positive zatoshi quantum. Each selected raw amount rounds to the nearest
  // multiple before events are grouped; positive exact-half ties round upward.
  uint64 rounding_quantum_zat = 6;
  // Rows whose combined shield and deshield event count is below this value
  // are omitted. Zero includes every non-empty rounded-amount group.
  uint64 minimum_event_count = 7;
  // Maximum rows to return. Zero requests the server default; larger values
  // are clamped by the server.
  uint32 max_rows = 8;
}

// Exact value-pool flow event counts for one rounded raw amount.
message ValuePoolFlowRoundedAmountSummaryRow {
  // Raw amount rounded according to `rounding_quantum_zat`, with positive
  // exact-half ties rounded upward.
  uint64 rounded_amount_zat = 1;
  uint64 shield_event_count = 2;
  uint64 deshield_event_count = 3;
}

// `ExplorerQuery.ValuePoolFlowRoundedAmountSummary` response.
message ValuePoolFlowRoundedAmountSummaryResponse {
  ExplorerFreshness freshness = 1;
  // Rows are ordered by descending combined shield and deshield event count,
  // then ascending `rounded_amount_zat`. The effective `max_rows` bounds this
  // ranked sequence after the minimum-event-count filter.
  repeated ValuePoolFlowRoundedAmountSummaryRow rows = 2;
  ValuePoolFlowCoverage coverage = 3;
}

// One cumulative balance for a dynamically identified consensus value pool.
message ValuePoolBalance {
  string id = 1;
  bool monitored = 2;
  // Absent when the upstream node advertises the pool without exposing a value.
  optional uint64 value_zat = 3;
}

// One canonical highest-height snapshot observed in a UTC calendar day.
message ValuePoolBalanceHistoryPoint {
  int64 day_start_unix_seconds = 1;
  uint32 block_height = 2;
  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  string block_hash = 3;
  int64 block_time_unix_seconds = 4;
  repeated ValuePoolBalance pools = 5;
}

// Height-domain coverage for cumulative value-pool history.
message ValuePoolBalanceHistoryCoverage {
  optional uint32 historical_from_height = 1;
  optional uint32 historical_through_height = 2;
  optional uint32 live_tail_from_height = 3;
  optional uint32 live_tail_through_height = 4;
  // True only when contiguous coverage starts at height 1 and reaches the
  // response's visible tip. Timestamps never establish this claim.
  bool complete_through_visible_tip = 5;
}

// `ExplorerQuery.ValuePoolBalanceHistory` request.
message ValuePoolBalanceHistoryRequest {
  // Zero asks for the server default; the server clamps larger values.
  uint32 page_size = 1;
  // Opaque continuation bound to the last returned UTC day.
  bytes cursor = 2;
}

// One bounded newest-first page of canonical daily balance snapshots.
message ValuePoolBalanceHistoryResponse {
  ExplorerFreshness freshness = 1;
  repeated ValuePoolBalanceHistoryPoint points = 2;
  bytes next_cursor = 3;
  bool has_more = 4;
  ValuePoolBalanceHistoryCoverage coverage = 5;
}

// `ExplorerQuery.NetworkUpgradeStatus` request.
message NetworkUpgradeStatusRequest {}

// One network-upgrade activation entry projected for explorer consumers.
//
// Sourced from the node-advertised activation table
// (`getblockchaininfo.upgrades`). `active` is `true` when
// `activation_height <= tip_height` in the enclosing response.
message NetworkUpgradeEntry {
  // Upgrade name as reported by the node (for example `"Sapling"`, `"NU5"`,
  // `"NU6"`), carried verbatim so unknown future upgrades still render.
  string name = 1;

  // Consensus branch id in the canonical 8-character lowercase hex form
  // (per the BIP70 / Zebra convention).
  string branch_id_hex = 2;

  // Block height at which this upgrade's rules first apply on the node's
  // network.
  uint32 activation_height = 3;

  // `true` when `activation_height <= tip_height`.
  bool active = 4;
}

// `ExplorerQuery.NetworkUpgradeStatus` response.
//
// Carries the node-advertised upgrade table ordered by ascending activation
// height, the canonical tip height the `active` flags are computed against,
// and the currently-active upgrade's name and branch id for convenience.
message NetworkUpgradeStatusResponse {
  ExplorerFreshness freshness = 1;

  // Canonical tip height the `active` flags and countdown are computed
  // against.
  uint32 tip_height = 2;

  // One entry per advertised upgrade, ordered by ascending activation height.
  repeated NetworkUpgradeEntry upgrades = 3;

  // Name of the upgrade active at `tip_height`, empty when no advertised
  // upgrade has activated yet.
  string active_upgrade_name = 4;

  // Branch id of the upgrade active at `tip_height` in 8-character lowercase
  // hex, empty when no advertised upgrade has activated yet.
  string active_upgrade_branch_id_hex = 5;
}

// Per-row record materialized by `TransparentAddressActivityConsumer`.
//
// Storage-only: never returned directly on the wire. Encoded into the
// `transparent_address_activity` column family value bytes; the key
// carries `(address_script_hash, reverse_height, in_block_position)`.
// The handler projects this onto the wire `TransparentAddressActivityEntry`
// shape and pulls the height + timestamp it already knows from the key.
message TransparentAddressActivityRecord {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  int64 block_time_unix_seconds = 2;
  // Net transparent value the transaction moved for this address
  // (`sum(outputs to address) - sum(prevouts spent from address)`).
  //
  // Set only when `prevout_resolution_status == Resolved` AND every
  // prevout the transaction reads was successfully resolved. Partial
  // resolution leaves this field unset rather than reporting a half-
  // summed value as if it were complete (see ADR-0018).
  optional sint64 net_value_zat = 3;
  uint32 input_count = 4;
  uint32 output_count = 5;
  // Status of the prevout resolution that produced (or did not produce)
  // `net_value_zat`. Always present so consumers can render a chip
  // explaining why `net_value_zat` is unset rather than guessing.
  PrevoutResolutionStatus prevout_resolution_status = 6;
}

// Per-transaction record materialized by `TransactionFeesConsumer`.
//
// Storage-only: never returned directly on the wire. The
// `TransactionDetail` handler reads this record and projects the values
// onto `TransactionDetailResponse`; the `RecentTransactions` handler reads
// it to populate the per-entry `paid_fee_zat`. One record per non-
// coinbase transaction the consumer has indexed; the key is the canonical
// 32-byte transaction id.
message TransactionFeesRecord {
  // Paid fee in zatoshis (`sum(transparent_input_value) -
  // sum(transparent_output_value)`). Set only for fully resolved
  // transparent-only transactions. Shielded and unclassified transactions
  // leave it unset because canonical facts do not retain the value balances
  // required to distinguish shielded transfers from the actual paid fee.
  optional uint64 paid_fee_zat = 1;

  // Status of the prevout resolution that produced `paid_fee_zat`.
  PrevoutResolutionStatus prevout_resolution_status = 2;

  // Per-input transparent prevout values, indexed by transparent input
  // position. Coinbase inputs are not represented (coinbase transactions
  // do not appear in this column family).
  repeated TransparentInputValueRecord transparent_inputs = 3;

  // ZIP-317 logical-action count, mirrored from the parsed component
  // counts so the mempool path can populate `MempoolActivityEntry.logical_actions`
  // without re-parsing.
  uint32 logical_actions = 4;
}

// `ExplorerQuery.RecentTransactions` request.
//
// Streams the newest-first view of canonical transactions materialized
// by `RecentTransactionsConsumer`.
message RecentTransactionsRequest {
  // Hard cap on entries returned across all stream chunks. Server clamps
  // to the configured maximum.
  uint32 max_entries = 1;

  // Empty resumes from the canonical tip. Non-empty resumes strictly
  // after the prior page's last entry.
  bytes from_cursor = 2;
}

// One streaming chunk of `RecentTransactions` entries.
message RecentTransactionsChunk {
  ExplorerFreshness freshness = 1;
  bytes cursor = 2;
  repeated RecentTransactionEntry entries = 3;
}

// One row in the `recent_transactions` materialized view.
//
// Denormalized to keep a recent-transactions panel renderable from one
// streaming RPC. `zip317_conventional_fee_zat` is unset for coinbase rows;
// `paid_fee_zat` is set only when every transparent prevout was resolved.
message RecentTransactionEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex characters).
  string transaction_id = 1;
  uint32 block_height = 2;
  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  string block_hash = 3;
  int64 block_time_unix_seconds = 4;
  bool is_coinbase = 5;
  PrivacyShape privacy_shape = 6;
  TransactionComponentCounts component_counts = 7;
  uint32 size_bytes = 8;
  optional uint64 zip317_conventional_fee_zat = 9;
  optional uint64 paid_fee_zat = 10;
  // ZIP-317 logical-action count before applying the fee layer's grace floor.
  uint32 logical_actions = 11;
}

// Direction from a transaction-history anchor. Responses remain newest-first
// in both directions.
enum TransactionHistoryDirection {
  TRANSACTION_HISTORY_DIRECTION_UNSPECIFIED = 0;
  TRANSACTION_HISTORY_DIRECTION_OLDER = 1;
  TRANSACTION_HISTORY_DIRECTION_NEWER = 2;
}

// Read fence for the transaction-history materialized view and the canonical chain
// snapshot used to produce a response.
message TransactionHistoryReadFence {
  uint64 chain_epoch_id = 1;
  uint64 materialized_view_revision = 2;
  uint32 materialized_view_tip_height = 3;
  string materialized_view_tip_hash = 4;
}

// Verified contiguous coverage of the transaction-history materialized view.
message TransactionHistoryCoverage {
  uint32 complete_from_height = 1;
  uint32 complete_through_height = 2;
  string complete_through_hash = 3;
}

// Scope proven by an optional transaction-history count.
enum TransactionHistoryCountScope {
  TRANSACTION_HISTORY_COUNT_SCOPE_UNSPECIFIED = 0;
  TRANSACTION_HISTORY_COUNT_SCOPE_COVERED_RANGE = 1;
  TRANSACTION_HISTORY_COUNT_SCOPE_FULL_HISTORY = 2;
}

// Shielded protocols whose presence can select transaction-history rows.
enum ShieldedProtocol {
  SHIELDED_PROTOCOL_UNSPECIFIED = 0;
  SHIELDED_PROTOCOL_SPROUT = 1;
  SHIELDED_PROTOCOL_SAPLING = 2;
  SHIELDED_PROTOCOL_ORCHARD = 3;
  SHIELDED_PROTOCOL_IRONWOOD = 4;
}

// Product-neutral filters over retained public transaction facts. Repeated
// fields use OR semantics within the field and AND semantics across fields.
message TransactionHistoryFilter {
  optional bool is_coinbase = 1;
  repeated PrivacyShape privacy_shapes = 2;
  repeated ShieldedProtocol contains_any_protocol = 3;
  // Require at least one shielded component count to meet this threshold.
  // Zero disables the threshold.
  uint32 minimum_shielded_component_count = 4;
}

// Canonical transaction coordinate accepted as a stateless starting point.
//
// Native clients should resume with an opaque cursor; compatibility adapters
// can map a height/index pair through this shape.
message TransactionHistoryAnchor {
  uint32 block_height = 1;
  uint32 transaction_index = 2;
}

// `ExplorerQuery.TransactionHistory` request.
message TransactionHistoryRequest {
  // Zero asks for the server default; the server clamps larger values.
  uint32 page_size = 1;
  oneof start {
    bytes cursor = 2;
    TransactionHistoryAnchor anchor = 3;
  }
  TransactionHistoryDirection direction = 4;
  TransactionHistoryFilter filter = 5;
  // Exact counts are optional and may be unavailable for a filter.
  bool include_total_count = 6;
  TransactionHistoryReadFence read_fence = 7;
}

// One bounded canonical transaction-history page.
message TransactionHistoryResponse {
  ExplorerFreshness freshness = 1;
  repeated TransactionHistoryEntry entries = 2;
  bytes older_cursor = 3;
  bytes newer_cursor = 4;
  bool has_older = 5;
  bool has_newer = 6;
  optional uint64 total_matching_transactions = 7;
  uint32 scanned_entry_count = 8;
  bool scan_limit_reached = 9;
  TransactionHistoryReadFence read_fence = 10;
  TransactionHistoryCoverage coverage = 11;
  TransactionHistoryCountScope count_scope = 12;
}

// Signed transaction-intrinsic shielded value balances.
//
// Values use Zebra's transaction-pool sign convention: positive value enters
// the transaction from the named pool, while negative value leaves the
// transaction for that pool. Transparent value is deliberately absent because
// it requires resolving previous outputs.
message TransactionIntrinsicValueBalances {
  sint64 sprout_zat = 1;
  sint64 sapling_zat = 2;
  sint64 orchard_zat = 3;
  sint64 ironwood_zat = 4;
}

// One canonical transaction-history row.
message TransactionHistoryEntry {
  // Canonical transaction id in RPC byte order (64 lowercase hex
  // characters). Reference: Zcash protocol spec term `\rpcByteOrder`.
  string transaction_id = 1;
  uint32 block_height = 2;
  // Canonical block hash in RPC byte order (64 lowercase hex characters).
  // Reference: Zcash protocol spec term `\rpcByteOrder`.
  string block_hash = 3;
  int64 block_time_unix_seconds = 4;
  bool is_coinbase = 5;
  PrivacyShape privacy_shape = 6;
  TransactionComponentCounts component_counts = 7;
  uint32 size_bytes = 8;
  optional uint64 zip317_conventional_fee_zat = 9;
  optional uint64 paid_fee_zat = 10;
  // ZIP-317 logical-action count for the transaction. Always set,
  // including for coinbase (which contributes a single transparent
  // output and therefore logical_actions = 1 after the GRACE_ACTIONS
  // floor is applied at the fee layer, but the unfloored count here is
  // the raw shape value).
  uint32 logical_actions = 11;
  // Canonical zero-based position inside the block.
  uint32 transaction_index = 12;
  // Present when the canonical schema-15-or-newer intrinsic-balance artifact,
  // or a retained canonical transaction blob that can derive it, is available
  // at the response's pinned chain epoch. Absence is distinct from an all-zero
  // balance and is gated by
  // `explorer.transaction.intrinsic_value_balances_v1`.
  TransactionIntrinsicValueBalances intrinsic_value_balances = 13;
}

// `ExplorerQuery.MempoolEventCounts` request.
//
// Returns rolling counts of `Added`, `Mined`, and `Invalidated` mempool
// events from the per-second counter column family
// `MempoolEventCountsConsumer` writes. The server clamps `window_seconds`
// to `[60, 3600]`; passing zero asks for the server default (300).
message MempoolEventCountsRequest {
  uint32 window_seconds = 1;
}

// `ExplorerQuery.MempoolEventCounts` response.
message MempoolEventCountsResponse {
  ExplorerFreshness freshness = 1;

  // Effective window size after server clamping.
  uint32 window_seconds = 2;

  // Number of `Added` events the source emitted during the window.
  uint32 added_count = 3;

  // Number of `Mined` events the source emitted during the window.
  uint32 mined_count = 4;

  // Number of `Invalidated` events the source emitted during the window.
  uint32 invalidated_count = 5;

}

// `ExplorerQuery.ChainReorgHistory` request.
//
// Reads the durable reorg-incident materialized view as a bounded stateless page.
// The materialized view backfills from the earliest retained chain event when the
// materialized-view consumer first runs, then keeps future incidents independently of
// chain-event retention. It cannot reconstruct incidents that were pruned
// before the materialized view existed.
message ChainReorgHistoryRequest {
  // Maximum incident rows to return. Zero selects the server default; values
  // above the server cap are clamped.
  uint32 max_events = 1;

  // Empty starts at the earliest recorded incident. Non-empty resumes strictly
  // after this opaque cursor from a previous response or event.
  bytes from_cursor = 2;
}

// `ExplorerQuery.ChainReorgHistory` response.
message ChainReorgHistoryResponse {
  ExplorerFreshness freshness = 1;

  // Recorded reorg incidents, ordered by ascending chain-event sequence.
  repeated ChainReorgHistoryEvent events = 2;

  // Opaque cursor for the next bounded page. Empty means this response reached
  // the current end of recorded reorg incidents.
  bytes next_cursor = 3;
}

// One recorded chain reorg incident projected for explorer consumers.
message ChainReorgHistoryEvent {
  // Monotonic sequence in the chain-event stream.
  uint64 event_sequence = 1;

  // Opaque cursor for resuming strictly after this reorg event.
  bytes cursor = 2;

  // Chain epoch visible after the reorg was committed.
  uint64 chain_epoch_id = 3;

  // Zinder wall-clock creation time for the post-reorg chain epoch.
  uint64 chain_epoch_created_at_millis = 4;

  // Best visible block after the reorg.
  zinder.v1.wallet.BlockTip visible_tip = 5;

  // Highest settled block after the reorg.
  zinder.v1.wallet.BlockTip settled_tip = 6;

  // Previously visible range invalidated by this reorg.
  zinder.v1.wallet.ChainRangeReverted reverted = 7;

  // Replacement range committed by this reorg.
  zinder.v1.wallet.ChainEpochCommitted committed = 8;
}

// One transparent coinbase payout retained with a displaced block.
//
// The native contract exposes the raw script instead of an address string so
// network-specific encodings and miner branding remain consumer concerns.
message DisplacedBlockCoinbaseOutput {
  uint32 output_index = 1;
  uint64 value_zat = 2;
  bytes script_pub_key = 3;
}

// Product-neutral facts captured when a previously canonical block is
// displaced by an accepted replacement branch.
message DisplacedBlockSummary {
  uint32 block_height = 1;
  string block_hash = 2;
  string previous_block_hash = 3;
  int64 block_time_unix_seconds = 4;
  uint64 total_size_bytes = 5;
  uint32 difficulty_bits = 6;
  repeated string transaction_ids = 7;
  repeated DisplacedBlockCoinbaseOutput coinbase_outputs = 8;
  uint64 displacement_event_sequence = 9;
  uint64 displacement_epoch_id = 10;
  uint64 displaced_at_millis = 11;
}

// Current canonical block facts compared with one displaced block at the same
// height.
//
// This deliberately stays narrower than `BlockSummary`: every field is
// read directly from the pinned canonical store and no materialized-view-only aggregate
// is silently emitted as zero.
message DisplacedBlockCanonicalCounterpart {
  uint32 block_height = 1;
  string block_hash = 2;
  string previous_block_hash = 3;
  int64 block_time_unix_seconds = 4;
  uint64 total_size_bytes = 5;
  uint32 difficulty_bits = 6;
  uint32 transaction_count = 7;
  repeated DisplacedBlockCoinbaseOutput coinbase_outputs = 8;
}

// One displaced block and the canonical block currently visible at its former
// height, both resolved against the response freshness epoch.
message DisplacedBlockHistoryEntry {
  DisplacedBlockSummary block = 1;
  DisplacedBlockCanonicalCounterpart current_canonical_block = 2;
}

// Explicit coverage boundary for the additive displaced-block archive.
//
// The archive guarantees capture only for replacement events at or after this
// activation event. It does not claim historical completeness before then.
message DisplacedBlockArchiveCoverage {
  uint64 activation_event_sequence = 1;
  uint64 activation_epoch_id = 2;
  uint64 activated_at_millis = 3;
}

// `ExplorerQuery.DisplacedBlockHistory` request.
message DisplacedBlockHistoryRequest {
  // Maximum rows to return. Zero selects the server default; values above the
  // server cap are clamped.
  uint32 page_size = 1;
  // Empty starts at the newest archived block. Non-empty resumes strictly
  // after this opaque cursor from a previous response.
  bytes cursor = 2;
}

// `ExplorerQuery.DisplacedBlockHistory` response.
message DisplacedBlockHistoryResponse {
  ExplorerFreshness freshness = 1;
  // Newest displacement first; blocks from one event are ordered by descending
  // former height.
  repeated DisplacedBlockHistoryEntry entries = 2;
  bytes next_cursor = 3;
  bool has_more = 4;
  uint64 total_count = 5;
  DisplacedBlockArchiveCoverage coverage = 6;
}

// `ExplorerQuery.DisplacedBlockDetail` request.
message DisplacedBlockDetailRequest {
  // Displaced block hash in RPC byte order.
  string block_hash = 1;
}

// `ExplorerQuery.DisplacedBlockDetail` response.
message DisplacedBlockDetailResponse {
  ExplorerFreshness freshness = 1;
  DisplacedBlockSummary block = 2;
  // Current canonical block at the displaced block's former height, resolved
  // against the same freshness epoch. Absent if that height is unavailable.
  DisplacedBlockCanonicalCounterpart current_canonical_block = 3;
  // Serialized consensus bytes only when they were already retained before
  // displacement. Absence is unavailable data, never an empty block.
  optional bytes raw_block_bytes = 4;
  DisplacedBlockArchiveCoverage coverage = 5;
}

// Typed error returned when a materialized-view RPC cursor has expired.
//
// Per the explorer-plane cursor contract (see
// `docs/architecture/explorer-plane.md`): cursors are valid for the
// lifetime of the column-family snapshot at issue time. The server
// rejects a cursor that references a height range no longer in the store
// (reorged out, or rolled off retention) with this typed error attached
// to the gRPC status's `details`. Consumers re-issue from the start of
// the range or jump to `recommended_resume_height`.
message CursorExpiredError {
  // Recommended restart height for a fresh
  // cursor. Set to the canonical tip when the consumer should restart at
  // the head of the materialized view; set to the lowest still-indexed height
  // when the consumer should restart earlier.
  uint32 recommended_resume_height = 1;

  // Short reason hint a UI can render verbatim. The canonical sentences
  // live in `crates/zinder-core/src/explorer_reasons.rs`.
  string hint = 2;
}

// `ExplorerQuery.OverviewSnapshot` request.
//
// All limit fields clamp at the server side: zero requests the default,
// values above the cap are silently lowered. Callers receive the
// effective values back inside the response (`recent_blocks.len()`,
// `recent_transactions.len()`, `mempool_events.window_seconds`,
// `fee_summary.block_count`).
message OverviewSnapshotRequest {
  // Number of `recent_blocks` entries to return, newest-first.
  // Range `[1, 16]`; default 8 when zero.
  uint32 recent_blocks_limit = 1;

  // Number of `recent_transactions` entries to return, newest-first.
  // Drives both the recent-transactions list and the privacy-mix
  // aggregation on the consumer side. Range `[1, 64]`; default 32 when
  // zero.
  uint32 recent_transactions_limit = 2;

  // Sliding-window size for `mempool_events` in seconds. Range
  // `[60, 3600]`; default 300 when zero. Matches the clamp range of
  // `MempoolEventCountsRequest.window_seconds`.
  uint32 mempool_window_seconds = 3;

  // Lookback for `fee_summary`, in blocks ending at the snapshot's tip.
  // Range `[1, 256]`; default 50 when zero. Matches the per-request cap
  // of `FeeSummaryRequest`.
  uint32 fee_summary_block_count = 4;
}

// `ExplorerQuery.OverviewSnapshot` response.
//
// All present sub-fields are read against the snapshot identified by
// `freshness.chain_view.chain_epoch`; the bundle never spans two tips. Optional
// fields whose wallet capability is structurally unavailable are identified in
// `freshness.unavailable`. The handler reads the wallet tip once and every
// materialized-view field once, in one pass, then assembles the single
// freshness envelope. Consumers compare the chain epoch's `chain_epoch_id` and
// `visible_tip` across responses to detect snapshot boundary crosses.
message OverviewSnapshotResponse {
  // Cross-cutting envelope (field tag 1 per ADR-0011). Single freshness
  // for the entire bundle.
  ExplorerFreshness freshness = 1;

  // Header-block timestamp of the snapshot's tip. Surfaced separately
  // from `ChainEpoch` because the current `wallet.ChainEpoch` does not
  // carry block time; consumers render "Ns ago" without a second lookup.
  // Set to zero when the upstream has no committed blocks.
  int64 tip_block_time_unix_seconds = 2;

  // Mempool snapshot (counts and freshness extremes) at the bundle's
  // observation instant. Absent when the wallet query structurally lacks
  // `wallet.snapshot.mempool_v3`; `freshness.unavailable` then contains the
  // field path `mempool`.
  OverviewMempool mempool = 3;

  // Rolling counts of mempool events over a sliding window ending at the
  // bundle's observation instant.
  OverviewMempoolEvents mempool_events = 4;

  // Fee summary over the last `fee_summary_block_count` blocks ending at
  // the snapshot's tip.
  OverviewFeeSummary fee_summary = 5;

  // Chain-wide value pool totals at the snapshot's tip. Preserves
  // upstream order so unknown future pools flow through without a wire
  // shape change. When the wallet query structurally lacks
  // `wallet.read.chain_value_pools_at_tip_v1`, this list is empty and
  // `freshness.unavailable` contains the field path `value_pools`, which
  // distinguishes unavailable data from an observed empty list.
  repeated zinder.v1.wallet.ChainValuePool value_pools = 6;

  // Top-K block summaries ending at the snapshot's tip, ordered by
  // descending height. `recent_blocks[0]` is the tip; `recent_blocks[K-1]`
  // is the oldest entry in the window.
  repeated BlockSummary recent_blocks = 7;

  // Top-N recent canonical transactions, newest-first. The consumer
  // uses this single array for both the "recent transactions" list
  // (typically the first 8) and the "privacy mix" aggregation (typically
  // all 32). Mirrors the per-entry shape `TransactionHistoryEntry`
  // returned by `ExplorerQuery.RecentTransactions`.
  repeated TransactionHistoryEntry recent_transactions = 8;
}

// Mempool sub-field of `OverviewSnapshotResponse`.
//
// Mirrors the counts and freshness extremes from `MempoolSummaryResponse`.
// The distribution arrays (`privacy_shape_distribution`,
// `version_distribution`) are deliberately omitted from the bundle: the
// overview surface aggregates privacy shape from `recent_transactions`
// instead, and the version distribution is a per-feature concern served
// by `ExplorerQuery.MempoolSummary` for callers that need it.
message OverviewMempool {
  // Number of transactions in the snapshot.
  uint32 transaction_count = 1;

  // Sum of `size_bytes` across every entry.
  uint64 total_size_bytes = 2;

  // Age of the oldest mempool entry vs. the bundle's observation instant.
  // Zero when the snapshot is empty.
  uint64 oldest_entry_age_millis = 3;

  // Age of the newest mempool entry vs. the bundle's observation instant.
  // Zero when the snapshot is empty.
  uint64 newest_entry_age_millis = 4;
}

// Mempool-event sub-field of `OverviewSnapshotResponse`.
//
// Mirrors `MempoolEventCountsResponse`. The `window_seconds` field is the
// effective server-clamped value, not the requested value; consumers can
// rely on it for cadence math without echoing the request.
message OverviewMempoolEvents {
  // Effective window size after server clamping.
  uint32 window_seconds = 1;

  // Number of `Added` events the source emitted during the window.
  uint32 added_count = 2;

  // Number of `Mined` events the source emitted during the window.
  uint32 mined_count = 3;

  // Number of `Invalidated` events the source emitted during the window.
  uint32 invalidated_count = 4;

}

// Fee-summary sub-field of `OverviewSnapshotResponse`.
//
// Mirrors `FeeSummaryResponse`. The values aggregate ZIP-317
// conventional-fee floors across non-coinbase transactions in the last
// `block_count` blocks ending at the snapshot's tip.
message OverviewFeeSummary {
  // Effective number of blocks the aggregate was computed over after
  // server clamping. Identical to `recent_blocks.len()` only when the
  // caller's `recent_blocks_limit` equals `fee_summary_block_count`;
  // otherwise the two windows can differ.
  uint32 block_count = 1;

  // Number of non-coinbase transactions in the aggregate. Zero when the
  // window contains only coinbases.
  uint32 transaction_count = 2;

  // Sum of `zip317_conventional_fee_zat` across the window. Zero when
  // `transaction_count == 0`.
  uint64 total_zip317_conventional_fee_zat = 3;

  // Smallest `zip317_conventional_fee_zat` observed in the window. Zero
  // when `transaction_count == 0`.
  uint64 min_zip317_conventional_fee_zat = 4;

  // Largest `zip317_conventional_fee_zat` observed in the window. Zero
  // when `transaction_count == 0`.
  uint64 max_zip317_conventional_fee_zat = 5;
}
