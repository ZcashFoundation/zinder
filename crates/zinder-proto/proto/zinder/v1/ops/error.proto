// Stable error-reason vocabulary attached to every Zinder gRPC `Status`
// via `google.rpc.ErrorInfo` (carried by `tonic_types::ErrorDetails`).
//
// The outer `Status` code stays the canonical gRPC retry signal; the
// `ErrorReason` is the typed name a client maps to local handling
// decisions (retry policy, alerting, operator action). The proto enum is
// the documented source of truth; the Rust hand-written `QueryError` and
// `StoreError` enums map each variant to a reason at the gRPC adapter
// boundary.
//
// See:
// - docs/reference/error-vocabulary.md
// - docs/architecture/public-interfaces.md (Error vocabulary)

syntax = "proto3";

package zinder.v1.ops;

// Stable reason attached as `google.rpc.ErrorInfo.reason` on every gRPC
// `Status` returned by a Zinder service. The `domain` is `zinder.dev`.
// Auxiliary detail (resource family/key, precondition subject, field
// violations) continues to ride alongside via the existing
// `tonic_types::ErrorDetails` shapes (`ResourceInfo`, `PreconditionFailure`,
// `BadRequest`).
//
// Additive reasons reserve a new scalar code. Renaming, removing, or changing
// an existing reason's semantics is a breaking native-contract change: bump
// `WalletServerInfo.contract_revision`, reserve any removed name and scalar,
// and cut controlled consumers over with the server.
enum ErrorReason {
  reserved "COMPACT_BLOCK_RANGE_TOO_LARGE";

  // Default scalar so unset fields do not silently match a real reason.
  ERROR_REASON_UNSPECIFIED = 0;

  // INVALID_ARGUMENT family.
  INVALID_BLOCK_RANGE = 1;
  BLOCK_RANGE_TOO_LARGE = 2;
  CHAIN_EVENT_CURSOR_INVALID = 3;
  ADDRESS_OUTPUT_CURSOR_INVALID = 4;
  TRANSPARENT_HISTORY_CURSOR_INVALID = 5;
  INVALID_ADDRESS = 6;
  UNSUPPORTED_SHIELDED_PROTOCOL = 7;
  INVALID_CHAIN_STORE_OPTIONS = 8;
  ARTIFACT_PAYLOAD_TOO_LARGE = 9;
  INVALID_CHAIN_EPOCH_ARTIFACTS = 10;
  TRANSPARENT_BALANCE_ADDRESS_COUNT_EXCEEDED = 43;
  SNAPSHOT_PAGE_CURSOR_INVALID = 44;
  BROADCAST_TRANSACTION_TOO_LARGE = 46;
  SUBTREE_ROOT_RANGE_TOO_LARGE = 49;

  // FAILED_PRECONDITION family.
  BROADCAST_DISABLED = 11;
  CHAIN_EVENT_CURSOR_EXPIRED = 12;
  MEMPOOL_EVENT_CURSOR_EXPIRED = 13;
  SNAPSHOT_PAGE_CURSOR_EXPIRED = 45;
  CHAIN_EPOCH_PIN_UNAVAILABLE = 15;
  SCHEMA_MISMATCH = 17;
  SCHEMA_TOO_NEW = 18;
  REORG_WINDOW_EXCEEDED = 19;
  CHAIN_EPOCH_CONFLICT = 20;
  CHAIN_EPOCH_NETWORK_MISMATCH = 21;

  // NOT_FOUND family.
  ARTIFACT_UNAVAILABLE = 22;
  CHAIN_EPOCH_MISSING = 23;
  BLOCK_NOT_IN_BEST_CHAIN = 24;

  // DATA_LOSS family.
  COMPACT_BLOCK_PAYLOAD_MALFORMED = 25;
  ARTIFACT_CORRUPT = 26;

  // UNAVAILABLE family.
  UNSUPPORTED_CHAIN_EVENT = 27;
  UNSUPPORTED_BLOCK_SELECTOR = 28;
  UNSUPPORTED_TRANSACTION_STATUS = 29;
  BLOCKING_TASK_FAILED = 30;
  NODE_UNAVAILABLE = 31;
  STORAGE_UNAVAILABLE = 32;
  UNSUPPORTED_WALLET_ENCODING = 47;

  // INTERNAL family.
  ENTROPY_UNAVAILABLE = 33;
  EXPLORER_INTERNAL = 37;

  // FAILED_PRECONDITION family (materialized-view and node-capability gates).
  MATERIALIZED_VIEW_UNAVAILABLE = 34;
  NODE_CAPABILITY_MISSING = 36;
  EXPLORER_PRECONDITION_UNSATISFIED = 40;
  ENDPOINT_CAPABILITY_UNAVAILABLE = 48;

  // UNAVAILABLE family.
  NO_VISIBLE_CHAIN_EPOCH = 38;

  // UNIMPLEMENTED family.
  EXPLORER_METHOD_DISABLED = 39;

  // FAILED_PRECONDITION family (operator must reconfigure the deployment).
  // A federated dependency the request needs (the canonical store, a
  // materialized view, or a wallet-query endpoint) is not wired on this deployment.
  // Waiting never clears it; the operator must configure the dependency.
  DEPENDENCY_NOT_CONFIGURED = 41;

  // UNAVAILABLE family.
  // A configured federated endpoint is temporarily unreachable (cold start,
  // restart, or transient network fault). Retrying with backoff clears it.
  UPSTREAM_UNREACHABLE = 42;

  // UNAVAILABLE family.
  // The process is alive but its shared readiness gate is closed. ErrorInfo
  // metadata carries the stable `readiness_cause` label; `/readyz` carries
  // any structured cause detail.
  SERVICE_NOT_READY = 50;

  // NOT_FOUND family.
  // Proven absence answered by `WalletQuery.Transaction`: the transaction is
  // in neither the canonical chain of the answering epoch nor, for a lookup
  // without `at_epoch_id`, the writer's live mempool at that same epoch, and
  // the store retains complete canonical history. ErrorInfo metadata carries
  // `chain_epoch_id`, `first_covered_height`, `visible_tip_height`, and
  // `covers_mempool`. No other failure carries this reason; every other
  // NOT_FOUND on that method is a failure, not an absence.
  TRANSACTION_NOT_FOUND = 51;

  // FAILED_PRECONDITION family.
  // The store's retained canonical history starts after a checkpoint, so a
  // lookup that must cover earlier heights cannot be answered. ErrorInfo
  // metadata carries `first_available_height`. Waiting never clears it;
  // query a store with complete history.
  CANONICAL_HISTORY_UNAVAILABLE = 52;
}
