[package]
name = "zinder-proto"
version.workspace = true
description = "Zinder-owned generated protocol modules"
edition.workspace = true
readme = "README.md"
keywords = ["zcash", "indexer", "protocol"]
categories = ["network-programming"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
include = [
    "/src/**",
    "/generated/**",
    "/proto/**",
    "/Cargo.toml",
    "/README.md",
]

[dependencies]
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tonic-types.workspace = true
thiserror.workspace = true
zinder-core = { version = "0.12.0", path = "../zinder-core", default-features = false }

[package.metadata.cargo-machete]
# The checked-in generated modules reference these crates directly.
ignored = ["prost", "tonic", "tonic-prost"]

[dev-dependencies]
eyre.workspace = true
prost-types.workspace = true

[lints]
workspace = true
