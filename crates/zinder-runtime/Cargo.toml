[package]
name = "zinder-runtime"
version.workspace = true
description = "Operational HTTP surface and shared configuration loader for Zinder service binaries"
edition.workspace = true
readme = "../../README.md"
keywords = ["zcash", "indexer", "operations"]
categories = ["network-programming"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
flate2.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
hyper = { workspace = true, features = ["http2"] }
hyper-util = { workspace = true, features = ["http2", "server-auto"] }
ipnet.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
parking_lot.workspace = true
pasta_curves.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
slab.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic = { workspace = true, features = ["transport"] }
tonic-health.workspace = true
tonic-reflection.workspace = true
tonic-types.workspace = true
tonic-web.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["cors", "validate-request"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zinder-core.workspace = true
zinder-proto.workspace = true
zinder-source.workspace = true
zinder-store.workspace = true
zstd = "0.14.5"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["param"] }
tikv-jemallocator.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
raw-cpuid.workspace = true
x86_64.workspace = true

[dev-dependencies]
base64.workspace = true
axum = { workspace = true, features = ["ws"] }
eyre.workspace = true
h2.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http2"] }
hyper-util = { workspace = true, features = ["http2"] }
opentelemetry-proto.workspace = true
prost.workspace = true
prost-types.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "test-util", "time"] }
tokio-stream.workspace = true
tonic-prost.workspace = true
zinder-testkit.workspace = true

[lints]
workspace = true
